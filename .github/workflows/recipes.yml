name: Recipes

# Validate recipe YAML changes against the renderer that publishes them
# (recipes.vllm.ai). The check logic lives in vllm-project/recipes and tracks
# its main branch, so a PR is held to the same validation that runs when
# vllm-project/recipes picks up this directory after merge. The Markdown
# recipes under recipes/<vendor>/ are not checked here.

on:
  pull_request:
    paths:
      - 'recipes/manifest.yaml'
      - 'recipes/models/**'
      - '.github/workflows/recipes.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Recipes
    if: github.repository_owner == 'vllm-project'
    uses: vllm-project/recipes/.github/workflows/validate-recipes.yml@main
    with:
      source: vllm-omni
      path: recipes
