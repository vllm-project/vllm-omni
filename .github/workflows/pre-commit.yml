name: pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # for manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Test offline dependency declaration checker
        run: |
          python -m pip install 'pytest==9.1.1' 'pytest-xdist==3.8.0' 'pytest-asyncio==1.4.0' 'packaging>=24.0' 'tomli>=2.0; python_version < "3.11"'
          python -m pytest --confcutdir=tests/tools tests/tools/test_check_import_dependencies.py -q
      - uses: pre-commit/action@v3.0.1
        # Don't run historical-debt hooks against the whole tree in CI yet.
        # They still run locally on changed files.
        env:
          SKIP: check-mark,markdownlint-cli2,shellcheck,check-spdx-header,mypy-3.10
