name: HunYuanImage CI Benchmark

on:
  push:
    branches: [main, master]
    paths:
      - 'benchmarks/diffusion/**'
      - 'vllm/model_executor/model_loader/**'
      - 'vllm/model_executor/models/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'benchmarks/diffusion/**'
      - 'vllm/model_executor/model_loader/**'
      - 'vllm/model_executor/models/**'
  schedule:
    # 每天 UTC 时间 00:00 运行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Model path or HF repo'
        required: true
        default: './HunyuanImage-3.0'
      tensor_parallel_size:
        description: 'Tensor parallel size'
        required: true
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '4'
          - '8'

env:
  PYTHON_VERSION: '3.10'
  PYTORCH_VERSION: '2.3.0'

jobs:
  benchmark:
    runs-on: [self-hosted, gpu, a100]
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
        pip install pandas matplotlib seaborn

    - name: Download model (if needed)
      if: ${{ github.event.inputs.model_path }}
      run: |
        huggingface-cli download ${{ github.event.inputs.model_path }} --local-dir ./HunyuanImage-3.0
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}

    - name: Run CI Benchmark
      run: |
        python benchmarks/diffusion/hunyuan_ci_benchmark.py \
          --model ./HunyuanImage-3.0 \
          --tensor-parallel-size ${{ github.event.inputs.tensor_parallel_size || 4 }} \
          --num-steps 50 \
          --guidance-scale 5.0 \
          --seed 1234 \
          --output-dir benchmark_results
      env:
        CUDA_VISIBLE_DEVICES: '0,1,2,3'

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results-${{ github.sha }}
        path: benchmark_results/
        retention-days: 30

    - name: Compare with baseline
      run: |
        python benchmarks/diffusion/performance_dashboard/compare_benchmarks.py \
          --current benchmark_results/*.json \
          --baseline benchmarks/diffusion/performance_dashboard/baseline.json \
          --output benchmark_results/comparison_report.md

    - name: Upload comparison report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: comparison-report-${{ github.sha }}
        path: benchmark_results/comparison_report.md
        retention-days: 7

    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'benchmark_results/comparison_report.md';
          
          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📊 HunYuanImage CI Benchmark Results\n\n' + report
            });
          }

    - name: Check for performance regression
      run: |
        python benchmarks/diffusion/performance_dashboard/check_regression.py \
          --current benchmark_results/*.json \
          --baseline benchmarks/diffusion/performance_dashboard/baseline.json \
          --threshold 0.10
      continue-on-error: false
