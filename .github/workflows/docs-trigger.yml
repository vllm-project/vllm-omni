name: Docs PR Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  # Separate things with the ready label into their own concurrency group.
  # We need to carefully handle the case where `ready` is not the label added,
  # because adding a different label to a PR with `ready` shouldn't retrigger.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number }}-needs_docs-${{
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready')
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    # Similarly, we don't trigger if it's a labeled event that has ready, but it
    # was a different label that was added, because then it would build but just
    # put it in the -false concurrency group.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ready')

    runs-on: ubuntu-22.04
    env:
      READTHEDOCS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[docs]"

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Upload preview to Read the Docs
        # RTD_TOKEN is not available in forks
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: readthedocs/upload-action@v1
        with:
          token: ${{ secrets.RTD_TOKEN }}
          project-slug: vllm-omni
          html-dir: site
