# Advanced setup so CodeQL runs as a pull request check, including PRs opened
# from forks. Default setup only scans pushes to the default branch and skips
# fork PRs. After this workflow is on main, disable CodeQL default setup in
# the repository security settings; otherwise GitHub blocks these uploads.

name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # One job keeps a single "CodeQL / Analyze" check. Per-language
          # progress stays in this job's log. Categories stay /language:<name>.
          languages: actions, javascript-typescript, python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
