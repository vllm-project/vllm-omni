# Haru-4B deploy: one AR stage, one resumable request per full-duplex conversation.
# Topology declared in vllm_omni/model_executor/models/haru/pipeline.py.
#
# Every 133 ms frame a conversation appends one position (user audio latent +
# previous text token + previous model audio latent). The MeanFlow head and the
# VibeVoice codec run in model hooks of the same engine step, so the frame's
# audio leaves in the step that produced it. Fields omitted from the stage fall
# back to StageDeployConfig defaults (see vllm_omni/config/stage_config.py).
#
# To serve more conversations, raise duplex_session.max_sessions and the stage's
# max_num_seqs together, and grow kv_cache_memory_bytes with them.
pipeline: haru
session_mode: duplex
duplex_session:
  max_sessions: 2
  # session.created echoes the voice reference (up to 180 s of audio).
  max_pending_output_bytes_per_session: 67108864
  # A short silent session at startup, before clients are admitted.
  warmup_frames: 8

async_chunk: false
dtype: bfloat16

stages:
  - stage_id: 0
    max_num_seqs: 2
    # 60 minutes of conversation (7.5 frames per second) plus the prompt.
    max_model_len: 32768
    # Cache for max_num_seqs conversations of max_model_len positions.
    kv_cache_memory_bytes: 8589934592  # 8 GiB
    skip_tokenizer_init: true
    # Prompt ids are placeholders; the real inputs are per-conversation embeddings,
    # so token-ID prefix caching is invalid.
    enable_prefix_caching: false
    # Every conversation appends one frame per step; synchronous scheduling
    # keeps all waiting frames in the same step.
    async_scheduling: false
    max_num_batched_tokens: 2048
    default_sampling_params:
      temperature: 0.7
      top_k: 25
      repetition_penalty: 1.0
      max_tokens: 1
