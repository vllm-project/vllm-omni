# Minimal eager-only VibeVoice deployment.
# Checkpoint: vibevoice/VibeVoice-1.5B-hf (native HF schema, single speaker).
async_chunk: false
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0"
    enforce_eager: true
    max_model_len: 16384
    gpu_memory_utilization: 0.9
    # Positive KV for max_num_seqs * max_model_len = 4 * 16384 tokens at
    # 28 KiB/token (~1.75 GiB) plus page-rounding headroom. The model-owned
    # negative KV pool (same size) is allocated at load and counted as model memory.
    kv_cache_memory_bytes: 2147483648  # 2 GiB
    max_num_seqs: 4
    async_scheduling: false
    max_num_batched_tokens: 1024
    engine_extras:
      attention_config:
        backend: FLASH_ATTN
        flash_attn_version: 3
    default_sampling_params:
      max_tokens: 16384
