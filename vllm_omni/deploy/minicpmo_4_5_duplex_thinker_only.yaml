# MiniCPM-o 4.5 Thinker-only full-duplex deploy on one GPU.
#
# Only Stage 0 runs and replies are text. This standalone profile does not
# inherit minicpmo_4_5.yaml's connectors or Stage 1/2 overrides.
pipeline: minicpmo_4_5_thinker_only
model_runner: v2
async_chunk: false
session_mode: duplex
duplex_session:
  # Matches Stage 0 max_num_seqs below.
  max_sessions: 16

trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.85
    enforce_eager: false
    # The duplex KV window (duplex/window_kv.py) refuses the prefix cache.
    enable_prefix_caching: false
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    devices: "0"
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
      image: 64
      audio: 64
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

platforms:
  cuda:
    stages:
      - stage_id: 0
        # Match minicpmo_4_5.yaml's Stage 0; a fixed budget skips post-warmup KV sizing.
        kv_cache_memory_bytes: 8589934592  # 8 GiB
        # Match the CUDA normalization path in minicpmo_4_5.yaml.
        kernel_config:
          ir_op_priority:
            rms_norm: [native]
            fused_add_rms_norm: [native]
        compilation_config:
          custom_ops: [none, +silu_and_mul, +rotary_embedding]
          pass_config:
            fuse_norm_quant: false
            fuse_act_quant: false
            enable_qk_norm_rope_fusion: false
        attention_backend: TRITON_ATTN
