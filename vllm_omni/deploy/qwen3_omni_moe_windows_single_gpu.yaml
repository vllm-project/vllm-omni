# Windows single-GPU Qwen3-Omni-MoE smoke deploy.
#
# This is intentionally conservative. It was validated on an RTX PRO 6000
# Blackwell-class GPU with the Windows CUDA source build of vLLM, and keeps all
# three stages on one device for audio-in/audio-out streaming smoke tests.
pipeline: qwen3_omni_moe
async_chunk: true

trust_remote_code: true
distributed_executor_backend: "mp"
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_num_batched_tokens: 4096
    max_model_len: 2048
    gpu_memory_utilization: 0.70
    enforce_eager: true
    attention_backend: TRITON_ATTN
    mm_encoder_attn_backend: TORCH_SDPA
    mm_processor_cache_gb: 0
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 48
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    max_num_batched_tokens: 2048
    max_model_len: 2048
    gpu_memory_utilization: 0.18
    enforce_eager: true
    attention_backend: TRITON_ATTN
    mm_encoder_attn_backend: TORCH_SDPA
    mm_processor_cache_gb: 0
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 256
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    devices: "0"
    max_num_seqs: 1
    max_num_batched_tokens: 4096
    max_model_len: 4096
    gpu_memory_utilization: 0.05
    enforce_eager: true
    attention_backend: TRITON_ATTN
    mm_encoder_attn_backend: TORCH_SDPA
    async_scheduling: false
    mm_processor_cache_gb: 0
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.1
