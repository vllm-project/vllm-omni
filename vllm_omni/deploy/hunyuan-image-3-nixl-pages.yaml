# H20 pair: matching FP8 weights on both stages, BF16 native KV, TP1 -> TP1.
pipeline: hunyuan_image_3_moe
async_chunk: false
trust_remote_code: true

stages:
  - stage_id: 0
    is_comprehension: true
    final_output: true
    final_output_type: text
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    max_model_len: 4096
    kv_cache_memory_bytes: 2147483648
    block_size: 16
    gpu_memory_utilization: 0.95
    dtype: bfloat16
    enforce_eager: true
    disable_hybrid_kv_cache_manager: true
    moe_backend: triton
    env:
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      UCX_RCACHE_MAX_UNRELEASED: "1024"
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    kv_transfer_config:
      kv_connector: OmniNixlKVConnector
      kv_connector_module_path: vllm_omni.distributed.omni_connectors.connectors.nixl_kv_connector
      kv_role: kv_producer
      engine_id: hunyuan-nixl-ar
      kv_ip: 127.0.0.1
      kv_connector_extra_config:
        page_port: 8998
        page_namespace: hunyuan-image3:d9a3991e01fcaefe0fb14169e8c9d04fc126c4e1:bf16-kv:tp1
        layer_name_prefix: model.
        expected_readers: 2
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048
      detokenize: true
      skip_special_tokens: false
      include_stop_str_in_output: true

  - stage_id: 1
    devices: "1"
    max_num_seqs: 1
    max_num_batched_tokens: 16384
    max_model_len: 4096
    kv_cache_memory_bytes: 2147483648
    enforce_eager: true
    enable_sleep_mode: false
    dtype: bfloat16
    moe_backend: triton
    distributed_executor_backend: uni
    diffusion_kv_mode: paged_scheduler
    diffusion_kv_max_rows_per_request: 2
    env:
      UCX_RCACHE_MAX_UNRELEASED: "1024"
    kv_transfer_config:
      kv_connector: OmniNixlKVConnector
      kv_connector_module_path: vllm_omni.distributed.omni_connectors.connectors.nixl_kv_connector
      kv_role: kv_consumer
      engine_id: hunyuan-nixl-dit
      kv_connector_extra_config:
        page_namespace: hunyuan-image3:d9a3991e01fcaefe0fb14169e8c9d04fc126c4e1:bf16-kv:tp1
        layer_name_prefix: model.
        transfer_timeout: 60.0
    parallel_config:
      tensor_parallel_size: 1
    default_sampling_params:
      num_inference_steps: 50
      guidance_scale: 2.0
      height: 512
      width: 512

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1
