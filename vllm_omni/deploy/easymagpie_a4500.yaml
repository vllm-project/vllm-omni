pipeline: easymagpie
async_chunk: true
trust_remote_code: true
dtype: float16
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_startup_chunk_frames:
      - 2
      - 6
stages:
- stage_id: 0
  num_replicas: 1
  max_num_seqs: 32
  gpu_memory_utilization: 0.48
  kv_cache_memory_bytes: 1073741824
  enforce_eager: false
  async_scheduling: true
  enable_prefix_caching: false
  enable_chunked_prefill: true
  max_num_batched_tokens: 4096
  max_model_len: 4096
  devices: '0'
  output_connectors:
    to_stage_1: connector_of_shared_memory
  mamba_ssm_cache_dtype: float32
  skip_tokenizer_init: false
  engine_extras:
    worker_cls: vllm_omni.model_executor.models.easymagpie.runner.EasyMagpieGPUARWorker
    compilation_config:
      compile_ranges_endpoints:
      - 4096
      max_cudagraph_capture_size: 4096
      cudagraph_capture_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 24
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
    hf_overrides:
      easymagpie_optimized: true
  default_sampling_params:
    temperature: 0.0
    detokenize: false
    max_tokens: 2048
- stage_id: 1
  num_replicas: 1
  max_num_seqs: 32
  gpu_memory_utilization: 0.25
  kv_cache_memory_bytes: 134217728
  dtype: float16
  enforce_eager: true
  async_scheduling: true
  enable_prefix_caching: false
  enable_chunked_prefill: false
  max_num_batched_tokens: 4104
  max_model_len: 4104
  devices: '0'
  input_connectors:
    from_stage_0: connector_of_shared_memory
  engine_extras:
    hf_overrides:
      easymagpie_optimized: true
    worker_cls: vllm_omni.model_executor.models.easymagpie.runner.EasyMagpieCodecWorker
  default_sampling_params:
    temperature: 0.0
    max_tokens: 65536
model_runner: v1
