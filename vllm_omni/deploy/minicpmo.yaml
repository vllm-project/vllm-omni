# MiniCPM-o-4_5 deploy: Stage 0 (LM → text tokens, latent) → Stage 1 (MiniCPMTTS + Token2wav → WAV).
# Sync mode: Stage 0 completes, text2speech() processor packages token IDs,
# Stage 1 runs MiniCPMTTS then stepaudio2.Token2wav in a single forward() call.
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.6
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    default_sampling_params:
      temperature: 0.7
      top_p: 1.0
      max_tokens: 2048
      seed: 42

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.1
    enforce_eager: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      seed: 42
