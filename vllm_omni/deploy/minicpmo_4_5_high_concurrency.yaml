# Opt-in single-GPU MiniCPM-o 4.5 profile for high-concurrency CUDA throughput.
# Same stages as minicpmo_4_5.yaml (duplex sessions plus chat completions),
# which already enables cuda_mps: one private MPS daemon shared by the three
# co-located stages, so their kernels can overlap instead of time-slicing the
# GPU. See that file for the MPS requirements and fallbacks.
#
# Code2Wav, the stage that limits throughput from C=8 up, also gets:
# - token2wav_async_ref_prepare: a new request's reference voice is prepared
#   when its placeholder arrives (host half on a worker thread, device half
#   on a side stream) instead of inside the chunk-0 step that every live
#   stream waits on. Prompt features are bit-identical. CUDA only; other
#   platforms keep the idle prefetch.
# - micro_batch_size: 8 (default 4) and cfm_onset_merge: fewer, larger
#   Whole-Euler solves per step, with first chunks merged into the same solve.
#   These two apply on every platform; they were measured on CUDA only.
#
# Measured on one L20X at c0d14249a against minicpmo_4_5.yaml (Seed-TTS en
# voice cloning through /v1/chat/completions, 16 requests per concurrency
# slot, three runs per point): 1089 -> 1326 codec frames/s at C=32 (+22%),
# 899 -> 1069 at C=16 (+19%), 774 -> 858 at C=8 (+11%); C=1 unchanged (201 vs
# 197). GPU memory after startup is about 2.6 GiB higher (the Whole-Euler
# arena and graphs for 8 rows); the peak over C=1-32 was 1.2 GiB higher.
# - Seed-TTS WER on the full en set (1088 utterances, C=8): 2.73% vs 2.68%;
#   paired per utterance, 26 worse and 31 better (95% CI of the difference
#   -0.23..+0.13 points).
# - Duplex first audio: over three C=8 runs per config, p95 556 vs 555 ms and
#   mean 447 -> 428 ms; C=1 unchanged, one C=4 run 5% slower (356 -> 374 ms).
#   Duplex sessions send no prewarm payload, so there only the batching
#   options apply.
# Earlier measurements at 6a56252e6, against the default profile with
# cuda_mps (now its default):
# - Each option alone was within WER run-to-run variation.
# - Upstream's opt-in cfm_float16 on top: +9% at C=32, WER within spread, but
#   one duplex C=4 run was 20% slower.
base_config: minicpmo_4_5.yaml

connectors:
  connector_of_shared_memory:
    extra:
      token2wav_async_ref_prepare: true
      micro_batch_size: 8
      cfm_onset_merge: true
