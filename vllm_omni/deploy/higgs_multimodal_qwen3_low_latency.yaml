# Low-concurrency Higgs Audio v3 serving (e.g. c1-c4). The external decode
# graph replaces the Talker's local MLP graph. Both profiles use FlashInfer.
base_config: higgs_multimodal_qwen3_high_throughput.yaml

stages:
  - stage_id: 0
    max_num_seqs: 16
    enforce_eager: false
    compilation_config:
      cudagraph_capture_sizes: [1, 2, 4, 8, 16]
      cudagraph_mode: FULL_DECODE_ONLY
      cudagraph_num_of_warmups: 1
