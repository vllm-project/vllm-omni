# Initial non-streaming configuration; GPU startup and memory sizing are unverified.
# Offline inputs use prepare_kimi_audio_inputs. The speech adapter reuses this
# preparation for instructed reading; the renderer prepares multimodal chat.
async_chunk: false
trust_remote_code: true
dtype: bfloat16
enable_prefix_caching: false

stages:
  - stage_id: 0
    devices: "0"
    tokenizer_mode: kimi_audio_omni
    enforce_eager: true
    async_scheduling: false
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.65
    default_sampling_params:
      temperature: 0.0
      top_k: 5
      top_p: 1.0
      repetition_penalty: 1.0
      max_tokens: 4096
      extra_args:
        kimi_audio: {}

  - stage_id: 1
    devices: "0"
    enforce_eager: true
    async_scheduling: false
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.15
    engine_extras:
      skip_tokenizer_init: true
    default_sampling_params:
      temperature: 0.0
