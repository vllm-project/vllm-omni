# LongCat-Next deploy: thinker (bf16, TP=4) + ONE combined multi-decoder
# stage (LongcatNextMultiDecoder, holding both image and audio decode paths)
# on 4x A100-80GB (or H100-80GB, etc.). GPUs 0-2: thinker TP=4 bf16 (~37
# GB/GPU, ~37-40 GiB free for KV cache + activations). GPU 3: thinker rank 3
# + multi_decoder (image decoder ~15-20 GiB estimated, audio decoder ~3.33
# GiB measured -- both weights can end up resident simultaneously over the
# service's lifetime, since each lazily loads on its own first use and
# nothing evicts the other, so this budgets for BOTH being loaded at once,
# not just whichever ran most recently). Combined with thinker rank 3's ~37
# GiB weights, GPU 3 needs headroom for ~37 + ~20-24 GiB = ~57-61 GiB,
# comfortably under 80 GiB.
#
# Uses the 2-stage "longcat_next_thinker_multi_decoder" pipeline
# (pipeline.py's LONGCAT_NEXT_THINKER_MULTI_DECODER_PIPELINE), NOT the
# 3-stage "longcat_next" pipeline used by
# longcat_next_4gpu_80gb_image_audio.yaml. The 3-stage
# thinker->image_decoder->audio_decoder chain has a real, unconditional bug:
# the orchestrator's _forward_to_next_stage always forwards a stage's own
# output to src_stage_id + 1, never consulting a stage's declared
# input_sources -- so the audio decoder (stage 2) always receives the image
# decoder's output (stage 1), never the thinker's (stage 0), and can never
# see real audio codes regardless of which modality was actually generated.
# Collapsing both decoders into one LongcatNextMultiDecoder stage sidesteps
# this at the root: thinker(0) -> multi_decoder(1) is a 2-stage chain, so
# stage 1 always receives stage 0's real output. See
# modeling_longcat_next_multi_decoder.py's module docstring for the full
# writeup.
pipeline: longcat_next_thinker_multi_decoder
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.65
    max_num_batched_tokens: 8192
    max_model_len: 65536
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: multi_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.35
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "3"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
