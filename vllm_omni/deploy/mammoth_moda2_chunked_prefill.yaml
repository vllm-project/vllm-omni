# MammothModa2 AR→DiT with chunked prefill enabled on the AR stage (#7116).
# Pair with mammoth_moda2_chunked_prefill_off.yaml for latent / image A/B.

async_chunk: false
pipeline: mammoth_moda2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 100
    max_model_len: 8192
    # Force multi-chunk prefills for long multimodal / visual-token prompts;
    # full-payload accumulation rebuilds contiguous AR→DiT latents.
    enable_chunked_prefill: true
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.5
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false

  - stage_id: 1
    devices: "0"
    max_num_seqs: 8
    request_batch_max_wait_ms: 20
    gpu_memory_utilization: 0.3
    enforce_eager: true
    step_execution: false
    trust_remote_code: true
    enable_prefix_caching: false
