# MiniCPM-o 4.5 opt-in batching deploy: 2-GPU layout.
#
# Stage 0 uses vLLM continuous batching. Stage 1 accepts a request-aligned
# runner batch, but MiniCPMTTS.generate() and Token2Wav are still executed
# serially per request inside the model forward pass.
pipeline: minicpmo_4_5
async_chunk: false

trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.7
    enforce_eager: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    devices: "0"
    limit_mm_per_prompt:
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.75
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "1"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      seed: 42
      detokenize: false

platforms: {}
