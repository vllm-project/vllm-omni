# Opt-in CUDA profile for MOSS-TTS-Local-Transformer-v1.5 tuned for first-packet
# latency at client concurrency 128 on one H200 (Seed-TTS EN1088, closed loop).
# Both stages share GPU 0. Use moss_tts_local_mrv2_high_concurrency.yaml for
# throughput-first serving.
#
# Optional launch-level settings (see the full command in recipes/OpenMOSS/MOSS-TTS.md):
#   - CUDA MPS for the GPU;
#   - VLLM_OMNI_EVENT_DRIVEN_ORCH=1;
#   - --api-server-count 4 with VLLM_WORKER_MULTIPROC_METHOD=spawn and
#     VLLM_OMNI_MOSS_REF_CODES_SHARED_DIR=/dev/shm/<dir> so frontends share reference codes;
#   - VLLM_OMNI_CONNECTOR_RECV_POLL_MS=1 to reduce inter-stage polling latency.
base_config: moss_tts_local_mrv2.yaml

connectors:
  shm:
    extra:
      generation_min_batch_size: 32
      generation_max_wait_ms: 12

platforms:
  cuda:
    stages:
      - stage_id: 0
        max_num_seqs: 128
        # Larger prefill budget admits bursts of new requests in fewer steps.
        max_num_batched_tokens: 2048
        hf_overrides:
          mrv2_gpu_slot_state: true
          mrv2_batch_prefill: true
          mrv2_direct_tokens: true
        compilation_config:
          mode: 3
          cudagraph_mode: FULL
          max_cudagraph_capture_size: 2048
          cudagraph_num_of_warmups: 1
        kv_cache_memory_bytes: 34359738368  # 32 GiB
      - stage_id: 1
        max_num_seqs: 128
        # Keep synchronous scheduling; benchmark async scheduling separately.
        async_scheduling: false
        hf_overrides:
          codec_attention_backend: triton_slot
        compilation_config:
          mode: 3
          backend: inductor
          cudagraph_mode: FULL
          cudagraph_capture_sizes: [1, 2, 4, 6, 8, 12, 16, 24, 32, 64, 128]
          cudagraph_num_of_warmups: 1
          inductor_compile_config:
            combo_kernels: false
            benchmark_combo_kernel: false
