# Chatterbox Turbo at 64 concurrent requests, measured on one H100 SXM 80 GB
# (recipes/ResembleAI/Chatterbox-H100.md). Admission is a capacity contract,
# not real-time audio: stage 0's KV cache and stage 1's activations must fit
# the admitted streams on the target card, and stage 1's budget still admits
# only complete utterances.
base_config: chatterbox_turbo.yaml

stages:
  - stage_id: 0
    max_num_seqs: 64

  - stage_id: 1
    max_num_seqs: 64
    # max_num_seqs * max_model_len, as the stage requires.
    max_num_batched_tokens: 131072
