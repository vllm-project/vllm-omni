# Higgs-audio v2 explicit V1 opt-out profile: pins the talker (stage 0) to
# model_runner v1 as the documented escape hatch from the v2 default. The
# codec stage is on v1 in every profile. Everything else is inherited from
# the shipped default via base_config; this file keeps stage 0 on v1 even if
# the default's selection ever changes again.
base_config: higgs_audio_v2.yaml
stages:
  - stage_id: 0
    model_runner: v1
