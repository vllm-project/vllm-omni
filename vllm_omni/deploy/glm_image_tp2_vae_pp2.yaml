# GLM-Image on two GPUs: AR (stage 0) on GPU 0; diffusion (stage 1) on GPUs 0,1
# with TP=2 and decode-only VAE patch parallelism of size 2.
#
# VAE tiling is enabled automatically when vae_patch_parallel_size > 1.

base_config: glm_image.yaml

stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1

  - stage_id: 1
    devices: "0,1"
    tensor_parallel_size: 2
    # A nested parallel_config replaces the flat stage fields for the diffusion
    # worker, so tensor_parallel_size must be repeated here.
    parallel_config:
      tensor_parallel_size: 2
      vae_patch_parallel_size: 2
