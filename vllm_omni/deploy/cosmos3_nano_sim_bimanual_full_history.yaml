# nvidia/Cosmos3-Nano-Sim-Bimanual@1d95a0b5b19d49a24aceebf578cf5e85db310ac0

pipeline: cosmos3_nano_sim_bimanual
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Cosmos3NanoSimBimanualPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    model_config:
      default_resolution: [480, 832]
      max_pixels: 409600
      inference_overrides:
        frame_sigma_schedules:
          - [1.0, 0.9375, 0.8333333333333334, 0.625]
          - [1.0, 0.8333333333333334]
        history_mode: full
        max_num_frames: 901
      action_gen: true
      action_dim: 64
      num_embodiment_domains: 32
      default_fps: 30.0
      # Experimental: batch frame-causal clean K/V refreshes. Keep framewise
      # until checkpoint-level quality and performance have been validated.
      clean_commit_mode: framewise  # framewise | batched
      # Fresh full-video requests only; Wan decode starts before clean refresh.
      overlap_vae_decode: false
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.35
        warmup_cudagraph: false
