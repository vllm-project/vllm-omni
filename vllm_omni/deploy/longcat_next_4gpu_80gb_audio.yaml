# LongCat-Next deploy: thinker (bf16, TP=4) + audio decoder on 4x A100-80GB.
# GPU 3: thinker rank 3 + audio decoder (~3.3 GiB).
pipeline: longcat_next_thinker_audio
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.85
    max_num_batched_tokens: 8192
    max_model_len: 65536
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: audio_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.06
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "3"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
