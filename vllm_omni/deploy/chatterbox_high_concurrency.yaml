# Chatterbox Original at 64 concurrent requests (128 guidance sequences),
# measured on one H100 SXM 80 GB (recipes/ResembleAI/Chatterbox-H100.md).
# Admission is a capacity contract, not real-time audio: with a distinct
# cloned reference per request the Original does not keep up with playback
# at any measured client count on this profile, and with the built-in voice
# only at 8 (recipe). Stage 0's KV cache and stage 1's activations must fit
# the admitted streams on the target card.
base_config: chatterbox.yaml

stages:
  - stage_id: 0
    max_num_seqs: 128
    # 128 guidance sequences at 2048 tokens need 30.0 GiB of KV cache plus
    # 1.5 GiB of weights and activations (measured on H100); 0.40 fitted them
    # exactly, so this leaves 3 GiB over on an 80 GB card.
    gpu_memory_utilization: 0.45
    # The reference encoders run on the GPU in the API process, which must
    # share visible device 0 with both stages. Read by the serving adapter.
    # additional_config replaces the base mapping, so the controls' request
    # defaults are repeated.
    additional_config:
      conditioning_device: cuda:0
      exaggeration: 0.5
      cfg_weight: 0.5

  - stage_id: 1
    max_num_seqs: 64
    # max_num_seqs * max_model_len, as the stage requires.
    max_num_batched_tokens: 131072
