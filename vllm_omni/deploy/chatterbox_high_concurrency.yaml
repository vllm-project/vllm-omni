# Opt-in admission profile tested with 64 clients on H100 SXM 80 GB through
# HTTP and sentence-streaming APIs at the default 1000-token allowance.
# See recipes/ResembleAI/Chatterbox-Turbo.md for measurements and limits.
# This is not a 24 GB or simultaneous full-context capacity guarantee.
# Provision GPU memory for stage-0 KV caches at this admission limit, then
# validate the intended lengths and voices on the target hardware. Stage 1
# decodes the scheduled batch together; provision activation memory for all
# admitted streams. Its scheduler budget admits complete utterances.
# English Chatterbox Original: paired Llama T3 -> ten-step S3Gen -> HiFT.
# Each guided request occupies two stage-0 sequence slots. The atomic CFG
# scheduler requires enough token budget to prefill a whole pair, and disables
# asynchronous scheduling, chunked prefill, and prefix caching.
pipeline: chatterbox
model_runner: v2
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 15
      codec_max_chunk_frames: 60
      codec_stream_scale_factor: 2
stages:
  - stage_id: 0
    hf_overrides:
      variant: original
      # API process and both stages must share visible GPU zero on one host.
      conditioning_device: cuda:0
    dtype: bfloat16
    max_num_seqs: 128
    max_model_len: 2048
    max_num_batched_tokens: 4096
    # H100 80 GB needs room for all 128 reserved CFG sequences at 2048 tokens.
    gpu_memory_utilization: 0.40
    enforce_eager: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    skip_tokenizer_init: true
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_k: -1
      top_p: 1.0
      min_p: 0.05
      repetition_penalty: 1.2
      max_tokens: 1000
  - stage_id: 1
    hf_overrides:
      variant: original
    dtype: float32
    max_num_seqs: 64
    max_model_len: 2048
    max_num_batched_tokens: 131072
    gpu_memory_utilization: 0.15
    enforce_eager: true
    skip_tokenizer_init: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
