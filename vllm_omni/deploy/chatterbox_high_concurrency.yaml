# Chatterbox Original at 64 concurrent requests (128 guidance sequences),
# measured on one H100 SXM 80 GB (recipes/ResembleAI/Chatterbox-H100.md).
# Admission is a capacity contract, not real-time audio: at 64 clients the
# Original falls behind playback; at 32 it keeps up. Stage 0's KV cache and
# stage 1's activations must fit the admitted streams on the target card.
base_config: chatterbox.yaml

stages:
  - stage_id: 0
    max_num_seqs: 128
    # 128 reserved guidance sequences at 2048 tokens.
    gpu_memory_utilization: 0.40
    # The reference encoders run on the GPU in the API process, which must
    # share visible device 0 with both stages. Read by the serving adapter.
    additional_config:
      conditioning_device: cuda:0

  - stage_id: 1
    max_num_seqs: 64
    # max_num_seqs * max_model_len, as the stage requires.
    max_num_batched_tokens: 131072
