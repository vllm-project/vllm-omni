# Duo 1.0 causal-base on 4 GPUs: Realization TP4 only, no duplex session.
#
# This is the smallest topology that exercises the ported Realization stage
# against the released causal-base bundle; it is not the online duplex
# deployment (see duo_dmd.yaml / duo_tp8_shared.yaml for that).
#
# Differences from duo_dmd.yaml all follow from causal-base not being the DMD
# release: Euler-equivalent `causal` sampling at flow shift 1.0 and 50 steps
# (what realization/complete.json records), no staged 4NFE adapter because the
# bundle folds it into the backbone, and no online FP8 conversion.
#
# The Realization backbone ships a Diffusers-style config.json carrying only
# `_class_name`. Add `model_type` and a single `architectures` entry pointing at
# DuoPipeline, or the native loader cannot route the checkpoint:
#
#   {"_class_name": "MiniMaxH3DiTModel", "model_type": "minimax_h3_dit",
#    "architectures": ["DuoPipeline"], ...}
pipeline: duo
async_chunk: false
trust_remote_code: true
distributed_executor_backend: mp
stages:
- stage_id: 1
  model: /path/to/Duo-1.0-causal-base/realization/backbone
  devices: '0,1,2,3'
  dtype: bfloat16
  step_execution: true
  # The Realization stage hands its finished latents to the codec on the
  # `latent_ready` frame, ahead of the separate clean commit. That frame is a
  # non-terminal one, and a non-streaming diffusion stage keeps only the final
  # output, so leaving this false silently reduces the stage to a single
  # `clean_committed` result and drops the handoff. The online duplex presets
  # (duo_dmd.yaml, duo_tp8_shared.yaml) set it the same way.
  streaming_output: true
  diffusion_model_runner_cls: vllm_omni.diffusion.models.duo.model_runner.DuoModelRunner
  # Stage-deploy parallelism is declared flat here, but on the path this preset
  # is launched with (`Omni(model=..., deploy_config_path=..., model_class_name=
  # ..., step_execution=...)`) the value below alone did not take effect: the
  # engine resolved a single stage with tensor_parallel_size=1 and put the whole
  # 66 GB backbone on device 0. Passing `tensor_parallel_size=4` to `Omni(...)`
  # made the four workers report 16.6 GiB each. Until that resolution is fixed,
  # pass TP explicitly AND keep it here.
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.9
  default_sampling_params:
    num_inference_steps: 50
    seed: 42
  max_num_seqs: 1
# Duo stage options (`duo`, `duo_codec`) ride on the engine args, e.g.
# `model_config={"duo": {...}}` from examples/offline_inference/duo. A
# `model_config:` block in a deploy YAML is not a StageDeployConfig field, so it
# would land in `engine_extras` instead of the stage model config.
