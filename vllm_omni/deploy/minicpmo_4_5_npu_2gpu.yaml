# MiniCPM-o 4.5 NPU two-card layout: the thinker (stage 0) and the talker
# (stage 1) share the first card, Code2Wav (stage 2) owns the second. Stage-0
# n-gram speculation, sizing and graph modes are inherited from
# minicpmo_4_5.yaml. Launch with ASCEND_RT_VISIBLE_DEVICES listing exactly two
# cards.
#
# Measured on 2x 910B3 with this layout (seed-tts en, mean audio RTF at
# 32@1 / 64@4 / 128@8): 0.1773 / 0.3654 / 0.5469 with the runner gate and the
# sliced single-row head projection, versus 0.2271 / 0.4679 / 0.7576 for the
# same layout before those fixes (-21.9% / -21.9% / -27.8%); zero failed
# requests in all tiers.
base_config: minicpmo_4_5.yaml
pipeline: minicpmo_4_5

stages:
  - stage_id: 0
    devices: "0"
  - stage_id: 1
    devices: "0"
  - stage_id: 2
    devices: "1"

platforms:
  npu:
    stages:
      - stage_id: 0
        devices: "0"
      - stage_id: 1
        devices: "0"
      - stage_id: 2
        devices: "1"

connectors:
  connector_of_shared_memory:
    extra:
      # The fused top-k/top-p codec sampling tail measured slower than the
      # eager pair on 910B; keep the eager chain.
      talker_codec_fused_tail: false
