# Ming3-TTS: Bailing-v3 AR+flow stage -> streaming AudioVAE stage
pipeline: ming3_tts
async_chunk: true
trust_remote_code: false
dtype: bfloat16
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      latent_chunk_size: 25
      initial_latent_chunk_size: 4
      latent_left_context: 0

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.60
    enforce_eager: false
    enable_prefix_caching: false
    async_scheduling: false
    compilation_config:
      cudagraph_mode: PIECEWISE
      cudagraph_capture_sizes: [1, 2, 4, 8, 16]
      cudagraph_num_of_warmups: 1
    max_num_batched_tokens: 8192
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 801
      detokenize: true

  - stage_id: 1
    # AudioVAE KV, upsampler, and ISTFT state are keyed by request_id.
    max_num_seqs: 16
    gpu_memory_utilization: 0.25
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 8192
    max_model_len: 4096
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      detokenize: false
