# ABot-World stepwise deploy: single diffusion stage for WS /v1/realtime/video.
#
# One AsyncOmni request is one rollout: prepare_encode runs once, then every
# four DMD steps stream one AR block (9 frames first, then 12). Step execution
# keeps AR-Diffusion paged KV on ARDiffusionModelRunner, so this stage must stay
# at max_num_seqs=1.
#
# The cache geometry is fixed at load time, so ar_diffusion_height/width must
# match the height/width a client asks for.

pipeline: abot_world
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    # ABot currently requires eager execution; see recipes/ACVLab/ABot-World.md.
    enforce_eager: true
    model_class_name: ABotWorldCausalPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    default_sampling_params:
      num_inference_steps: 4
      output_type: pil
      extra_args:
        flow_shift: 5.0
    model_config:
      # "taew2_2" selects the tiny decoder from taew2_2.pth in the checkpoint.
      abot_vae: wan
      ar_diffusion_height: 512
      ar_diffusion_width: 832
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.15
        warmup_cudagraph: false
