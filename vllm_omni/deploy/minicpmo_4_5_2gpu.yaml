# Two-card placement and budgets; common settings inherit minicpmo_4_5.yaml.
base_config: minicpmo_4_5.yaml
duplex_session:
  max_sessions: 16
stages:
- max_num_seqs: 4
  gpu_memory_utilization: 0.9
  default_sampling_params:
    repetition_penalty: 1.1
  stage_id: 0
- max_num_seqs: 4
  gpu_memory_utilization: 0.55
  devices: '1'
  stage_id: 1
- max_num_seqs: 4
  gpu_memory_utilization: 0.35
  devices: '1'
  stage_id: 2
platforms:
  cuda:
    stages:
    - stage_id: 0
      attention_backend: TRITON_ATTN
    - stage_id: 2
      devices: '1'
      num_replicas: 1
      max_num_seqs: 4
      gpu_memory_utilization: 0.35
  npu:
    stages:
    - max_num_seqs: 16
      devices: '1'
      default_sampling_params:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        max_tokens: 2048
        seed: 42
        detokenize: true
        repetition_penalty: 1.0
      model_runner: v2
      kv_cache_memory_bytes: 17179869184
      max_model_len: 40960
      hf_overrides:
        rope_parameters:
          rope_type: yarn
          rope_theta: 1000000.0
          factor: 4.0
          original_max_position_embeddings: 10240
      speculative_config:
        method: dspark
        model: DRAFT_MODEL_PATH
        num_speculative_tokens: 7
        draft_tensor_parallel_size: 1
      model_subdir: thinker-w8a8
      stage_id: 0
      additional_config:
        encoder_enable_npu_graph: true
        encoder_max_npu_graphs: 4
        minicpmo_long_prefill_eager: true
      compilation_config:
        cudagraph_mode: FULL_DECODE_ONLY
    - max_num_seqs: 16
      devices: 1,0
      num_replicas: 2
      model_runner: v2
      model_subdir: original
      additional_config:
        ascend_compilation_config:
          enable_npugraph_ex: true
          enable_static_kernel: true
          enable_super_kernel: false
      stage_id: 1
      default_sampling_params:
        temperature: 0.8
        top_p: 0.85
        top_k: 25
        repetition_penalty: 1.05
        min_tokens: 50
        max_tokens: 4096
        seed: 42
        detokenize: false
        stop_token_ids:
        - 1
      speculative_config:
        method: ngram
        num_speculative_tokens: 15
        prompt_lookup_min: 1
        prompt_lookup_max: 1
      compilation_config:
        cudagraph_mode: FULL_DECODE_ONLY
    - max_num_seqs: 16
      devices: 0,1
      num_replicas: 2
      additional_config:
        code2wav_enable_npu_graph: true
        cfm_graph_batch_buckets:
        - 1
        - 2
        - 4
        - 8
        code2wav_max_npu_graphs: 96
      model_runner: v2
      model_subdir: original
      stage_id: 2
      default_sampling_params:
        temperature: 0.0
        top_p: 1.0
        top_k: -1
        max_tokens: 65536
        detokenize: true
    connectors:
      connector_of_shared_memory:
        extra:
          cfm_max_graphs: 96
