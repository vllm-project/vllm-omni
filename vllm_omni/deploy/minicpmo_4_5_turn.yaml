# MiniCPM-o 4.5 using the turn-based engine and ordinary HTTP serving.
base_config: minicpmo_4_5.yaml
session_mode: turn

stages:
  - stage_id: 0
    # The default CUDA MRv2 Thinker does not merge cached prefix rows.
    # Non-CUDA platforms also retain their existing cache-disabled behavior.
    enable_prefix_caching: false

platforms:
  rocm:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
  xpu:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
  musa:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
