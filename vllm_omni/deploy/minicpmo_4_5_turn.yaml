# MiniCPM-o 4.5 using the turn-based engine and ordinary HTTP serving.
base_config: minicpmo_4_5.yaml
session_mode: turn

stages:
  - stage_id: 0
    # Keep prefix caching disabled when selecting either runner.
    enable_prefix_caching: false

platforms:
  rocm:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
  xpu:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
  musa:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
