# MiniCPM-o 4.5 using the turn-based engine and ordinary HTTP serving.
base_config: minicpmo_4_5.yaml
session_mode: turn

connectors:
  connector_of_shared_memory:
    extra:
      hift_graph_capture_batch_sizes: [1, 2, 4, 8]
      # Use TF32 for CFM DiT and prioritize first chunks while playback has slack.
      token2wav_allow_tf32: true
      generation_first_chunk_express: true
      generation_first_chunk_express_min_slack_s: 0.5

stages:
  - stage_id: 0
    # CUDA V1 and MRv2 restore cached Thinker outputs for the Talker.
    # Other platforms keep their existing overrides below and in the base.
    enable_prefix_caching: true
  - stage_id: 1
    max_num_seqs: 8
  - stage_id: 2
    max_num_seqs: 8
    async_scheduling: false

platforms:
  cuda:
    stages:
      - stage_id: 0
        # The Talker consumes the completed Thinker payload.
        async_chunk: false
        # Keep the turn engine's upstream kernel and compilation defaults.
        kernel_config: {}
        compilation_config: {}
      - stage_id: 1
        # Reserve enough KV for eight 4096-token Talker requests.
        kv_cache_memory_bytes: 2147483648
  rocm:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
  xpu:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
  musa:
    stages:
      - stage_id: 0
        enable_prefix_caching: false
