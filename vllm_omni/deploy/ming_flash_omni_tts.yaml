# Ming-flash-omni-2.0 standalone TTS deploy: talker only.
#
# Single-stage configuration for direct text -> audio synthesis
# The talker runs as a native-paged autoregressive worker on a single GPU
# and owns the tokenizer.
pipeline: ming_flash_omni_tts
async_chunk: false

trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.8
    enforce_eager: false
    max_num_batched_tokens: 8192
    devices: "0"
    # The native talker steps CFM audio host-side in compute_logits; FULL
    # cudagraphs would capture (and then skip) that logic on replay, so cap
    # the talker at PIECEWISE. The backbone decode still gets graph speedup.
    compilation_config:
      cudagraph_mode: PIECEWISE
    default_sampling_params:
      temperature: 0.0
      max_tokens: 200

# Ming-flash-omni-2.0 has only been verified on CUDA devices
platforms: {}
