pipeline: minimax_h3_disaggregated_decode
async_chunk: false
trust_remote_code: true
distributed_executor_backend: mp
stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.3
    max_model_len: 6144
    max_num_seqs: 1
    enforce_eager: true
    hf_overrides:
      minimax_h3_encoder_components:
        text_encoder:
          parallel_mode: tp
        video_vae:
          parallel_mode: patch
        audio_vae:
          parallel_mode: leader
    default_sampling_params:
      detokenize: false
      max_tokens: 1
      temperature: 0.0
  - stage_id: 1
    devices: "0,1,2,3"
    max_num_seqs: 1
    enforce_eager: true
    enable_distributed_layerwise_offload: true
    model_loaded:
      text_encoder: false
      vae_encoder: false
      vae_decoder: false
    parallel_config:
      tensor_parallel_size: 1
      ulysses_degree: 4
      vae_patch_parallel_size: 1
    default_sampling_params:
      num_inference_steps: 50
      seed: 42
  - stage_id: 2
    devices: "0,1,2,3"
    max_num_seqs: 1
    enforce_eager: true
    parallel_config:
      tensor_parallel_size: 1
      ulysses_degree: 4
      vae_patch_parallel_size: 4
    default_sampling_params:
      seed: 42
