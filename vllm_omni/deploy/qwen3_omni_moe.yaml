# Qwen3-Omni-MoE production deploy, verified on 2x H100 (stage 0 on cuda:0,
# stages 1+2 on cuda:1).
#
# Fields omitted from a stage fall back to StageDeployConfig defaults (see
# vllm_omni/config/stage_config.py). Notable implicit defaults for this
# model:
#   * Stages 0/1 (thinker, talker) do not set max_num_batched_tokens —
#     chat-sized prefill fits in the 32768 default.
#   * Stages 0/1 do not set enforce_eager — cudagraph runs by default
#     (false). Stage 2 (code2wav) sets true because its generation loop
#     is cudagraph-incompatible.
#   * Platform sections flip enforce_eager per-stage where platform
#     cudagraph support differs.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    gpu_memory_utilization: 0.9
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    gpu_memory_utilization: 0.6
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    gpu_memory_utilization: 0.1
    enforce_eager: true
    async_scheduling: false
    max_num_batched_tokens: 51200
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1

pd_disaggregation:
  enabled: false
  target_stage_id: 0
  async_chunk: false
  # PD mode uses the common 3-GPU layout:
  #   GPU 0 -> thinker prefill
  #   GPU 1 -> thinker decode
  #   GPU 2 -> talker + code2wav
  stages:
    - role: prefill
      max_num_seqs: 16
      devices: "0"
      tensor_parallel_size: 1
      engine_extras:
        kv_transfer_config:
          kv_connector: "MooncakeConnector"
          kv_role: "kv_producer"
          kv_rank: 0
          kv_parallel_size: 2
          kv_connector_extra_config:
            mooncake_bootstrap_port: 25201
    - role: decode
      max_num_seqs: 64
      devices: "1"
      tensor_parallel_size: 1
      engine_extras:
        kv_transfer_config:
          kv_connector: "MooncakeConnector"
          kv_role: "kv_consumer"
          kv_rank: 1
          kv_parallel_size: 2
          kv_connector_extra_config:
            mooncake_bootstrap_port: 25202
  stage_overrides:
    - stage_id: 1
      devices: "2"
    - stage_id: 2
      devices: "2"

platforms:
  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.6
        tensor_parallel_size: 2
        max_num_batched_tokens: 8192
        devices: "0,1"
      - stage_id: 1
        gpu_memory_utilization: 0.6
        max_num_batched_tokens: 8192
        devices: "2"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        devices: "2"

  rocm:
    stages:
      - stage_id: 0
        enforce_eager: true

  xpu:
    stages:
      - stage_id: 0
        tensor_parallel_size: 4
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "0,1,2,3"
      - stage_id: 1
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "4"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        max_cudagraph_capture_size: 0
        devices: "4"
