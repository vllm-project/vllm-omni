#
# Deploy config for the ``nemotron_voicechat`` (NemotronDuplexH →
# EarTTS) streaming pipeline.
#
# The model directory passed to ``AsyncOmni(model=...)`` is a small
# user-managed wrapper directory with this layout::
#
#     <wrapper>/
#         config.json               # {"model_type": "nemotron_voicechat"}
#         nemotron/                 # directory or symlink → Nemotron ckpt
#         eartts/                   # directory or symlink → EarTTS ckpt
#
# ``model_type = nemotron_voicechat`` makes the pipeline registry
# dispatch to ``NEMOTRON_VOICECHAT_PIPELINE``. The ``model_subdir`` /
# ``tokenizer_subdir`` engine_extras below tell each stage's engine
# init to look inside the matching subdirectory; see
# ``vllm_omni/engine/stage_init_utils.py:_resolve_model_tokenizer_paths``.
async_chunk: true
trust_remote_code: true
enable_prefix_caching: false
distributed_executor_backend: uni

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300

stages:
  # Stage 0 — Nemotron-Duplex-H (autoregressive text + ASR + acoustic
  # decode). PIECEWISE compilation only; see model docstring for why
  # FULL cudagraph mode is unsafe with this streaming setup.
  - stage_id: 0
    max_num_seqs: 1
    max_num_batched_tokens: 768
    max_model_len: 768
    gpu_memory_utilization: 0.45
    enforce_eager: false
    async_scheduling: true
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    # NOTE: ``model_subdir``/``tokenizer_subdir``/``compilation_config`` are
    # flat per-stage engine args (not nested under ``engine_extras``).
    # ``_parse_stage_deploy`` collects flat top-level stage keys into
    # ``engine_extras`` for forwarding to ``OmniEngineArgs``; a nested
    # ``engine_extras:`` block is filtered out by ``_STAGE_NON_ENGINE_KEYS``
    # in the same parser and would be silently dropped.
    model_subdir: nemotron
    tokenizer_subdir: nemotron
    compilation_config:
      cudagraph_mode: PIECEWISE
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 768
      detokenize: false

  # Stage 1 — EarTTS, chunk-driven streaming mode. The reference audio
  # tokens arrive in chunk 0; per-step text tokens come in subsequent
  # chunks via ``input_text_tokens``.
  - stage_id: 1
    max_num_seqs: 1
    max_num_batched_tokens: 768
    max_model_len: 768
    gpu_memory_utilization: 0.30
    enforce_eager: false
    async_scheduling: true
    skip_tokenizer_init: true
    dtype: float32
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    # See note on stage 0: ``model_subdir`` / ``tokenizer_subdir`` must be
    # flat per-stage engine args, not nested under ``engine_extras``.
    model_subdir: eartts
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 768
      detokenize: false

edges:
  - from: 0
    to: 1
