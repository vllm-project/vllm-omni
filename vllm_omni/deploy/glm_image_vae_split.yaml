# GLM-Image deploy: AR (stage 0) + DiT denoise (stage 1) + VAE decode (stage 2).
# The default 2-stage GLM-Image topology remains unchanged; this file opts into
# the split pipeline declared in
# vllm_omni/model_executor/models/glm_image/pipeline.py.

pipeline: glm_image_vae_split
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.7
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    max_num_batched_tokens: 32768
    max_model_len: 32768
    devices: "0"
    default_sampling_params:
      temperature: 0.9
      top_p: 0.75
      top_k: 16512
      stop_token_ids: [16385]
      max_tokens: 4353
      seed: 42
      detokenize: false

  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    engine_extras:
      enable_diffusion_pipeline_profiler: true
    default_sampling_params:
      seed: 42
      num_inference_steps: 50
      guidance_scale: 1.5
      height: 1024
      width: 1024

  - stage_id: 2
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "2"
    engine_extras:
      enable_diffusion_pipeline_profiler: true
    default_sampling_params:
      seed: 42
      height: 1024
      width: 1024
