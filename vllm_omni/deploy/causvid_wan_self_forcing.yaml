# CausVid Wan 2.1 1.3B — Self-Forcing (training-aligned topology).
#
# Topology: S=1, G=2 → pipeline_parallel_size = 2 (layer PP; all denoise/clean
# steps reuse one weight replica). Matches CausVid clean-history Self-Forcing.
# Latest-KV (vertical S=D+1): causvid_wan_latest_kv.yaml
#
# ``model``: official Wan 2.1 1.3B base in Diffusers layout
#   Wan-AI/Wan2.1-T2V-1.3B-Diffusers  (local: /data/models/Wan2.1-T2V-1.3B-Diffusers)
# Overlay CausVid student DiT via model_config.causvid_ckpt:
#   tianweiy/CausVid autoregressive_checkpoint/model.pt
#
# Design: docs/design/feature/noisy_kv.md

pipeline: causvid_wan
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: CausVidWanPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    parallel_config:
      pipeline_parallel_size: 2
    default_sampling_params:
      extra_args:
        num_chunks: 7
        num_denoise_steps: 3
        kv_history_chunks: 6
        cell_schedule: self_forcing
        shift: 8.0
        reset: true
    model_config:
      shift: 8.0
      num_denoise_steps: 3
      # causvid_ckpt: /path/to/tianweiy/CausVid/autoregressive_checkpoint/model.pt
      ar_diffusion_stage_config:
        step_replicas: 1
        max_batch_size: 1
        max_history_chunks: 6
