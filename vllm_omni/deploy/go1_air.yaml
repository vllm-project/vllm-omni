# GO-1-Air robot-policy deploy: single diffusion stage with OpenPI metadata.

pipeline: go1_air
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Go1AirPipeline
    model_config:
      policy_server_config:
        image_resolution: [448, 448]
        n_external_cameras: 1
        needs_wrist_camera: false
        needs_stereo_camera: false
        needs_session_id: true
        action_space: joint_position
        action_horizon: 30
        action_dim: 16
