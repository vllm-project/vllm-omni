# Higgs-audio v2 explicit MRV2 profile: an alias that pins the default
# profile's runner selection — the talker (stage 0) runs on model_runner v2;
# the codec stage (stage 1) has no MRV2 path and stays on v1, so the talker's
# outputs ride the legacy transport. Sampling under v2 delegates to the
# native staged sampler, so the full request surface — penalties included —
# keeps working. Everything is inherited from the shipped default via
# base_config so the two files cannot drift; unlike the default, this file
# keeps stage 0 on v2 even if the default's selection ever flips back.
base_config: higgs_audio_v2.yaml
