# SenseNova-Vision-7B-MoT think-mode deploy.
#
# This is a copy of sensenova_vision.yaml with the topology switched to
# ``sensenova_vision_think``.  The structural difference from the default
# two-stage topology:
#
#   * Stage 0 (Thinker) uses ``expand_cfg_prompts_think`` and NO
#     ``kv_transfer_criteria``, so KV transfer to the DiT happens only AFTER
#     the Thinker decodes its <thinking> tokens to EOS (not after prefill).
#     The DiT therefore conditions on the full thought.
#   * Stage 1 (DiT) additionally carries a ``custom_process_input_func`` that
#     lifts the AR stage's decoded text into the DiT request's
#     ``extra_args['text_output']`` so it surfaces under the existing
#     {image, text} output-modality contract.
#
# Because this topology does NOT transfer at prefill, stage 0 must be able to
# actually run the think decode: ``default_sampling_params`` keeps
# temperature 0.4 / top_p 0.9 / max_tokens 2048 (never clamp max_tokens to a
# prefill-only value for this pipeline).
#
# Select this topology explicitly via:
#   vllm serve <SenseNova-Vision-7B-MoT checkpoint> --omni \
#       --deploy-config vllm_omni/deploy/sensenova_vision_think.yaml
#
# Stage 0 (Thinker) and Stage 1 (DiT) share a single GPU by default.
# For dual-GPU setups, set stage 1 devices to "1".
#
# Fields omitted from a stage fall back to StageDeployConfig dataclass
# defaults (see vllm_omni/config/stage_config.py).

async_chunk: false
pipeline: sensenova_vision_think

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 3
    gpu_memory_utilization: 0.45
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 52
      detokenize: true
      repetition_penalty: 1.05

  - stage_id: 1
    # Must be explicit: unlike BAGEL (whose config.json model_type="bagel"
    # resolves to BagelPipeline in OmniDiffusionConfig.enrich_config), the
    # SenseNovaVision config.json carries no model_type/architectures, so the
    # diffusion stage cannot infer its pipeline class from the checkpoint.
    model_class_name: SenseNovaVisionPipeline
    max_num_batched_tokens: 65536
    max_num_seqs: 1
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    gpu_memory_utilization: 0.45
    devices: "0"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 52

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector

  rdma_connector:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: ""
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"