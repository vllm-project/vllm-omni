# Opt-in: MammothModa2 AR-only with cudagraph_mode PIECEWISE.
#
# For understanding / summarization when you want some graph benefit without
# FULL's dual-expert MoE tax (#9764). Eager MoE still runs a single expert;
# PIECEWISE does not require recording both und and gen FFNs into one decode
# graph. Default mammoth_moda2_ar.yaml stays on enforce_eager: true.

base_config: mammoth_moda2_ar.yaml

stages:
  - stage_id: 0
    enforce_eager: false
    compilation_config:
      cudagraph_mode: PIECEWISE
