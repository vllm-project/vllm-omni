# Qwen3-Omni-MoE single-GPU deployment profile.
#
# All CUDA pipeline stages share GPU 0. This profile is intended for
# single-GPU environments; the production profile keeps the thinker on GPU 0
# and the talker/code2wav stages on GPU 1.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_model_len: 8196
    max_num_batched_tokens: 8196
    max_num_seqs: 128
    gpu_memory_utilization: 0.7
    trust_remote_code: true
    enable_prefix_caching: true
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    max_model_len: 8196
    max_num_batched_tokens: 8196
    max_num_seqs: 4
    gpu_memory_utilization: 0.15
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 8196
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_model_len: 8196
    max_num_batched_tokens: 8196
    max_num_seqs: 4
    gpu_memory_utilization: 0.05
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 8196
      seed: 42
      repetition_penalty: 1.1

platforms:
  # vLLM 0.27's compiled native MRoPE path can vertically fuse the thinker's
  # Q/K RMSNorm reductions into the rotary operations and materially change
  # Qwen3-Omni audio output (#6090). Keep MRoPE on its CUDA path instead.
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]

  # The supported Qwen3-Omni ModelOpt checkpoint quantizes the thinker only.
  # Clear the checkpoint-level metadata for the BF16 audio stages on the
  # verified MUSA profile before vLLM performs its normal quantization
  # auto-detection.
  musa:
    stages:
      - stage_id: 1
        hf_overrides:
          quantization_config: null
      - stage_id: 2
        hf_overrides:
          quantization_config: null

  npu:
    stages:
      - stage_id: 0
        gpu_memory_utilization: 0.6
        tensor_parallel_size: 2
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "0,1"
      - stage_id: 1
        gpu_memory_utilization: 0.6
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "2"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        compilation_config:
          cudagraph_mode: PIECEWISE
        devices: "2"

  # Code2Wav decode uses UpSample1d, which calls F.conv_transpose1d.
  # On ROCm this routes through MIOpen and is not capture-safe during
  # vLLM's outer graph capture, so stage 2 runs eager.
  rocm:
    stages:
      - stage_id: 2
        enforce_eager: true

  xpu:
    stages:
      - stage_id: 0
        tensor_parallel_size: 4
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "0,1,2,3"
      - stage_id: 1
        enforce_eager: true
        max_cudagraph_capture_size: 0
        devices: "4"
      - stage_id: 2
        gpu_memory_utilization: 0.3
        max_cudagraph_capture_size: 0
        devices: "4"
