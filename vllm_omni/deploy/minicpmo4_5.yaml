# MiniCPM-o 4.5 deploy config, verified on 2x L40S-48G GPUs.
# Stage 0 runs on cuda:0; stages 1 and 2 share cuda:1.
async_chunk: false
trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    max_num_batched_tokens: 4096
    devices: "0"
    mm_processor_cache_gb: 0
    default_sampling_params:
      temperature: 0.7
      top_p: 0.8
      top_k: 100
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.02

  - stage_id: 1
    max_num_seqs: 64
    gpu_memory_utilization: 0.15
    devices: "1"
    distributed_executor_backend: "mp"
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_seqs: 32
    gpu_memory_utilization: 0.1
    enforce_eager: true
    async_scheduling: false
    max_num_batched_tokens: 1000000
    devices: "1"
    distributed_executor_backend: "mp"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
