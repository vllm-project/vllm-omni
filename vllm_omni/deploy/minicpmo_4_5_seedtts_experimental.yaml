# Development-only CUDA Seed-TTS profile; performance/quality qualification pending.
# Three stages share logical GPU 0. The measured runs used private CUDA MPS.
base_config: minicpmo_4_5_turn.yaml

connectors:
  connector_of_shared_memory:
    extra:
      token2wav_spk_cpu_reference: false
      token2wav_spk_cuda_graph: true
      token2wav_s3_cuda_graph: true
      initial_codec_chunk_frames: 0
      ref_setup_batch_size: 4
      hift_graph_continuation_frames: [3, 43]
      hift_graph_capture_batch_sizes: [1, 2, 4, 8, 16]
      token2wav_float16: true
      # Slower in development screens; keep background CPU extraction disabled.
      token2wav_ref_cpu_prefetch_workers: 0

platforms:
  cuda:
    stages:
      - stage_id: 0
        kv_cache_memory_bytes: 8589934592
        enable_prefix_caching: false
        speculative_config:
          method: ngram
          num_speculative_tokens: 7
          prompt_lookup_min: 1
          prompt_lookup_max: 4
      - stage_id: 1
        speculative_config:
          method: ngram
          num_speculative_tokens: 15
          prompt_lookup_min: 1
          prompt_lookup_max: 1
      - stage_id: 2
        num_replicas: 2
        devices: "0,0"
        gpu_memory_utilization: 0.15
        max_num_seqs: 8
