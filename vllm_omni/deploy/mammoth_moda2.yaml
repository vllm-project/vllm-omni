# MammothModa2 AR→DiT (text-to-image).

async_chunk: false
pipeline: mammoth_moda2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 100
    max_model_len: 8192
    gpu_memory_utilization: 0.5
    # torch.compile piecewise + CUDA graphs. Do not use cudagraph_mode FULL
    # without compilation: the dual-expert (und/gen) routing is captured with
    # the dummy all-text mask and replays the wrong expert during t2i decode.
    enforce_eager: false
    # Async scheduling is unsafe for embed-early multimodal models: the input
    # embedding runs during input prep, before the previous step's sampled
    # token id is written back, and gathers the -1 sentinel (OOB crash at
    # batch >= 8). Keep it off until embed-early is made async-safe.
    async_scheduling: false
    trust_remote_code: true
    enable_prefix_caching: false

  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    gpu_memory_utilization: 0.3
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    default_sampling_params:
      extra_args:
        text_guidance_scale: 9.0
        cfg_range: [0.0, 1.0]
        num_inference_steps: 50
