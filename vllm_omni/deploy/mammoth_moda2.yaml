# MammothModa2 AR→DiT (text-to-image).

async_chunk: false
pipeline: mammoth_moda2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 100
    max_model_len: 8192
    gpu_memory_utilization: 0.5
    # torch.compile piecewise + CUDA graphs (vLLM's FULL_AND_PIECEWISE
    # default, pinned explicitly). PIECEWISE alone regresses below eager
    # (compiled kernels without full-graph launch amortization); the win
    # comes from the FULL decode graphs. Do not use cudagraph_mode FULL
    # without compilation: the dual-expert (und/gen) routing would be
    # captured with the dummy all-text mask and replay the wrong expert
    # during t2i decode (#7318).
    enforce_eager: false
    compilation_config:
      cudagraph_mode: FULL_AND_PIECEWISE
    # Async scheduling is unsafe for embed-early multimodal models: the input
    # embedding runs during input prep, before the previous step's sampled
    # token id is written back, and gathers the -1 sentinel (OOB crash at
    # batch >= 8). Keep it off until embed-early is made async-safe.
    async_scheduling: false
    trust_remote_code: true
    enable_prefix_caching: false

  - stage_id: 1
    devices: "0"
    max_num_seqs: 8
    request_batch_max_wait_ms: 20
    gpu_memory_utilization: 0.3
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    # Optional Cache-DiT acceleration for the DiT stage (~2x faster denoise,
    # training-free). Uncomment to enable; guidance=1.0 requests bypass it.
    # cache_backend: cache_dit
    # cache_config:
    #   Fn_compute_blocks: 1
    #   Bn_compute_blocks: 0
    #   max_warmup_steps: 4
    #   residual_diff_threshold: 0.24
    #   max_continuous_cached_steps: 3
    # enable_cache_dit_summary: true
