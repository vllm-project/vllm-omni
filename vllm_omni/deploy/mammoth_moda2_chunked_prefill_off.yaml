# MammothModa2 AR→DiT baseline without chunked prefill (#7116 A/B).
# Same placement/capacity as mammoth_moda2.yaml; AR stage forces a single
# prefill chunk so latent reconstruction can be compared against the default
# chunked-prefill deploy.

async_chunk: false
pipeline: mammoth_moda2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 100
    max_model_len: 8192
    enable_chunked_prefill: false
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.5
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false

  - stage_id: 1
    devices: "0"
    max_num_seqs: 8
    request_batch_max_wait_ms: 20
    gpu_memory_utilization: 0.3
    enforce_eager: true
    step_execution: false
    trust_remote_code: true
    enable_prefix_caching: false
