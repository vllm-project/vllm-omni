# MammothModa2 AR-only (image/video understanding and summarization).

async_chunk: false
pipeline: mammoth_moda2_ar

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 16
    max_model_len: 8192
    gpu_memory_utilization: 0.5
    # Eager by default: unconstrained greedy I2T under compile diverges from
    # eager (bf16 LSB drift), and the quality gate for flipping the default
    # is still being defined (#7138). Opt back in on the serve CLI with:
    #   --stage-overrides '{"0": {"enforce_eager": false,
    #                             "compilation_config": {"mode": 3, "cudagraph_mode": "NONE"}}}'
    # (1.40-1.63x AR decode tok/s across bs=1/2/4/8 on H800.)
    enforce_eager: true
    # Embed-early + async scheduling is unsafe: a `-1` pending-token
    # sentinel can reach the dual-vocab embedding gather (OOB at batch >= 8).
    async_scheduling: false
    trust_remote_code: true
    enable_prefix_caching: false
