# Chatterbox Turbo deploy: T3 (GPT-2 backbone) -> S3Gen (meanflow + HiFT).
#
# Default mode is async-chunk streaming through SharedMemoryConnector. Pass
# ``--no-async-chunk`` to the serve CLI to have stage 1 decode each finished
# utterance once instead.
#
# Stage 0 runs in bfloat16 with CUDA graphs. Stage 1 runs in float32 (the
# vocoder is not half-precision safe) and eagerly (its convolutions see a
# different length every step).
#
# Prefix caching is off for correctness, not speed: stage 0's prompt is
# placeholder ids, and the real prefix arrives as embeddings, so two requests
# of equal length would share a cache entry whatever their voice or text.
#
# No stage loads a tokenizer: prompts are placeholder ids and nothing is
# detokenized. Loading one would also have vLLM look in the repo for the
# config.json it does not ship and log the miss as an error in every process.
#
# Chunking: the first chunk is 15 tokens plus the padding that aligns the
# reference prompt to 15 (20 for a ten-second reference), then 30, then 60;
# every chunk waits for the flow's 3-token lookahead. Smaller chunks start
# audio sooner and cost more flow work. Stage 1 decodes each chunk from a
# fixed 50-token left context of its own, so no left-context key is set here.
#
# Sized on one 24 GB card (see the recipe for the measurements). TUNE PER
# GPU: on a slower card lower max_num_seqs before raising the chunk size.
pipeline: chatterbox_turbo
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 15
      codec_pre_lookahead_frames: 3
      codec_max_chunk_frames: 60
      codec_stream_scale_factor: 2
      codec_vocab_size: 6561

stages:
  - stage_id: 0
    # Halves the backbone's weights. Its logits are only sampled from, and
    # the end-to-end transcripts pass with it.
    dtype: bfloat16
    max_num_seqs: 8
    # 1 speaker slot + up to 375 prompt tokens + text + 1 start token + 1000
    # output tokens: a text of up to 671 tokens has the full 1000-token
    # output. A longer text is accepted and ends at whatever the 2048 leave
    # for output; the engine refuses a prompt of 2048 tokens or more.
    max_model_len: 2048
    # One step can prefill a whole prompt. A smaller budget splits the
    # prefill over steps, which stage 0 handles: later first token, steadier
    # decode steps for the requests already speaking.
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.35
    enforce_eager: false
    enable_prefix_caching: false
    skip_tokenizer_init: true
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_k: 1000
      top_p: 0.95
      repetition_penalty: 1.2
      max_tokens: 1000

  - stage_id: 1
    dtype: float32
    max_num_seqs: 8
    # Stage 0's max_model_len, which bounds an utterance whatever max_tokens
    # a request asks for: each step hands the stage the whole utterance so
    # far. Keep the two equal.
    max_model_len: 2048
    # At least max_num_seqs * max_model_len (8 * 2048); the stage refuses to
    # start with less. A new request the step's budget cannot cover is
    # scheduled with part of its tokens, and the decoder would take that
    # part for the utterance.
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.15
    enforce_eager: true
    skip_tokenizer_init: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
