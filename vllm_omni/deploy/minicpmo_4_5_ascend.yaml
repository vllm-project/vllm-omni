# Thinker 40960; MRv2; two Talker and Code2Wav replicas; five-step CFM.
# Render DRAFT_MODEL_PATH with recipes/OpenBMB/serve_minicpmo_ascend.sh.
pipeline: minicpmo_4_5
model_runner: v2
async_chunk: true
session_mode: duplex
duplex_session:
  max_sessions: 16
trust_remote_code: true
enable_prefix_caching: false
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 32
      codec_left_context_frames: 3
      enable_hift_graph: true
      cfm_cross_bucket_merge: true
      hift_graph_continuation_frames:
      - 3
      - 34
      hift_graph_exact_batch_sizes:
      - 1
      - 2
      enable_cfm_graph: true
      cfm_fused_body: true
      cfm_npu_cross_reference_batching: true
      enable_code2wav_encoder_graph: true
      code2wav_encoder_graph_rows: 4
      code2wav_encoder_max_graphs: 12
      code2wav_encoder_capture_after: 8
      max_graph_batch: 32
      micro_batch_size: 4
      cfm_precapture_empty_cache: true
      cfm_max_graphs: 96
      cfm_graph_precapture_at_init: true
      token2wav_spk_cpu_reference: true
      token2wav_n_timesteps: 5
      token2wav_runtime_prompt_cache_size: 64
      token2wav_setup_cache_size: 64
      code2wav_encoder_tail_precapture: true
      cfm_graph_capture_frames:
      - 16
      - 32
      - 48
      - 64
      - 80
      token2wav_ref_prefetch_setup: true
stages:
- stage_id: 0
  max_num_seqs: 16
  gpu_memory_utilization: 0.55
  enforce_eager: false
  enable_prefix_caching: false
  tensor_parallel_size: 1
  max_num_batched_tokens: 8192
  devices: '1'
  interleave_mm_strings: true
  media_io_kwargs:
    video:
      fps: 1
      num_frames: 128
  limit_mm_per_prompt:
    image: 64
    audio: 64
    video: 1
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 2048
    seed: 42
    detokenize: true
    repetition_penalty: 1.0
  additional_config:
    encoder_enable_npu_graph: true
    encoder_max_npu_graphs: 4
  compilation_config:
    cudagraph_mode: FULL_DECODE_ONLY
  model_runner: v2
  kv_cache_memory_bytes: 17179869184
  max_model_len: 40960
  hf_overrides:
    rope_parameters:
      rope_type: yarn
      rope_theta: 1000000.0
      factor: 4.0
      original_max_position_embeddings: 10240
  async_scheduling: false
  speculative_config:
    method: dspark
    model: DRAFT_MODEL_PATH
    num_speculative_tokens: 7
    draft_tensor_parallel_size: 1
  model_subdir: thinker-w8a8
- stage_id: 1
  max_num_seqs: 16
  gpu_memory_utilization: 0.1
  enforce_eager: false
  max_num_batched_tokens: 8192
  max_model_len: 4096
  devices: 1,0
  output_connectors:
    to_stage_2: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.8
    top_p: 0.85
    top_k: 25
    repetition_penalty: 1.05
    min_tokens: 50
    max_tokens: 4096
    seed: 42
    detokenize: false
    stop_token_ids:
    - 1
  num_replicas: 2
  kv_cache_memory_bytes: 4294967296
  speculative_config:
    method: ngram
    num_speculative_tokens: 15
    prompt_lookup_min: 1
    prompt_lookup_max: 1
  async_scheduling: false
  compilation_config:
    cudagraph_mode: FULL_DECODE_ONLY
  model_runner: v2
  model_subdir: original
  additional_config:
    ascend_compilation_config:
      enable_npugraph_ex: true
      enable_static_kernel: true
      enable_super_kernel: false
- stage_id: 2
  max_num_seqs: 16
  gpu_memory_utilization: 0.22
  enforce_eager: true
  enable_chunked_prefill: false
  max_num_batched_tokens: 65536
  max_model_len: 65536
  devices: 0,1
  input_connectors:
    from_stage_1: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 65536
    detokenize: true
  num_replicas: 2
  additional_config:
    code2wav_enable_npu_graph: true
    cfm_graph_batch_buckets:
    - 1
    - 2
    - 4
    - 8
    code2wav_max_npu_graphs: 96
  model_runner: v2
  model_subdir: original
