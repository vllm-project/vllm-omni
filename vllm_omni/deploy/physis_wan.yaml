pipeline: physis_wan
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    enforce_eager: true
    video_output_transport:
      enable_device_postprocess: true
    model_class_name: PhysisWanPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    default_sampling_params:
      # Resolve the frame count from the selected profile and chunk count.
      num_frames: null
    parallel_config:
      pipeline_parallel_size: 4
    model_config:
      physis_profile: wan21_1p3b
      num_denoise_steps: 4
      ar_diffusion_stage_config:
        step_replicas: 4
        max_batch_size: 1
        max_history_chunks: 18
