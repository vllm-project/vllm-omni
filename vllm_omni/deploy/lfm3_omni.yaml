# LFM3-Omni bring-up profile, verified on 1x Ascend 910B1 64 GiB and 1x RTX 4090 24 GB.
# Eager execution owns per-request convolution state.
async_chunk: false
model_runner: v1
dtype: bfloat16
connectors:
  codec:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 4
    max_model_len: 4096
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.6
    kv_cache_memory_bytes: 1073741824
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    output_connectors:
      to_stage_1: codec
    engine_extras:
      shutdown_timeout: 30
      has_sampling_extra_args: true
    default_sampling_params:
      extra_args:
        audio_temperature: 0.4
        audio_repetition_penalty: 1.2
        audio_repetition_window: 64
      temperature: 0.0
      max_tokens: 512
      seed: 42
  - stage_id: 1
    devices: "0"
    skip_tokenizer_init: true
    max_num_seqs: 4
    max_model_len: 4096
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.2
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    engine_extras:
      shutdown_timeout: 30
    input_connectors:
      from_stage_0: codec
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1
