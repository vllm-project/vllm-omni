model_runner: v2
async_chunk: false
dtype: bfloat16
stages:
  - stage_id: 0
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 8192
    kv_cache_memory_bytes: 268435456
    skip_tokenizer_init: true
    enable_prefix_caching: false
    async_scheduling: false
    enforce_eager: false
    devices: "0"
    engine_extras:
      hf_overrides:
        architectures: [PhononTalkerForConditionalGeneration]
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1500
      detokenize: false
      stop_token_ids: [1]
