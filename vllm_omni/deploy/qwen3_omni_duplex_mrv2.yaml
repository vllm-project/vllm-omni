# Opt-in CUDA Model Runner V2 profile for Qwen3-Omni duplex.
# Thinker retains KV across turns; Talker and Code2Wav remain per-turn.
# Native transport ends each turn independently of the resident Thinker.
# Non-CUDA platforms stay on V1 through the base profile.
base_config: qwen3_omni_moe_mrv2.yaml

session_mode: duplex

stages:
  - stage_id: 0
    # Reuse matching history KV and cached stage-output rows across commits.
    # Non-CUDA platform overrides keep caching off.
    enable_prefix_caching: true
    limit_mm_per_prompt:
      audio: 4
      image: 8
