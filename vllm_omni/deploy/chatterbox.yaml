# English Chatterbox Original: paired Llama T3 -> ten-step S3Gen -> HiFT.
# Each guided request occupies two stage-0 sequence slots. The atomic CFG
# scheduler requires enough token budget to prefill a whole pair, and disables
# asynchronous scheduling, chunked prefill, and prefix caching.
#
# The one Original profile: 64 guided requests at once (128 stage 0
# sequences), what one H100 (79.6 GiB) fits with the memory arithmetic
# below; the H100 recipe measures it from 8 to 64 clients. TUNE PER GPU: on
# a smaller or slower card lower max_num_seqs (and the fractions with it).
pipeline: chatterbox
model_runner: v2
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 15
      codec_max_chunk_frames: 60
      codec_stream_scale_factor: 2
      # Played tokens stage 1 decodes each chunk with again (two seconds).
      codec_left_context_frames: 50
stages:
  - stage_id: 0
    hf_overrides:
      variant: original
    dtype: bfloat16
    max_num_seqs: 128
    max_model_len: 2048
    # One guided pair's prefill at once.
    max_num_batched_tokens: 4096
    # Measured on H100: 1.32 GiB of weights with vLLM's own, 0.16 GiB of
    # activations, 0.08 GiB of graphs and 120 KiB of KV cache per token. The
    # 128 sequences at 2048 tokens need 30.0 GiB of KV cache, about 31.6 GiB
    # in all; 0.45 of the H100's 79.6 GiB is 35.8 GiB.
    gpu_memory_utilization: 0.45
    enforce_eager: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    skip_tokenizer_init: true
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    # The reference encoders run in the API process, on the stages' device:
    # the API process must see device 0. NPU, XPU and MUSA use the CPU
    # (platforms block below). Read by the serving adapter.
    # A request's exaggeration and cfg_weight when it gives none are
    # upstream's ChatterboxTTS.generate defaults.
    additional_config:
      conditioning_device: cuda:0
      exaggeration: 0.5
      cfg_weight: 0.5
    default_sampling_params:
      temperature: 0.8
      top_k: -1
      top_p: 1.0
      min_p: 0.05
      repetition_penalty: 1.2
      max_tokens: 1000
  - stage_id: 1
    hf_overrides:
      variant: original
    dtype: float32
    # Seeds the flow-noise buffer, so every process draws the same one.
    seed: 0
    # One utterance per guided request.
    max_num_seqs: 64
    max_model_len: 2048
    # max_num_seqs * max_model_len, as the stage requires.
    max_num_batched_tokens: 131072
    # This stage keeps no KV cache; the fraction bounds the flow's and HiFT's
    # activations for max_num_seqs utterances (11.9 GiB of the H100).
    gpu_memory_utilization: 0.15
    enforce_eager: true
    skip_tokenizer_init: true
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory

# The reference encoders cannot use an NPU, XPU or MUSA device; ROCm keeps
# cuda:0. A platform's additional_config replaces the stage's, so the
# controls are restated.
platforms:
  npu:
    model_runner: v1
    stages:
      - stage_id: 0
        additional_config:
          conditioning_device: cpu
          exaggeration: 0.5
          cfg_weight: 0.5
  xpu:
    model_runner: v1
    stages:
      - stage_id: 0
        additional_config:
          conditioning_device: cpu
          exaggeration: 0.5
          cfg_weight: 0.5
  rocm:
    model_runner: v1
  musa:
    model_runner: v1
    stages:
      - stage_id: 0
        additional_config:
          conditioning_device: cpu
          exaggeration: 0.5
          cfg_weight: 0.5
