# MiniCPM-o 4.5 on Ascend: every stage on Model Runner V2.
#
# Unlike the CUDA profile (Talker pinned to V1 for multi-frame decode), this
# NPU overlay runs all three stages on MRv2:
#   stage 0 (Thinker)  - MRv2 via NPUOmniModelState (Ascend attention metadata)
#   stage 1 (Talker)   - MRv2; the V1-only K-step multi-frame block is dropped
#                        (MRv2 has no K-step re-embed), so decoding is one
#                        frame per step here
#   stage 2 (Code2Wav) - MRv2 via NPUOmniGenerationModelRunner
base_config: minicpmo_4_5.yaml

platforms:
  npu:
    model_runner: v2
    stages:
      - stage_id: 1
        async_scheduling: true
        # K-step multi-frame decode is a V1 runner feature (talker_multiframe
        # intercepts the V1 execute_model step). MRv2 decodes one frame per
        # step, so the inherited speculative block must be dropped.
        speculative_config: null
