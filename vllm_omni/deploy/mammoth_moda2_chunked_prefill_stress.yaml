# MammothModa2 AR→DiT chunked-prefill stress preset (#7116).
# Tiny token budget forces multi-chunk prefills even on short T2I prompts.
# Not for production throughput.

async_chunk: false
pipeline: mammoth_moda2

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    max_model_len: 8192
    enable_chunked_prefill: true
    max_num_batched_tokens: 16
    gpu_memory_utilization: 0.5
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false

  - stage_id: 1
    devices: "0"
    max_num_seqs: 8
    request_batch_max_wait_ms: 20
    gpu_memory_utilization: 0.3
    enforce_eager: true
    step_execution: false
    trust_remote_code: true
    enable_prefix_caching: false
