pipeline: lfm3_omni_text
# LFM3-Omni bring-up profile. Eager execution owns per-request convolution state.
async_chunk: false
model_runner: v1
dtype: bfloat16
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 4
    max_model_len: 4096
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.6
    kv_cache_memory_bytes: 1073741824
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    engine_extras:
      shutdown_timeout: 30
      has_sampling_extra_args: true
    default_sampling_params:
      extra_args:
        generation_mode: text
      temperature: 0.0
      max_tokens: 512
      seed: 42
