# Opt-in single-H200 MRv2 profile, measured at client concurrency 32/64.
# Run all stages under NVIDIA MPS and warm representative shapes first.
# Retains Triton MoE and native nucleus reductions, fusing only the final
# sampling mask/Gumbel selection. cuDNN searches convolution algorithms
# during warmup; short-KV attention and convolution selection change rounding.
# This is not a claim of bitwise audio or universal P99/throughput improvement.
# Evidence: docs/design/qwen3_omni_mrv2_performance.md
base_config: qwen3_omni_moe_mrv2.yaml

connectors:
  connector_of_shared_memory:
    extra:
      code_predictor_kv_cache: true
      code_predictor_short_kv: true
      code_predictor_fused_sampling: true
      codec_cudnn_benchmark: true

stages:
  - stage_id: 0
    devices: "0"
    gpu_memory_utilization: 0.60
  - stage_id: 1
    devices: "0"
    gpu_memory_utilization: 0.22
  - stage_id: 2
    devices: "0"
    gpu_memory_utilization: 0.10
