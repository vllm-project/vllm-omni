# Opt-in Ming image step-wise continuous-batching profile.
# Unlike request_batch_max_wait_ms, step_execution advances each active request
# by one diffusion denoise step per scheduler tick.
pipeline: ming_flash_omni_image
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 8
    gpu_memory_utilization: 0.85
    enforce_eager: true
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    output_connectors:
      to_stage_1: shared_memory_connector
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 1
      seed: 42

  - stage_id: 1
    max_num_seqs: 4
    step_execution: true
    gpu_memory_utilization: 0.85
    enforce_eager: true
    devices: "4"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 42

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1

platforms: {}
