# LongCat-Next deploy: thinker (bf16, TP=4) + image decoder + audio decoder on
# 5x A40-48GB. GPUs 0-3: thinker TP=4 bf16 (~37 GB/GPU, ~11 GB headroom for
# KV cache + activations). GPU 4: both decoders sequentially (image decoder
# ~15-20 GiB estimated, audio decoder ~3.33 GiB measured — stages never run
# in parallel, so GPU 4 has ~28-33 GiB free at any given time).
#
# LONGCAT_NEXT_PIPELINE stages: 0=thinker (AR), 1=image_decoder (generation),
# 2=audio_decoder (generation).
pipeline: longcat_next
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.92
    max_num_batched_tokens: 4608
    max_model_len: 8192
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: image_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.45
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "4"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

  - stage_id: 2
    model_stage: audio_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.09
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "4"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
