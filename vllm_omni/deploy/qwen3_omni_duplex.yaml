# Concurrent input / interruptible VAD turns; not native streaming input KV.
# This historical V1 profile is unavailable with vLLM 0.34 and is rejected.
# Use qwen3_omni_duplex_mrv2.yaml for the V2 duplex path.
# Unconfigured history_policy uses full_history: all effective originals, with
# capacity errors instead of clipping. Set model_custom_options.history_policy
# to recent in a duplex_session overlay to restore the legacy bounded window.
base_config: qwen3_omni_moe.yaml
model_runner: v1
session_mode: duplex
stages:
  - stage_id: 0
    # The base profile's Thinker prefix cache is validated for turn serving only.
    enable_prefix_caching: false
    limit_mm_per_prompt:
      audio: 4
      image: 8
