# Concurrent input / interruptible VAD turns with resident Thinker KV.
# The turn deploy defaults to model runner v2. Duplex stays on V1; use
# qwen3_omni_duplex_mrv2.yaml for the V2 duplex path.
base_config: qwen3_omni_moe.yaml
model_runner: v1
session_mode: duplex
stages:
  - stage_id: 0
    # Synchronous V1 scheduling retains Thinker KV across committed turns.
    # Prefix-output rows are replayed to each fresh downstream speech request.
    async_scheduling: false
    enable_prefix_caching: true
    limit_mm_per_prompt:
      audio: 4
      image: 8
