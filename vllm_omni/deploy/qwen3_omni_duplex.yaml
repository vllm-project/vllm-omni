# Concurrent input / interruptible VAD turns with resident Thinker KV.
# CUDA uses Model Runner V2; non-CUDA platforms stay on V1 through the base
# profile. Thinker retains KV across turns; Talker and Code2Wav remain per-turn.
# Native transport ends each turn independently of the resident Thinker.
base_config: qwen3_omni_moe_mrv2.yaml

session_mode: duplex

stages:
  - stage_id: 0
    # Reuse matching history KV and cached stage-output rows across commits.
    # Non-CUDA platform overrides keep caching off.
    enable_prefix_caching: true
    limit_mm_per_prompt:
      audio: 4
      image: 8
