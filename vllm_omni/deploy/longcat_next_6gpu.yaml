# LongCat-Next deploy: thinker + image decoder + audio decoder (6 GPUs).
#
# Requires 6x80GB GPUs. Stage 0 at TP=4 bf16 uses ~37 GB/GPU, leaving ample
# headroom. Image and audio decoders each get dedicated GPUs.
pipeline: longcat_next
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.85
    max_num_batched_tokens: 8192
    max_model_len: 65536
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    max_num_seqs: 1
    tensor_parallel_size: 1
    devices: "4"
    gpu_memory_utilization: 0.1
    enforce_eager: true
    max_num_batched_tokens: 8192
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

  - stage_id: 2
    max_num_seqs: 1
    tensor_parallel_size: 1
    devices: "5"
    gpu_memory_utilization: 0.1
    enforce_eager: true
    max_num_batched_tokens: 8192
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
