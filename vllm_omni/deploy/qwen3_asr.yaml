# Qwen3-ASR single-stage deploy profile: audio in, transcript text out.
#
#   vllm-omni serve Qwen/Qwen3-ASR-1.7B --omni --trust-remote-code \
#       --deploy-config vllm_omni/deploy/qwen3_asr.yaml
#
# WORD TIMESTAMPS. Adding --forced-aligner Qwen/Qwen3-ForcedAligner-0.6B
# enables `response_format=verbose_json` + `timestamp_granularities[]=word`,
# but the aligner is hosted *in the API server process* and lands on the first
# visible CUDA device, taking a further 0.30 by default (see
# qwen3_tts_forced_aligner.yaml). 0.85 + 0.30 over-subscribes the card, and the
# aligner loads lazily, so the server starts healthy and then fails the first
# alignment request with ForcedAlignerLoadError. Either:
#
#   * give the aligner its own card (place this stage with `devices:`), or
#   * drop gpu_memory_utilization here to ~0.55 when co-locating.
#
# Measured on 1xH100, 30s mp3 clips, VLLM_OMNI_AUDIO_DECODE_PROCS=16:
#   gpu_memory_utilization=0.85, no aligner   113.8 req/s  (3414 RTFx)
#   gpu_memory_utilization=0.55, no aligner    57.8 req/s  (1734 RTFx)
# Do not lower this value without needing to -- KV cache is what feeds the
# concurrency this model needs to saturate the GPU.
pipeline: qwen3_asr

stages:
  - stage_id: 0
    max_num_seqs: 256
    # 30s of audio is a large multimodal prefill; the 16384 default splits it
    # across more chunked-prefill steps than necessary.
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.85
    trust_remote_code: true
    enable_prefix_caching: true
    max_model_len: 8192
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256
