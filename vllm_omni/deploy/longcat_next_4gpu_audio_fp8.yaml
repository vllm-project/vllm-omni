# LongCat-Next deploy: thinker (fp8, TP=4) + audio decoder, colocated on
# 4x A100-40GB.
#
# longcat_next_4gpu_audio.yaml (bf16, no quantization) assumes 80GB GPUs
# per its own comment -- this cluster's cards are actually A100-SXM4-40GB
# (39.49 GiB usable, confirmed via nvidia-smi -L in every job log). bf16
# TP=4 needs ~37 GB/GPU for weights alone, leaving ~2.5 GiB free -- nowhere
# near enough for KV cache + activations + a colocated decoder. A job
# attempting that (15026232) was canceled before it ran once this was
# caught.
#
# Stage 0 here is copied VERBATIM from the proven longcat_next_4gpu.yaml
# (fp8 quantization) -- the only thinker config actually GPU-measured on
# this hardware: 33.79 GiB weights+non-torch, 1.28 GiB peak activation,
# 0.98 GiB KV cache at gpu_memory_utilization=0.92, leaving ~3.44 GiB
# genuinely free (39.49 - 36.05) on every GPU, including GPU 3.
#
# Stage 1's gpu_memory_utilization is bumped from
# longcat_next_4gpu_audio.yaml's original 0.08 (~3.16 GiB) to 0.09
# (~3.55 GiB), based on REAL measurement:
# pbs/longcat_next_audio_decoder_standalone.pbs (2026-07-29, job 15026737,
# run standalone on an otherwise-empty GPU) measured 3.33 GiB total /
# 2.61 GiB peak-allocated for this decoder -- i.e. the ORIGINAL 0.08 budget
# was already below what the decoder actually needs, before even
# considering colocation. VERDICT PASS on that run (both a 2-frame real
# chunk and a 40-frame synthetic chunk decoded to real waveforms), so the
# decoder itself is confirmed correct -- this is purely a memory-budget
# adjustment.
#
# The residual math is still razor-thin: ~3.44 GiB free after the fp8
# thinker loads (see above) vs ~3.33-3.55 GiB needed here -- roughly
# 0.1-0.3 GiB of slack either way, not a comfortable margin, and the
# standalone measurement was on a GPU with nothing else resident (no
# co-located process, no NCCL buffers, no second CUDA context). Colocating
# with an already-loaded TP-rank-3 process could plausibly use more. This
# combination is a reasonable next thing to test, not a confirmed fit --
# expect this may still need iteration (e.g. trimming stage 0's KV cache
# budget slightly to free more room) if it OOMs.
#
# Top-level `quantization` applies uniformly to every stage per
# DeployConfig's own docstring (stage_config.py) -- there is no per-stage
# override in this schema. Checked whether that puts stage 1 at risk:
# modeling_longcat_next_audio_decoder.py never references quant_config
# anywhere (grep confirms zero hits) -- its VQ-bridge/flow-matching/
# vocoder submodules are built via get_remote_attr as plain nn.Module
# classes straight from the checkpoint, never wired through vLLM's
# quantizable linear layers. So fp8 has no mechanism to reach stage 1's
# weights. This is a static-code-reading conclusion, not runtime-verified
# -- worth confirming the decoder's logged weight-loading numbers still
# look like full-precision bf16, not truncated/corrupted, on the first
# real run.
#
# That real footprint is what
# pbs/longcat_next_audio_decoder_standalone.pbs measures in isolation --
# check its VERDICT/peak-allocated numbers before submitting a job with
# this config, since 3.44 GiB is a thin, unverified margin, not a
# confirmed fit.
pipeline: longcat_next_thinker_audio
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false
quantization: fp8

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.92
    max_num_batched_tokens: 4608
    max_model_len: 16384
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: audio_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.09
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "3"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
