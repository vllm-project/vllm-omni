# YuE2-3B deploy: single-stage native-AR text-to-music (~3.6B bf16 + VAE).
# Target 1x 24 GB card; verified on a single RTX 4090.
#
# The architectures pin is required: the checkpoint's config.json names
# "YuE2ForCausalLM" with an auto_map that only makes sense under
# trust_remote_code, so the deploy pins vLLM to this package's model class.
# model_type stays "yue2" so the registered Yue2Config is used.
pipeline: yue2
async_chunk: false
dtype: bfloat16
trust_remote_code: true

stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.85
    # The Qwen3-shaped AR backbone is captured by vLLM's graph dispatcher
    # (FULL_AND_PIECEWISE; 4 piecewise + 3 FULL decode graphs, capture sizes
    # 1..8, ~1 s and 0.05 GiB). Measured on one RTX 5090 with a full-length
    # cot=off song: AR decode 47.4 s -> 21.5 s (2.20x) and the whole
    # AR+NAR+VAE stage 55.6 s -> 29.0 s (1.92x), i.e. 0.355 -> 0.206 s of
    # compute per second of audio, at unchanged peak memory (~33 GB).
    # Two prerequisites still gate this before it can become the default and
    # are tracked in the PR body: the model's per-request bookkeeping has to
    # move to a hook that also runs for replayed steps, and the sampling
    # divergence this exposes needs a Musicality check.
    enforce_eager: false
    # Prefix caching stays off: the omni prefix-cache save snapshots the
    # step's mm payload before the model-owned sampler runs, but YuE2
    # appends the decoded waveform inside sample() (the terminal NAR/VAE
    # pass), so the cached payload would ship empty audio. Re-enable once
    # the runner saves post-sample.
    enable_prefix_caching: false
    max_num_batched_tokens: 24576
    max_model_len: 24576
    devices: "0"
    # The checkpoint ships no HF tokenizer files (only qwen.tiktoken, which
    # the offline driver reads itself); every prompt arrives as token ids,
    # so the engine builds no tokenizer. Placeholder tokenizer dir follows
    # the indextts2 precedent.
    skip_tokenizer_init: true
    tokenizer: gpt2
    hf_overrides:
      architectures: ["Yue2ForCausalLM"]
    default_sampling_params:
      # Placeholder values: the model's own sampler overrides everything from
      # extra_args. Their presence turns on has_sampling_extra_args, which is
      # what threads the per-request yue2_* keys into the model's forward.
      extra_args:
        yue2_phase: "semantic"
        yue2_seed: 831001
        yue2_max_audio_frames: 200
      detokenize: false
      # Engine-side backstop; the model stops on its own end token first.
      max_tokens: 9000
      temperature: 1.0
