# LongCat-Next deploy: thinker (bf16, TP=4) + audio decoder on 5x A40-48GB.
# GPUs 0-3: thinker TP=4 bf16 (~37 GB/GPU, ~11 GB left for KV cache +
# activations). GPU 4: audio decoder (~3.33 GiB). Dedicated decoder GPU
# eliminates the razor-thin colocation margin from 4-GPU configs.
pipeline: longcat_next_thinker_audio
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.92
    max_num_batched_tokens: 4608
    max_model_len: 8192
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: audio_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.09
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "4"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
