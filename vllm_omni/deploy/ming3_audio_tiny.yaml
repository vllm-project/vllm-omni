# Ming-3.0-audio-tiny: audio understanding plus optional speech output.
#
# Stage 0 runs on 1 GPU. Stage 1 shares GPU 0 for the
# self-contained Qwen2 + CFM + AudioVAE talker. Use the thinker-only profile
# when only ASR / Speech-QA text is required.
pipeline: bailing_moe_v3_audio
async_chunk: true
trust_remote_code: false
distributed_executor_backend: mp
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

stages:
  - stage_id: 0
    limit_mm_per_prompt:
      audio: 20
    devices: "0"
    tensor_parallel_size: 1
    # Also disable alternate all-reduce backends via the environment to align the metrics.
    disable_custom_all_reduce: true
    max_num_seqs: 1
    max_model_len: 131072
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.78
    enforce_eager: false
    async_scheduling: false
    enable_prefix_caching: true
    enable_chunked_prefill: true
    engine_extras:
      mamba_cache_mode: align
    compilation_config:
      cudagraph_mode: FULL_AND_PIECEWISE
    default_sampling_params:
      temperature: 0.6
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.18
    enforce_eager: false
    enable_prefix_caching: false
    compilation_config:
      mode: 0
      cudagraph_mode: NONE
    engine_extras:
      hf_overrides:
        enable_llm_cuda_graph: true
        low_latency_streaming: false
        normalize_text: true
        tn_mode: upstream
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

# Native CUDA Bailing/KDA kernels are required.
platforms: {}
