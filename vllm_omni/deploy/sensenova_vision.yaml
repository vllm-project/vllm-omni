# SenseNova-Vision-7B-MoT deploy: CUDA defaults, verified on NVIDIA A100 (80GB).
#
# This mirrors the BAGEL two-stage topology (Thinker + DiT) but the SenseNovaVision
# pipeline runs at max_latent_size=64 (BAGEL ships 32, ~512x512), producing
# outputs up to 1024x1024. Stage 1 therefore needs more memory and a larger
# batched-token budget to fit the larger latent, so gpu_memory_utilization and
# max_num_batched_tokens are bumped relative to bagel.yaml.
#
# Stage 0 (Thinker) and Stage 1 (DiT) share a single GPU by default.
# For dual-GPU setups, set stage 1 devices to "1".
#
# Fields omitted from a stage fall back to StageDeployConfig dataclass
# defaults (see vllm_omni/config/stage_config.py).

async_chunk: false

stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    gpu_memory_utilization: 0.45
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 52
      detokenize: true
      repetition_penalty: 1.05

  - stage_id: 1
    # Must be explicit: unlike BAGEL (whose config.json model_type="bagel"
    # resolves to BagelPipeline in OmniDiffusionConfig.enrich_config), the
    # SenseNovaVision config.json carries no model_type/architectures, so the
    # diffusion stage cannot infer its pipeline class from the checkpoint.
    model_class_name: SenseNovaVisionPipeline
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    gpu_memory_utilization: 0.45
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    devices: "0"
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 52

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector

  rdma_connector:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: ""
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"
