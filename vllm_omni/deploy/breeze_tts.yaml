# Breeze-TTS-2, one GPU, reference-free voice design with CFG=1.
# Both streamed and complete HTTP responses use the stateful codec pipeline.
async_chunk: true
connectors:
  shm:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      codec_chunk_frames: 5
      codec_left_context_frames: 0
      connector_get_sleep_s: 0.005
      connector_get_max_wait_first_chunk: 1000
      connector_get_max_wait: 300
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 2
    max_model_len: 2048
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.65
    kv_cache_memory_bytes: 536870912
    enforce_eager: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    output_connectors:
      to_stage_1: shm
    default_sampling_params:
      temperature: 0.9
      top_p: 1.0
      top_k: 50
      repetition_penalty: 1.1
      max_tokens: 750
      seed: 42
  - stage_id: 1
    devices: "0"
    max_num_seqs: 2
    max_model_len: 16384
    max_num_batched_tokens: 16384
    gpu_memory_utilization: 0.15
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    input_connectors:
      from_stage_0: shm
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      repetition_penalty: 1.0
      max_tokens: 16384
