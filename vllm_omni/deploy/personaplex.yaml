# PersonaPlex deploy: talker -> code2wav (Mimi) via shared-memory chunk streaming.
#
# PersonaPlex is a Moshi finetune (full-duplex S2S), served offline as a 2-stage
# audio->audio pipeline that reuses the Qwen3-TTS staged deploy layout. Fields
# omitted from a stage fall back to StageDeployConfig defaults (see
# vllm_omni/config/stage_config.py).
#
# Notable choices for this model:
#   * Stage 0 (talker) keeps a small max_num_batched_tokens for async-chunk
#     first-chunk latency (not correctness).
#   * Stage 1 (code2wav) wraps the external Mimi codec. Each codec frame is
#     8 active codebooks (cb 0..7) -> 1920 PCM samples @ 24 kHz / 12.5 Hz.
#   * Stage 0 runs cudagraph by default. Stage 1 (Mimi) keeps enforce_eager,
#     since vLLM's own capture records nothing for it; both stages replay their
#     streaming Mimi codec from model-local CUDA graphs (mimi_cuda_graphs).
#   * Each live session holds one 3000-frame KV window (~1.5 GiB) on Stage 0.
#     To serve more sessions, raise duplex_session.max_sessions and both stages'
#     max_num_seqs together (Stage 0's to a cudagraph capture size, e.g. a
#     multiple of 8), and size Stage 0 gpu_memory_utilization for the KV;
#     on a 141 GB card, 16 sessions at Stage 0 utilization 0.75 stay realtime.
pipeline: personaplex
session_mode: duplex
duplex_session:
  max_sessions: 2

async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      # Mimi runs at 12.5 Hz (80 ms / frame). Stream a few frames per chunk:
      # at 16 sessions, 1-frame chunks spend more on per-chunk transfer and
      # scheduling than the shared decode saves.
      codec_chunk_frames: 5
      # Emit only the first audio chunk early, then return to codec_chunk_frames.
      initial_codec_chunk_frames: 1

stages:
  - stage_id: 0
    # Keep max_num_seqs one of vLLM's cudagraph capture sizes (1, 2, 4, then
    # multiples of 8 by default): a step with more rows than the largest size
    # at or below it runs Helium and the depformer without graphs.
    max_num_seqs: 8
    gpu_memory_utilization: 0.4
    trust_remote_code: true
    skip_tokenizer_init: true
    # Prompt IDs are placeholders; voice/persona/audio semantics live in
    # request-specific embeddings, so token-ID prefix caching is invalid.
    enable_prefix_caching: false
    # Every live session appends one frame per 80 ms tick as a one-token
    # resumable request. With async scheduling the next step is scheduled
    # before a session's previous frame is parked, so a session can join only
    # every other step and concurrent sessions split into alternating batches.
    # Synchronous scheduling puts every waiting frame in one step.
    async_scheduling: false
    max_num_batched_tokens: 512
    # Temporal transformer sliding_window is 3000 frames; keep model len within.
    max_model_len: 3000
    devices: "0"
    # Replay each step's streaming Mimi encode (all max_sessions rows) and its
    # post-sample depformer (per padded batch size) from model-local CUDA
    # graphs captured at load.
    hf_overrides:
      mimi_cuda_graphs: true
      depformer_cuda_graphs: true
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      # Greedy talker decoding: the HeliumModel temporal matches Moshi within cos
      # 0.999 (not bit-exact), and chaotic sampling amplifies that into divergence.
      # Greedy is reliably coherent; raise temperature only once the temporal is
      # bit-exact.
      temperature: 0.0
      top_k: 1
      max_tokens: 3000
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    # Sessions run as codec rows in the shared Mimi decoder pass, not independent vLLM engine sequences.
    max_num_seqs: 10
    gpu_memory_utilization: 0.3
    enforce_eager: true
    trust_remote_code: true
    skip_tokenizer_init: true
    enable_prefix_caching: false
    async_scheduling: true
    # Codec prefill length is num_codebooks * num_frames; keep ample headroom.
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    # Replay each frame's streaming Mimi decode (all sessions plus a scratch
    # row) from a model-local CUDA graph captured at load. Decoder GEMMs use
    # TF32 (mimi_decode_tf32, default on); weights stay float32.
    hf_overrides:
      mimi_cuda_graphs: true
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0

platforms:
  npu:
    stages:
      - stage_id: 0
        enforce_eager: false
