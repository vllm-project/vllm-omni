    - 384
    - 448
    - 512
    - 768
    - 1024
    - 1280
    - 1536
    - 1792
    - 2048
    - 2560
    - 3072
    - 3584
    - 4096
    cudagraph_mode: FULL
    max_cudagraph_capture_size: 4096
  default_sampling_params:
    max_tokens: 4096
    repetition_penalty: 1.0
    seed: 42
    temperature: 1.7
    top_k: 25
    top_p: 0.8
  devices: '0'
  enable_prefix_caching: false
  gpu_memory_utilization: 0.6
  kv_cache_memory_bytes: 34359738368
  max_model_len: 4096
  max_num_batched_tokens: 4096
  max_num_seqs: 256
  output_connectors:
    to_stage_1: shm
  stage_id: 0
  attention_config:
    backend: TRITON_ATTN
  hf_overrides:
    moss_first_frame_empty_history: true
    moss_backbone_fused_kernels: true
- async_scheduling: true
