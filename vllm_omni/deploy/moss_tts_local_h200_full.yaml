# Retained MOSS Local BF16 full pipeline on one H200.
# First PCM: 1 frame; codec priming: 15 frames; subsequent PCM: 14, 15, ...
# See recipes/OpenMOSS/MOSS-TTS.md for prerequisites and measurement limits.
dtype: bfloat16
async_chunk: true
connectors:
  shm:
    extra:
      codec_chunk_frames: 15
      codec_left_context_frames: 0
      connector_get_max_wait: 300
      connector_get_max_wait_first_chunk: 1000
      connector_get_sleep_s: 0.005
      generation_batch_hold_first_audio: false
      generation_batch_hold_terminal_audio: true
      generation_batch_min_size: 8
      generation_batch_wait_ms: 10
      initial_codec_chunk_frames: 1
      moss_talker_first_audio: true
      moss_defer_codec_prime: true
    name: SharedMemoryConnector
model_runner: v2
stages:
- async_scheduling: true
  compilation_config:
    cudagraph_capture_sizes:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 24
    - 32
    - 40
    - 48
    - 56
