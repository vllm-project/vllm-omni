# LongCat-Next deploy: thinker (2-node TP=8) + audio decoder.
#
# Thinker uses all 8 GPUs with TP=8 BF16 across 2 nodes (4 A100 80GB each).
# The audio decoder must run on a GPU not consumed by the thinker's TP group,
# using Mooncake for cross-node inter-stage data transfer.
#
# REQUIRES:
#   1. Ray cluster across both nodes
#   2. `mooncake` package installed (pip install mooncake)
#   3. Mooncake metadata server running
#
# Alternative (simpler, tested): use pbs/longcat_next_multinode_thinker.pbs
# and pbs/longcat_next_multinode_audio_decoder.pbs with file-based handoff.
# These bypass Mooncake entirely for debugging/testing.
pipeline: longcat_next_thinker_audio
async_chunk: false

trust_remote_code: true
distributed_executor_backend: ray
enable_prefix_caching: false

connectors:
  default:
    name: MooncakeStoreConnector
    extra: {}

edges:
  - from: "0"
    to: "1"
    connector: default

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 8
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.88
    max_num_batched_tokens: 16384
    max_model_len: 131072
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: audio_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.08
    enforce_eager: true
    max_num_batched_tokens: 8192
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
