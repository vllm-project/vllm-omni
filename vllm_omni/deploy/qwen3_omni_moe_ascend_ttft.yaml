# Opt-in Ascend TTFT profile measured on 3 x 910B1 with BF16 Instruct weights.
# Thinker uses TP2 on devices 0,1; Talker and Code2Wav share device 2.
# Pair with --api-server-count 2 for the measured combined deployment.
# Larger capture sets add startup work and persistent graph buffers.
base_config: qwen3_omni_moe.yaml

platforms:
  npu:
    stages:
      - stage_id: 0
        enable_prefix_caching: true
        # Keep async chunk streaming; this controls the Thinker scheduler only.
        async_scheduling: false
        compilation_config:
          cudagraph_mode: FULL_AND_PIECEWISE
          decode_cudagraph_capture_request_sizes:
            - 1
            - 2
            - 4
            - 8
            - 16
            - 24
            - 32
            - 40
            - 48
            - 56
            - 64
          prefill_cudagraph_capture_token_sizes:
            - 1
            - 2
            - 4
            - 8
            - 16
            - 24
            - 32
            - 40
            - 48
            - 56
            - 64
            - 128
            - 144
            - 160
            - 192
            - 256
            - 384
            - 512
            - 640
            - 768
            - 896
            - 1024
            - 1280
            - 1536
            - 1792
            - 2048
            - 2304
            - 2560
            - 2816
            - 3072
            - 3328
            - 3584
            - 3840
            - 4096
