# minWM Action2V stepwise deploy: single diffusion stage for WS /v1/realtime/video.
#
# One AsyncOmni request is one rollout: prepare_encode runs once, then every
# four DMD steps stream one four-latent-frame AR block. Step execution keeps
# AR-Diffusion paged KV on ARDiffusionModelRunner, so this stage must stay at
# max_num_seqs=1. Mid-stream prompt updates switch the text conditioning at
# the next block boundary.
#
# The cache geometry is fixed at load time, so ar_diffusion_height/width must
# match the height/width a client asks for.

pipeline: minwm
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: MinWMAction2VPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    default_sampling_params:
      num_inference_steps: 4
      output_type: pil
    model_config:
      ar_diffusion_height: 480
      ar_diffusion_width: 832
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.3
