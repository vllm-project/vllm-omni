# Ming-flash-omni-2.0 A6.1 validation profile.
#
# Stage 1 computes positive and negative CFG branches on two ranks.  The
# default image profile is unchanged; use this file only on a host with two
# free diffusion GPUs (and four GPUs for the thinker stage).
pipeline: ming_flash_omni_image
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    # Parent + CFG companion request when a negative prompt is supplied.
    max_num_seqs: 2
    gpu_memory_utilization: 0.85
    enforce_eager: true
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    output_connectors:
      to_stage_1: shared_memory_connector
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 1
      seed: 42

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.85
    enforce_eager: true
    devices: "4,5"
    engine_args:
      parallel_config:
        tensor_parallel_size: 1
        cfg_parallel_size: 2
    input_connectors:
      from_stage_0: shared_memory_connector
    default_sampling_params:
      seed: 42

connectors:
  shared_memory_connector:
    name: SharedMemoryConnector

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1

platforms: {}
