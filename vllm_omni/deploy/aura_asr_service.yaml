pipeline: aura_asr
async_chunk: false

stages:
  - stage_id: 0
    max_num_seqs: 8
    gpu_memory_utilization: 0.3
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_model_len: 8192
    max_num_batched_tokens: 4096
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256
