# AURA Omni with a response-judge stage (opt-in variant of aura_omni.yaml):
# Qwen3-ASR -> response judge -> AURA/Qwen3-VL -> Qwen3-TTS Talker -> Code2Wav.
#
# VAD commits a turn on every pause. The judge reads the ASR transcript and
# decides whether the turn needs a reply; a backchannel, cough, noise or side
# talk ends at the judge and AURA/TTS do not run. Serve aura_omni.yaml instead
# to turn the judge off; that pipeline is unchanged and loads no judge model.
#
# The judge is any model configured on stage 1: this file uses Qwen3-1.7B
# (one YES/NO token). aura_omni_judged_laya.yaml swaps in the LAYA decision
# model by overriding stage 1 only.
#
# Supported online path is Realtime duplex (`/v1/realtime?duplex=1`).
pipeline: aura_omni_judged
session_mode: duplex
duplex_session:
  max_sessions: 1
# DuplexOrchestrator forwards ASR/judge/AURA through their input processors;
# only Talker → Code2Wav (stage 3 → 4) consumes asynchronous codec chunks.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      # initial=1 can stall Code2Wav on the first undersized chunk under duplex.
      initial_codec_chunk_frames: 8
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]

stages:
  - stage_id: 0
    max_num_seqs: 8
    gpu_memory_utilization: 0.1
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_model_len: 8192
    max_num_batched_tokens: 4096
    devices: "0"
    model: Qwen/Qwen3-ASR-1.7B
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256

  - stage_id: 1
    # Response judge: one YES/NO token from the ASR transcript.
    hf_overrides:
      response_judge:
        format: chat_yes_no
    max_num_seqs: 8
    gpu_memory_utilization: 0.08
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_model_len: 2048
    max_num_batched_tokens: 2048
    devices: "0"
    model: Qwen/Qwen3-1.7B
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

  - stage_id: 2
    max_num_seqs: 4
    gpu_memory_utilization: 0.4
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_model_len: 262144
    max_num_batched_tokens: 15360
    devices: "0"
    model: aurateam/AURA
    default_sampling_params:
      temperature: 0.5
      top_p: 1.0
      top_k: -1
      max_tokens: 256
      repetition_penalty: 1.0

  - stage_id: 3
    max_num_seqs: 8
    gpu_memory_utilization: 0.2
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_4: connector_of_shared_memory
    model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    # model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 4
    max_num_seqs: 8
    gpu_memory_utilization: 0.2
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_3: connector_of_shared_memory
    model: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    # model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0

platforms:
  npu:
    stages:
      - stage_id: 3
        enforce_eager: true
