# MammothModa2 AR-only with opt-in automatic prefix caching.
#
# Prefix-cache hits preserve token/hidden alignment, but BF16 attention can
# produce non-bitwise-equivalent tail hidden states. See the prefix caching
# design document for the numerical-equivalence contract.

base_config: mammoth_moda2_ar.yaml
pipeline: mammoth_moda2_ar

stages:
  - stage_id: 0
    enable_prefix_caching: true
