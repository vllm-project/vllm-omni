# H100-tested throughput overlay: BF16 flow, FP32 HiFT and shared GPU execution.
# Requires CUDA, native cuDNN SDPA and nvidia-cuda-mps-control on PATH.
# Floating-point audio differs from FP32; see the recipe for measured quality,
# warmup, concurrency and latency limits. The ordinary profiles retain FP32 flow.
base_config: chatterbox_turbo_high_concurrency.yaml
cuda_mps: true

stages:
  - stage_id: 1
    hf_overrides:
      flow_dtype: bfloat16
      flow_attention_backend: cudnn
