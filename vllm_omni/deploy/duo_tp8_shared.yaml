# Duo shared-device deployment with Intent, Realization, Codec, and ASR stages.
# Edit model paths; session and FP8 environment setup: docs/serving/duo.md.
pipeline: duo_asr
async_chunk: false
trust_remote_code: true
distributed_executor_backend: mp
stages:
- stage_id: 0
  model: /target/models/Qwen3-ASR-1.7B
  devices: '0'
  gpu_memory_utilization: 0.1
  max_model_len: 2048
  max_num_seqs: 1
  enable_prefix_caching: false
  default_sampling_params:
    temperature: 0.0
    max_tokens: 256
  dtype: bfloat16
  max_num_batched_tokens: 256
  kv_cache_memory_bytes: 268435456
  enforce_eager: false
  hf_overrides:
    architectures:
    - DuoASRForConditionalGeneration
- stage_id: 1
  model: /target/models/MiniMax-Realization/FL2VA/text_encoder
  tokenizer: /target/models/intent_adapter
  devices: 0,1,2,3
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.47
  dtype: bfloat16
  max_model_len: 8192
  max_num_batched_tokens: 128
  max_num_seqs: 1
  enable_prefix_caching: false
  enforce_eager: false
  compilation_config:
    mode: 0
    cudagraph_mode: FULL
    cudagraph_capture_sizes:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 24
    - 32
    - 64
    - 96
    - 128
    max_cudagraph_capture_size: 128
  limit_mm_per_prompt:
    image: 0
    video: 1
  hf_overrides:
    architectures:
    - DuoIntentForConditionalGeneration
    text_config:
      vocab_size: 151681
    duo_forbidden_token_ids:
    - 151643
    - 151644
    - 151646
    - 151647
    - 151648
    - 151649
    - 151650
    - 151651
    - 151652
    - 151653
    - 151654
    - 151655
    - 151656
    - 151669
    - 151670
    - 151671
    - 151672
    - 151673
    - 151674
    - 151675
    - 151677
    - 151678
    - 151679
    intent_adapter_path: /target/models/intent_adapter
    duo_intent_tp: true
  default_sampling_params:
    temperature: 0.0
    max_tokens: 128
    detokenize: false
  async_scheduling: false
  kv_cache_memory_bytes: 1342177280
  disable_custom_all_reduce: true
- stage_id: 2
  model: /target/models/MiniMax-Realization/Ref2VA
  devices: 0,1,2,3,4,5,6,7
  dtype: bfloat16
  step_execution: true
  streaming_output: true
  diffusion_model_runner_cls: vllm_omni.diffusion.models.duo.model_runner.DuoModelRunner
  parallel_config:
    tensor_parallel_size: 8
    use_vllm_tp_group: true
    sequence_parallel_size: 1
    disable_custom_all_reduce: true
  model_config:
    duo:
      adapter_path: /target/models/realization_adapter.safetensors
      adapter_format: torchtitan_split_qkv
      rank: 128
      alpha: 128
      role_embedding: false
      compact_padding: true
      fused_denoise: true
      reuse_static_text: true
      merge_fixed_adapter: true
      reuse_time_conditioning: true
      kv_capacity: 131072
      num_blocks: 2304
      page_size: 32
      max_graphs: 16
      max_sessions: 1
      sampling_stage: dmd
      flow_shift: 5.0
      fp8_gemm: true
      fp8_cache_layout: workspace
      joint_execution: false
      joint_early_clean_ack: false
      prefix_capacity: 0
      use_cuda_graph: true
      kv_token_budget: 65536
      adapter_modules:
      - attn.to_q
      - attn.to_k
      - attn.to_v
      - attn.to_out.0
      - ff.net.0.proj
      - ff.net.2
      - proj_in
      - audio_proj_in
      - context_embedder
      - proj_out
      - audio_proj_out
      text_graph_buckets:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
  default_sampling_params:
    num_inference_steps: 4
    seed: 42
    extra_args:
      realization_early_codec_dispatch: true
  max_num_seqs: 1
- stage_id: 3
  model: /target/models/MiniMax-Realization/FL2VA
  devices: 4,5,6,7
  dtype: float32
  step_execution: false
  streaming_output: false
  diffusion_model_runner_cls: vllm_omni.diffusion.models.duo.model_runner.DuoModelRunner
  parallel_config:
    tensor_parallel_size: 4
    sequence_parallel_size: 1
  default_sampling_params:
    num_inference_steps: 1
  model_config:
    duo_codec:
      stack_tiling: true
      codec_mode: duo_5_17
      next_block_lookahead: false
session_mode: duplex
duplex_session:
  max_sessions: 1
  warmup_frames: -1
  max_pending_output_bytes_per_session: 8388608
