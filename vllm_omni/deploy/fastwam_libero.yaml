# Original FastWAM LIBERO checkpoint (yuanty/fastwam, libero_uncond_2cam224.pt)
# through the same FastWAMPipeline as CAE-FastWAM.
#
# NOT VALIDATED: this configuration loads and runs, but action parity and LIBERO
# success rate have not been checked in vLLM-Omni yet (the checkpoint's weights
# licence is unconfirmed). Use it with:
#   vllm serve yuanty/fastwam --omni --deploy-config vllm_omni/deploy/fastwam_libero.yaml

pipeline: fastwam
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: FastWAMPipeline
    model_config:
      fastwam_variant: fastwam_libero_uncond
      base_model: Wan-AI/Wan2.2-TI2V-5B-Diffusers
      # One stats file pooled over the four LIBERO suites; task_suite is unused.
      num_inference_steps: 10
      action_postprocess: libero
      warmup: true
      policy_server_config:
        image_resolution: [224, 224]
        n_external_cameras: 1
        needs_wrist_camera: true
        needs_stereo_camera: false
        needs_session_id: false
        action_space: eef_delta
        action_horizon: 32
        action_dim: 7
    default_sampling_params:
      seed: 42
