# RoboTwin checkpoint: one observation -> one full 50x14 action chunk.
pipeline: lingbot_vla_v2
async_chunk: false
distributed_executor_backend: mp
dtype: float32
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: LingBotVLAV2Pipeline
    model_config:
      policy_server_config:
        image_resolution: [256, 256]
        n_external_cameras: 1
        needs_wrist_camera: true
        needs_stereo_camera: false
        needs_session_id: false
        action_space: joint_position
        action_horizon: 50
        action_dim: 14
        max_action_dim: 55
        max_cameras: 3
