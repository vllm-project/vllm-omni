# MiniCPM-o 4.5 three-stage deploy with one GPU per stage.
# Thinker, Talker, and Code2Wav run on GPUs 0, 1, and 2.
base_config: minicpmo_4_5_2gpu.yaml

stages:
  - stage_id: 0
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
  - stage_id: 1
    gpu_memory_utilization: 0.9
  - stage_id: 2
    gpu_memory_utilization: 0.9
    devices: "2"
