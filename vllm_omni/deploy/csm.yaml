# Sesame CSM-1B deploy: talker -> code2wav over shared-memory chunks.
# Batch sizes, memory shares and chunk sizes are starting values and have not been tuned.
#
# Streamed and complete responses use the same path. The code2wav stage keeps
# each request's Mimi decoder state between chunks, so every frame is sent
# once and the pipeline has no non-chunked mode (keep async_chunk on).
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      # Mimi produces 12.5 frames per second, so 5 frames are 0.4 s of audio.
      # The first chunk goes out after one frame.
      codec_chunk_frames: 5
      initial_codec_chunk_frames: 1
      # Must stay 0: the decoder state replaces left context.
      codec_left_context_frames: 0

stages:
  - stage_id: 0
    max_num_seqs: 8
    gpu_memory_utilization: 0.3
    max_model_len: 2048
    # CUDA graphs for the backbone's decode steps and for the depth decoder's frame step.
    # The backbone has no piecewise graphs, so prompts run eagerly.
    enforce_eager: false
    compilation_config:
      cudagraph_mode: FULL_DECODE_ONLY
    # Every generated token is a first-codebook id whose frame is not in the
    # token stream, so a prefix hit could not restore the frames behind it.
    enable_prefix_caching: false
    async_scheduling: true
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    # First-codebook sampling; a request may override these.
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      # The checkpoint's default limit, at most 10 s: one token is one 80 ms frame, and a
      # request that ends on its own spends two more on the end frame and the stop token.
      max_tokens: 125
    # Sampling of codebooks 1-31 (depth decoder). Model-wide: requests cannot override it.
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    # Waiting requests keep their decoder state and their slot, so leave room
    # for every request stage 0 can run.
    max_num_seqs: 8
    gpu_memory_utilization: 0.1
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: true
    # A chunk is 32 tokens per frame.
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
