# SD3.5 Medium, one RTX 5060 Laptop 8 GB, layerwise text encoder and DiT offload.
async_chunk: false
dtype: bfloat16
enable_prefix_caching: false

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    gpu_memory_utilization: 0.9
    vae_use_tiling: true
    vae_use_slicing: true
    diffusion_offload_config:
      mode: layer
      components: [dit, text_encoder]
      pin_memory: true
    default_sampling_params:
      seed: 42
      num_inference_steps: 28
      guidance_scale: 4.5
