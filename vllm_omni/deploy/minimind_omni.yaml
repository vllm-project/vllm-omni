# MiniMind-Omni deploy for local offline parity/debug runs.
async_chunk: false

trust_remote_code: true
dtype: half
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.35
    enforce_eager: true
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 0.85
      max_tokens: 256
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.35
    enforce_eager: true
    devices: "0"
    default_sampling_params:
      temperature: 0.2
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    async_scheduling: false
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 32768
      seed: 42
