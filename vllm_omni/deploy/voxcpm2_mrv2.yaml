# MRV2 mixed/unified graphs with incremental per-patch VAE decoding.
base_config: voxcpm2.yaml
model_runner: v2
stages:
  - stage_id: 0
    engine_extras:
      hf_overrides:
        voxcpm2_runtime_config:
          # Override the base MRV1 chunk settings. Incremental VAE requires
          # CUDA, MRV2, per-patch decode, and model-owned unified graphs.
          vae_decode_every: 1
          audio_emit_every: 3
          enable_unified_decode_graph: true
          enable_incremental_vae: true
          # Unified graphs batch VAE internally; disable the legacy collection path.
          enable_batched_vae_decode: false
          # 0: unlimited cached mixed buckets; positive values cap their count.
          # New buckets fall back when capped; cached buckets still replay.
          # An unlimited count does not remove token/request bucket limits.
          # mixed_graph_cache_limit: 32
          # Run CFM/VAE only for eligible patch rows; skip both when none are ready.
          # Exact patch counts add graph variants, trading more cache memory
          # for less padding and intermediate-prefill computation.
          enable_exact_patch_batch: false
