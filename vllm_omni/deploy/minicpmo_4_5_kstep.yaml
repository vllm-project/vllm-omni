# Opt-in K-step multi-frame decode for MiniCPM-o 4.5 on CUDA.
#
# The default ``minicpmo_4_5.yaml`` keeps single-frame decode. K-step currently
# pays off at low concurrency (c1: ~+46% request throughput, -31% RTF) but loses
# 33-40% throughput at c16/c32, so it stays opt-in until the wide-batch path is
# competitive. Enable it explicitly:
#
#   vllm serve /path/to/MiniCPM-o-4_5 \
#     --deploy-config vllm_omni/deploy/minicpmo_4_5_kstep.yaml
#
# Stage 1 books the constant continue-draft K span (1 sampled + 7 drafted codec
# frames per step, mirroring the NPU block) and the two-wide continue/stop id.
# ``async_scheduling: false`` is required: the K-step scaffolding assumes the
# synchronous model-runner contract. Stage 2 merges the ragged K-step CFM shapes
# into one solve per step, otherwise every ragged bucket captures its own graph.
#
# Escape hatches while K-step is enabled (environment variables):
#   KSTEP_PLAIN_STEP=1     run plain single-frame steps (no K-span booking)
#   KSTEP_CUDA_GRAPH=0     disable the narrow-row CUDA graph replay
#   KSTEP_CUDA_NARROW=0    disable the narrow-row graph cache entirely
#   KSTEP_MAX_ROWS=<n>     cap the batch width that still runs the K-frame loop
#   KSTEP_WARMUP_SAMPLER=0 skip the sampler warmup at load
base_config: minicpmo_4_5.yaml

connectors:
  connector_of_shared_memory:
    extra:
      cfm_cross_bucket_merge: true

platforms:
  cuda:
    stages:
      - stage_id: 1
        # Multi-frame decode: 8 codec frames per step, mirroring the NPU block.
        # The CUDA runner intercepts the step and injects the constant continue
        # drafts; stop_token_ids is the two-wide continue/stop id.
        speculative_config:
          method: ngram
          num_speculative_tokens: 7
          prompt_lookup_min: 1
          prompt_lookup_max: 1
        async_scheduling: false
        default_sampling_params:
          stop_token_ids: [1]
