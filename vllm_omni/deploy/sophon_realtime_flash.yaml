# Sophon-Realtime-32B-Flash on one 80 GB GPU: thinker (FP8 checkpoint) ->
# Qwen3-TTS talker with streaming text input -> Qwen3-TTS code2wav.
#
# The talker builds its streaming prompt per request in `preprocess`.
pipeline: sophon_realtime
async_chunk: true
# One private MPS daemon for the three stages on the same GPU.
cuda_mps: true
# /v1/realtime full duplex (the model decides when the user has finished);
# /v1/chat/completions keeps working.
session_mode: duplex
duplex_session:
  max_sessions: 32
  idle_ttl_s: 300

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.002
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      initial_codec_chunk_frames: 2
      codec_chunk_ramp: [2, 4, 8, 12, 16, 25]
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0  # thinker
    max_num_seqs: 32
    gpu_memory_utilization: 0.55
    trust_remote_code: true
    enable_prefix_caching: true
    max_model_len: 8192
    mm_processor_cache_gb: 0
    devices: "0"
    limit_mm_per_prompt:
      audio: 20
      image: 2
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 400

  - stage_id: 1  # talker
    max_num_seqs: 32
    gpu_memory_utilization: 0.10
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 4096
    devices: "0"
    hf_overrides:
      # 3 role + 6 codec prefix + 1 first text token
      async_chunk_prewarm_prompt_len: 10
    silence_ban_frames: 6
    input_connectors:
      from_stage_0: connector_of_shared_memory
    output_connectors:
      to_stage_2: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.7
      top_k: 50
      max_tokens: 2000
      min_tokens: 2
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.7
      top_k: 50
      top_p: 1.0

  - stage_id: 2  # vocoder
    dtype: bfloat16
    max_num_seqs: 32
    gpu_memory_utilization: 0.05
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
