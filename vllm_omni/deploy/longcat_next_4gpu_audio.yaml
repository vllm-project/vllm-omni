# LongCat-Next deploy: thinker + audio decoder, colocated on 4x 80GB GPU.
#
# At TP=4 bf16, the thinker uses ~37 GB/GPU for weights. With 80 GB GPUs,
# ~43 GB remains for KV cache and activations — plenty of headroom to colocate
# the audio decoder (~3.1 GB) on GPU 3 alongside the thinker's shard without
# any offload or TP adjustments.
pipeline: longcat_next_thinker_audio
async_chunk: false

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 4
    devices: "0,1,2,3"
    trust_remote_code: true
    enforce_eager: true
    gpu_memory_utilization: 0.85
    max_num_batched_tokens: 8192
    max_model_len: 65536
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    model_stage: audio_decoder
    max_num_seqs: 1
    gpu_memory_utilization: 0.08
    enforce_eager: true
    max_num_batched_tokens: 8192
    devices: "3"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
