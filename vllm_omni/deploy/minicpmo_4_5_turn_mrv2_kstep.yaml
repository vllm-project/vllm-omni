# Opt-in MiniCPM-o 4.5 turn serving with CUDA MRv2 Talker K-step.
base_config: minicpmo_4_5.yaml

session_mode: turn
model_runner: v2

stages:
  - stage_id: 0
    async_chunk: false

platforms:
  cuda:
    cuda_mps: true
    stages:
      - stage_id: 1
        model_runner: v2
        attention_backend: FLASH_ATTN
        speculative_config:
          method: ngram
          num_speculative_tokens: 7
          prompt_lookup_min: 1
          prompt_lookup_max: 1
        async_scheduling: false
        default_sampling_params:
          stop_token_ids: [1]
  npu:
    model_runner: v1
  xpu:
    model_runner: v1
  rocm:
    model_runner: v1
  musa:
    model_runner: v1
