# Throughput overlay for Turbo, tested on H100: cuDNN's attention kernel for
# the BF16 flow and shared GPU execution (CUDA MPS).
# Requires CUDA, native cuDNN SDPA and nvidia-cuda-mps-control on PATH.
# See the recipe for measured limits.
base_config: chatterbox_turbo_high_concurrency.yaml
cuda_mps: true

stages:
  - stage_id: 1
    hf_overrides:
      flow_attention_backend: cudnn
