# Higgs-audio v3 deploy: Stage 0 (talker) -> Stage 1 (code2wav) via shared memory.
#
# Plain TTS plus voice cloning via ref_audio + ref_text (or references=[{...}]).
# Streaming is wired through the stage-input processor's
# ``talker2code2wav_async_chunk`` callback plus the shared-memory
# connector's ``codec_streaming`` flag. To run a strictly non-streaming
# smoke test, set ``async_chunk: false`` and ``codec_streaming: false``.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 5000
      connector_get_max_wait: 500
      # 25 frames at 25 fps is ~1 s of audio per chunk. 25 left-context
      # frames keep the codec decoder's sliding-window history populated
      # across chunk boundaries. ``initial_codec_chunk_frames: 1`` emits
      # the first chunk as soon as Stage 0 has produced enough rows to
      # de-delay one frame (Q=8 talker steps), so TTFA approaches one
      # AR-loop's-worth of work rather than the whole utterance.
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      initial_codec_chunk_frames: 1

stages:
  - stage_id: 0
    max_num_seqs: 16
    gpu_memory_utilization: 0.6
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 4096
    max_model_len: 8192
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 1.0
      top_p: 0.95
      top_k: 50
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.25
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
