# Cosmos3-Nano-Sim-Bimanual distilled forward-dynamics deployment.

pipeline: cosmos3_nano_sim_bimanual
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Cosmos3NanoSimBimanualPipeline
    model_config:
      action_gen: true
      action_dim: 64
      num_embodiment_domains: 32
      default_fps: 15.0
      default_resolution: [720, 1280]
      max_pixels: 921600
      clean_commit_mode: batched  # framewise | batched
      # Fresh full-video requests only; Wan decode starts before clean refresh.
      overlap_vae_decode: true
