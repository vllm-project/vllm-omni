# HunyuanImage-3.0-Instruct single-host 1P1D deploy (merged template):
# AR-Prefill (stage 0) -> AR-Decode (stage 1) -> DiT (stage 2).
# P -> D KV: MooncakeStoreConnector (mooncake store, host 127.0.0.1).
# D -> DiT KV: SharedMemoryConnector (data plane).
#
# To run every KV hop over SharedMemoryConnector (no Mooncake master/
# metadata service required), set the P/D stage omni_kv_config
# connector_config blocks below to type: SharedMemoryConnector.
pipeline: hunyuan_image3_pd
async_chunk: false
trust_remote_code: true
enable_prefix_caching: false
enable_chunked_prefill: true

connectors:
  rdma_connector:
    name: MooncakeTransferEngineConnector
    extra:
      host: "auto"
      zmq_port: 50051
      protocol: "rdma"
      device_name: ""
      memory_pool_size: 4294967296
      memory_pool_device: "cpu"
  shared_memory_connector:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    async_scheduling: false
    devices: "0,1"
    env:
      VLLM_HOST_IP: "127.0.0.1"
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "25201"
    tensor_parallel_size: 2
    max_num_seqs: 1
    gpu_memory_utilization: 0.95
    enforce_eager: true
    max_num_batched_tokens: 32768
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    omni_kv_config:
      need_send_cache: true
      omni_to_stage: 1
      connector_config:
        type: MooncakeStoreConnector
        host: "127.0.0.1"
        metadata: "http://127.0.0.1:8080/metadata"
        master: "127.0.0.1:8756"
        proto: "tcp"
        rdma: ""
    # P derives logical sampling defaults and request overrides from D.
    # The scheduler stops P after one accepted sample.

  - stage_id: 1
    devices: "2,3"
    env:
      VLLM_HOST_IP: "127.0.0.1"
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "25202"
    tensor_parallel_size: 2
    max_num_seqs: 1
    gpu_memory_utilization: 0.95
    enforce_eager: true
    max_num_batched_tokens: 32768
    hf_overrides:
      rope_parameters:
        mrope_section: [0, 32, 32]
        rope_type: default
    omni_kv_config:
      need_send_cache: true
      need_recv_cache: true
      recv_timeout: 120
      connector_config:
        type: MooncakeStoreConnector
        host: "127.0.0.1"
        metadata: "http://127.0.0.1:8080/metadata"
        master: "127.0.0.1:8756"
        proto: "tcp"
        rdma: ""
      send_connector_config:
        type: SharedMemoryConnector
    output_connectors:
      to_stage_2: shared_memory_connector
    default_sampling_params:
      temperature: 0.0
      seed: 42
      top_p: 1
      top_k: -1
      max_tokens: 8192
      extra_args:
        pd_resume_from_prefill: true
      detokenize: true
      skip_special_tokens: false
      include_stop_str_in_output: true

  - stage_id: 2
    devices: "4,5"
    distributed_executor_backend: "mp"
    enforce_eager: true
    max_num_seqs: 1
    omni_kv_config:
      need_recv_cache: true
      enable_kv_async_prefetch: true
      kv_prefetch_min_free_mem_ratio: 0.2
      recv_timeout: 120
      connector_config:
        type: SharedMemoryConnector
    parallel_config:
      tensor_parallel_size: 2
      enable_expert_parallel: true
    input_connectors:
      from_stage_1: shared_memory_connector
    default_sampling_params:
      num_inference_steps: 50
      guidance_scale: 0

edges:
  - from: 0
    to: 1
    window_size: -1
    max_inflight: 1
  - from: 1
    to: 2
    window_size: -1
    max_inflight: 1

platforms:
  npu:
    stages:
      - stage_id: 0
        devices: "0,1,2,3"
        tensor_parallel_size: 4
        gpu_memory_utilization: 0.8
        max_num_batched_tokens: 8192

      - stage_id: 1
        devices: "4,5,6,7"
        tensor_parallel_size: 4
        gpu_memory_utilization: 0.8
        max_num_batched_tokens: 8192

      - stage_id: 2
        devices: "8,9,10,11"
        gpu_memory_utilization: 0.65
        max_num_batched_tokens: 8192
        parallel_config:
          tensor_parallel_size: 4
          enable_expert_parallel: false
          sequence_parallel_size: 1
          ulysses_degree: 1
