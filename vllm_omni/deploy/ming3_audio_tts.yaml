# Converted Ming3 Audio: direct text-to-speech with IP or reference-audio controls.
pipeline: ming3_audio_tts
async_chunk: false
trust_remote_code: false
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.4
    enforce_eager: true
    max_num_batched_tokens: 2304
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
