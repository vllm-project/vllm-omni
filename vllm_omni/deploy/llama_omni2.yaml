# LLaMA-Omni 2 default deployment.
# The model checkpoints are intended for academic, non-commercial use.
async_chunk: true
trust_remote_code: false
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    gpu_memory_utilization: 0.8
    mm_processor_cache_gb: 0
    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    devices: "1"
    max_num_seqs: 1
    gpu_memory_utilization: 0.65
    async_scheduling: false
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 1.0
      top_p: 1.0
      max_tokens: 4096

  - stage_id: 2
    model: ICTNLP/cosy2_decoder
    devices: "1"
    dtype: float32
    enforce_eager: true
    max_num_seqs: 8
    gpu_memory_utilization: 0.25
    async_scheduling: false
    enable_chunked_prefill: false
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
