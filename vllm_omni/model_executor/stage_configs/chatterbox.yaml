async_chunk: true
# Chatterbox Original is a PREVIEW (AR-stage CFG not yet implemented), so this
# config is deliberately more conservative than chatterbox_turbo.yaml:
# single-request batches, fully eager, synchronous scheduling, and lower GPU
# memory headroom. Revisit these once CFG lands and Original is production-ready.
stage_args:
  - stage_id: 0
    stage_type: llm
    is_comprehension: true
    runtime:
      devices: "0"
      # Preview: validated single-request only; batching untested with CFG follow-up pending.
      max_batch_size: 1
    engine_args:
      model_stage: t3
      model_arch: ChatterboxT3ForGeneration
      # ResembleAI/chatterbox ships English weights (t3_cfg.safetensors) alongside
      # multilingual variants (t3_23lang.safetensors with text_vocab=2352,
      # t3_mtl23ls_v2.safetensors with text_vocab=2454). vLLM's default loader
      # globs *.safetensors and loads every file — leaving text_emb overwritten
      # with the wrong-shape multilingual weight. Filter them out here.
      ignore_patterns:
        - "original/**/*"
        - "t3_23lang.safetensors"
        - "t3_mtl23ls_v2.safetensors"
      hf_overrides:
        architectures: [ChatterboxT3ForGeneration]
      # Original ships a raw tokenizer.json with no tokenizer_config.json,
      # so HF AutoTokenizer cannot resolve a tokenizer class from
      # ChatterboxConfig. The model loads its own EnTokenizer via
      # _get_tokenizer(), so vLLM's tokenizer path is unused. Skip init.
      skip_tokenizer_init: true
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      # Preview conservatism (vs Turbo's cudagraphs + async_scheduling):
      # eager + synchronous scheduling keep the LLaMA-backbone T3 path simple
      # to debug while CFG support is still pending.
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: false
      enable_prefix_caching: false
      engine_output_type: latent
      # 0.35/0.25 splits leave headroom for the chatterbox-tts helper models
      # (voice encoder, s3 tokenizer) that Original loads alongside both stages.
      gpu_memory_utilization: 0.35
      distributed_executor_backend: "mp"
      # Single-request prompts are short (~150-token speech cond + text); 512
      # is ample and keeps activation memory low next to the 0.35 GPU split.
      max_num_batched_tokens: 512
      max_model_len: 8196
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.chatterbox.t3_to_s3gen_async_chunk
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_k: 1000
      top_p: 0.95
      max_tokens: 4096
      seed: 42
      detokenize: false
      repetition_penalty: 1.2
      stop_token_ids: [6562]

  - stage_id: 1
    stage_type: llm
    runtime:
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: s3gen
      model_arch: ChatterboxS3Gen
      # ChatterboxS3Gen is shared between Turbo and Original variants; the
      # arch→model_type fallback defaults to chatterbox_turbo, which forces
      # meanflow S3Gen + s3gen_meanflow.safetensors. For Original we must
      # pin model_type=chatterbox so the config says s3gen_meanflow=False
      # and the loader picks up s3gen.safetensors.
      hf_overrides:
        architectures: [ChatterboxS3Gen]
        model_type: chatterbox
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      # S3Gen forward calls .item() for ctx_frames, which breaks CUDA graph
      # capture (stream-capture-unsupported) — same constraint as Turbo.
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: false
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.25
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 8192
      max_model_len: 8196
    engine_input_source: [0]
    final_output: true
    final_output_type: audio
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    connector_of_shared_memory:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536
        codec_streaming: true
        connector_get_sleep_s: 0.01
        connector_get_max_wait_first_chunk: 3000
        connector_get_max_wait: 300
        # 25 tokens/sec → 1 second chunks with 1 second overlap.
        codec_chunk_frames: 25
        codec_left_context_frames: 25

  edges:
    - from: 0
      to: 1
      window_size: -1
