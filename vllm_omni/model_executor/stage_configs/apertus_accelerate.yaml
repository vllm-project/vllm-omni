# Stage config for Apertus when launched with accelerate/torchrun
# (one lmms-eval process per GPU).
#
# For accelerate launch, each process is already one data-parallel replica.
# Keep vLLM internal data_parallel_size=1 and mp backend (no nested launcher).

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true
      # Select device from launcher local rank.
      devices: "${oc.env:LOCAL_RANK,0}"
      max_batch_size: 64
    engine_args:
      model_stage: generation
      model_arch: ApertusForCausalLM
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.6
      enforce_eager: false
      trust_remote_code: false
      engine_output_type: text
      enable_prefix_caching: true
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      distributed_executor_backend: "mp"
      data_parallel_backend: "mp"
      data_parallel_size: 1
      async_scheduling: false
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.0
