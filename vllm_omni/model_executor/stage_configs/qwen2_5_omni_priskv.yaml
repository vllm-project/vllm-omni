# Qwen2.5-Omni with PrisKV connector — single A100-80GB config
# All 3 stages on GPU 0, minimized memory footprint.

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: thinker
      model_arch: Qwen2_5OmniForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.50
      max_model_len: 4096
      max_num_batched_tokens: 4096
      max_num_seqs: 1
      skip_mm_profiling: true
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: latent
      enable_prefix_caching: false
      mm_processor_cache_gb: 0
    is_comprehension: true
    final_output: true
    final_output_type: text
    output_connectors:
      to_stage_1: priskv_connector
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 128
      seed: 42
      detokenize: True
      repetition_penalty: 1.1

  - stage_id: 1
    stage_type: llm
    runtime:
      process: true
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: talker
      model_arch: Qwen2_5OmniForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.30
      max_model_len: 4096
      max_num_batched_tokens: 4096
      max_num_seqs: 1
      skip_mm_profiling: true
      enforce_eager: true
      trust_remote_code: true
      enable_prefix_caching: false
      engine_output_type: latent
    engine_input_source: [0]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.qwen2_5_omni.thinker2talker
    input_connectors:
      from_stage_0: priskv_connector
    output_connectors:
      to_stage_2: priskv_connector
    default_sampling_params:
      temperature: 0.9
      top_p: 0.8
      top_k: 40
      max_tokens: 128
      seed: 42
      detokenize: True
      repetition_penalty: 1.05
      stop_token_ids: [8294]

  - stage_id: 2
    stage_type: llm
    runtime:
      process: true
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: code2wav
      model_arch: Qwen2_5OmniForConditionalGeneration
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      gpu_memory_utilization: 0.10
      max_model_len: 4096
      max_num_batched_tokens: 4096
      enforce_eager: true
      trust_remote_code: true
      enable_prefix_caching: false
      engine_output_type: audio
    engine_input_source: [1]
    input_connectors:
      from_stage_1: priskv_connector
    final_output: true
    final_output_type: audio
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 128
      seed: 42
      detokenize: True
      repetition_penalty: 1.1

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    priskv_connector:
      name: PrisKVConnector
      extra:
        host: "127.0.0.1"
        port: 6379
        password: "kvcache-redis"
        get_retries: 20
        get_retry_interval: 0.05

  edges:
    - from: 0
      to: 1
      window_size: -1
    - from: 1
      to: 2
      window_size: -1
