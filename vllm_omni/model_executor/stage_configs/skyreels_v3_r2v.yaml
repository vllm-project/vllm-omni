stage_args:
  - stage_id: 0
    stage_type: diffusion
    runtime:
      devices: "0"
      max_batch_size: 1
    engine_args:
      model_stage: dit
      model_class_name: SkyReelsV3R2VPipeline
      gpu_memory_utilization: 0.85
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: video
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      # SkyReels-V3 specific settings
      flow_shift: 5.0  # Flow matching shift parameter
      attention_backend: "sdpa"  # Use SDPA for attention
    final_output: true
    final_output_type: video
    is_comprehension: false
    default_sampling_params:
      height: 480
      width: 832
      num_frames: 81
      num_inference_steps: 50
      guidance_scale: 7.5
      seed: 42
      num_outputs_per_prompt: 1

# Runtime configuration
runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  # Distributed connectors configuration
  connectors:
    shared_memory_connector:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536  # 64KB threshold

  edges: []  # Single stage, no edges needed
