# BAGEL with PrisKV for stage-0 -> stage-1 (thinker KV -> DiT).
# Copy of bagel.yaml with explicit PrisKV on the 0->1 edge. Requires a running
# priskv-server (default 127.0.0.1:6379) and pypriskv installed in the Python env.

stage_args:
  - stage_id: 0
    stage_type: llm
    prompt_expand_func: vllm_omni.model_executor.stage_input_processors.bagel.expand_cfg_prompts
    runtime:
      devices: "0"
    engine_args:
      model_stage: thinker
      max_num_seqs: 3
      model_arch: OmniBagelForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.45
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: text
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      omni_kv_config:
        need_send_cache: true
        kv_transfer_criteria:
          type: prefill_finished
    final_output: true
    final_output_type: text
    is_comprehension: true
    output_connectors:
      to_stage_1: priskv_connector
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 52
      detokenize: True
      repetition_penalty: 1.05

  - stage_id: 1
    stage_type: diffusion
    cfg_kv_collect_func: vllm_omni.model_executor.stage_input_processors.bagel.collect_cfg_kv_caches
    runtime:
      devices: "0"
    engine_args:
      model_stage: dit
      max_num_seqs: 1
      gpu_memory_utilization: 0.45
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: image
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      max_num_batched_tokens: 32768
      tensor_parallel_size: 1
      omni_kv_config:
        need_recv_cache: true
    engine_input_source: [0]
    input_connectors:
      from_stage_0: priskv_connector

    final_output: true
    final_output_type: image
    is_comprehension: false
    default_sampling_params:
      seed: 52

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    priskv_connector:
      name: PrisKVConnector
      extra:
        host: "127.0.0.1"
        port: 6379
        password: "kvcache-redis"
        get_retries: 20
        get_retry_interval: 0.05

  edges:
    - from: 0
      to: 1
      window_size: -1
