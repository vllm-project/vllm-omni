model_type: text_tts
async_chunk: true
stages:
  - stage_id: 0
    stage_type: llm
    is_comprehension: true
    input_sources: []
    worker_type: ar
    scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
    engine_args:
      engine_output_type: text
      enforce_eager: false
      trust_remote_code: false
      enable_prefix_caching: true
      distributed_executor_backend: "mp"
      # Bridge hook: buffers decoded text into sentence chunks and
      # forwards them to the TTS stage via async_chunk.
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.text_tts_bridge.text2tts
    output_connectors:
      to_stage_1: connector_of_shared_memory
    final_output: false
    default_sampling_params:
      detokenize: true

  - stage_id: 1
    stage_type: llm
    input_sources: [0]
    worker_type: ar
    scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
    final_output: true
    final_output_type: audio
    engine_args:
      engine_output_type: audio
      enforce_eager: true
      trust_remote_code: true
      distributed_executor_backend: "mp"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      detokenize: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # Bridge config: SentenceChunker tuning (RFC Q2 latency knob)
      min_sentence_chars: 40
      sentence_delimiters: [".", "!", "?", "\u3002", "\uff01", "\uff1f"]
      tts_task_type: CustomVoice
      # Default voice/language when Stage 0 has no speaker concept (RFC Q3)
      default_voice: vivian
      default_language: English

edges:
  - from: 0
    to: 1
    window_size: -1
