# CI deployment for four 64GB Ascend A2 NPUs; full 480x832 and default KV window.
# The all-resident deployment OOMs at the first warmup on the target runner.
# Both reference and candidate use this exact component placement and topology.
pipeline: lingbot_world
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    max_num_seqs: 1
    enforce_eager: true
    # Read one safetensors shard at a time on the shared checkpoint filesystem.
    # Four ranks otherwise eagerly load four whole shards each concurrently.
    enable_multithread_weight_load: false
    # 64GB A2 exposes ~60.96GiB: keep the DiT resident and release the text
    # encoder before denoising to leave activation space after KV allocation.
    diffusion_offload_config:
      mode: module
      components: [text_encoder]
      pin_memory: false
    model_class_name: LingBotWorldCausalDMDPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    parallel_config:
      tensor_parallel_size: 1
      sequence_parallel_size: 4
      ulysses_degree: 4
      ring_degree: 1
    default_sampling_params:
      num_inference_steps: 4
      output_type: pil
      extra_args:
        flow_shift: 5.0
    model_config:
      ar_diffusion_height: 480
      ar_diffusion_width: 832
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.1
        warmup_cudagraph: false
