<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L5 GPU memory monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #1a1a2e; color: #eee; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .meta { color: #888; font-size: 0.9rem; margin-bottom: 1rem; }
    .cards { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: #16213e; padding: 1rem 1.25rem; border-radius: 8px; min-width: 140px; }
    .card .label { color: #888; font-size: 0.8rem; }
    .card .value { font-size: 1.5rem; font-weight: 600; }
    .card .value.high { color: #e94560; }
    .card .value.mid { color: #0f3460; }
    canvas { max-height: 320px; }
    .no-data { color: #666; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <h1>L5 GPU memory monitor</h1>
  <p class="meta">Last updated: <span id="lastUpdated">-</span> &nbsp; Run: <span id="runId">-</span></p>
  <div class="cards" id="cards"></div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>
  <p class="no-data" id="noData">No data yet. Start gpu_monitor.sh start and wait a few seconds.</p>

  <script>
    const API = "/api/latest";
    const INTERVAL_MS = 5000;

    let chart = null;
    const colors = ["#e94560", "#0f3460", "#533483", "#16c79a"];

    function fetchLatest() {
      fetch(API)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          document.getElementById("noData").style.display = data ? "none" : "block";
          if (!data) return;
          document.getElementById("lastUpdated").textContent = data.last_updated || "-";
          document.getElementById("runId").textContent = data.run_id || "-";

          const cards = document.getElementById("cards");
          if (data.current && data.current.length) {
            cards.innerHTML = data.current.map((g, i) => `
              <div class="card">
                <div class="label">GPU ${g.gpu_index}</div>
                <div class="value ${g.memory_util_pct >= 90 ? "high" : "mid"}">${g.memory_util_pct}%</div>
                <div class="label">${g.memory_used_mb} / ${g.memory_total_mb} MiB</div>
              </div>
            `).join("");
          }

          const history = data.history || [];
          if (history.length) {
            const labels = history.map(h => new Date(h.t * 1000).toLocaleTimeString("en", { hour12: false }));
            const gpuIndices = data.current ? data.current.map(g => g.gpu_index) : [0];
            const datasets = gpuIndices.map((idx, i) => ({
              label: `GPU ${idx}`,
              data: history.map(h => {
                const g = (h.gpus || []).find(g => g.gpu_index === idx);
                return g ? g.memory_util_pct : null;
              }),
              borderColor: colors[i % colors.length],
              backgroundColor: colors[i % colors.length] + "20",
              fill: true,
              tension: 0.2
            }));
            if (!chart) {
              chart = new Chart(document.getElementById("chart"), {
                type: "line",
                data: { labels, datasets },
                options: {
                  responsive: true,
                  maintainAspectRatio: true,
                  scales: {
                    y: { min: 0, max: 100, title: { display: true, text: "Memory util %" } },
                    x: { title: { display: true, text: "Time" } }
                  }
                }
              });
            } else {
              chart.data.labels = labels;
              chart.data.datasets = datasets;
              chart.update("none");
            }
          }
        })
        .catch(() => {});
    }

    fetchLatest();
    setInterval(fetchLatest, INTERVAL_MS);
  </script>
</body>
</html>
