# Test-only full-payload profile. Requires three CUDA GPUs and #8327's
# Code2Wav dtype fix when VLLM_BATCH_INVARIANT=1.
async_chunk: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector

stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    max_model_len: 4096
    max_num_batched_tokens: 1024
    max_num_seqs: 2
    gpu_memory_utilization: 0.8
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    moe_backend: triton
    default_sampling_params:
      temperature: 0.0
      max_tokens: 512
  - stage_id: 1
    devices: "2"
    tensor_parallel_size: 1
    max_model_len: 4096
    max_num_batched_tokens: 1024
    max_num_seqs: 2
    gpu_memory_utilization: 0.45
    enforce_eager: false
    async_scheduling: false
    enable_prefix_caching: true
    attention_backend: TRITON_ATTN
    moe_backend: triton
    worker_cls: tests.model_executor.models.qwen3_omni.qualification_worker.TalkerQualificationGPUARWorker
    compilation_config:
      mode: 0
      cudagraph_mode: FULL
      cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64, 128]
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      seed: 42
      temperature: 0.9
      top_k: 50
      repetition_penalty: 1.05
      max_tokens: 2048
  - stage_id: 2
    devices: "2"
    max_num_batched_tokens: 65536
    max_num_seqs: 2
    gpu_memory_utilization: 0.15
    enforce_eager: true
    async_scheduling: false
    enable_prefix_caching: false
    enable_chunked_prefill: false
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
