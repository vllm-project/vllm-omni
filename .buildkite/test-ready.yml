                volumes:
                  - name: devshm
                    emptyDir:
                      medium: Memory
                  - name: hf-cache
                    hostPath:
                      path: /mnt/hf-cache
                      type: DirectoryOrCreate

      - label: "Omni · Qwen3-Omni Realtime WebSocket"
        source_file_dependencies:
          - tests/entrypoints/openai_api/test_qwen3_omni_realtime_websocket.py
          - tests/entrypoints/
          - vllm_omni/entrypoints/
          - vllm_omni/model_executor/models/qwen3_omni/
          - vllm_omni/deploy/qwen3_omni_moe.yaml
        commands:
          - |
            timeout 30m bash -c "
              export VLLM_WORKER_MULTIPROC_METHOD=spawn
              pytest -s -v tests/entrypoints/openai_api/test_qwen3_omni_realtime_websocket.py::TestQwen3OmniRealtimeWebSocket::test_streaming_audio_input_pcm_output_async_chunk_smoke -m 'core_model' --run-level 'core_model'
            "
        agents:
          queue: "mithril-h100-pool"
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - image: 936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
                    resources:
                      limits:
                        nvidia.com/gpu: 2
                    volumeMounts:
                      - name: devshm
                        mountPath: /dev/shm
