steps:
  - group: ":card_index_dividers: Simple Test"
    depends_on: upload-ready-pipeline
    steps:
      - label: "Platforms Test"
        key: ready-platforms-test
        mirror_hardwares: a3_npu_2
        commands:
          - >-
            pytest -s -v
            tests/platforms/npu/test_minicpmo_code2wav_npugraph.py
            tests/platforms/npu/test_minicpmo_cross_reference_npugraph.py
            tests/platforms/npu/test_contiguous_kv_cache.py
            tests/platforms/npu/test_npu_device_copy.py
            tests/platforms/npu/test_mm_request_rng.py
            -m 'core_model and npu and A3 and omni'
            --run-level 'core_model'
          - >-
            pytest -s -v
            tests/platforms/npu/test_qwen3_omni_model_state.py
            tests/platforms/npu/test_npu_generation_v2.py
            tests/platforms/npu/test_code2wav_graph_wrapper.py
            -m 'core_model and cpu'
            --run-level 'core_model'
          - >-
            pytest -s -v
            tests/model_executor/models/moss_tts/test_audio_tokenizer_v2_npu.py
            -m 'core_model and npu and A3'
            --run-level 'core_model'

      - label: "NPU IPC Weight Sharing - A2"
        key: ready-npu-ipc-weight-sharing
        mirror_hardwares: a2b3_npu_1
        timeout_in_minutes: 15
        source_file_dependencies:
          - "vllm_omni/distributed/weight_sharing/"
          - "tests/distributed/weight_sharing/"
          - "tests/helpers/mark.py"
          - ".buildkite/npu/test-npu-ready.yml"
        env:
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:False"
        commands:
          - >-
            pytest -s -v
            tests/distributed/weight_sharing/test_npu_ipc.py
            -m 'core_model and npu and A2 and cards_1'
            --run-level 'core_model'

      - label: "Diffusion NPU layer tests - A2"
        key: ready-diffusion-npu-layer-tests-a2
        mirror_hardwares: a2b3_npu_1
        commands:
          - >-
            pytest -s -v
            tests/diffusion/layers/test_activation.py
            -m 'core_model and npu and A2'
            --run-level 'core_model'

      - label: "Diffusion NPU layer tests - A3"
        key: ready-diffusion-npu-layer-tests
        mirror_hardwares: a3_npu_2
        commands:
          - >-
            pytest -s -v
            tests/diffusion/layers/test_activation.py
            tests/diffusion/layers/test_fused_qk_norm_rope_npu.py
            tests/diffusion/models/minimax_h3/test_minimax_h3_qwen3vl_swiglu.py
            tests/diffusion/models/minimax_h3/test_minimax_h3_modulation.py
            -m 'core_model and npu and A3'
            --run-level 'core_model'

      - label: "Diffusion NPU layer tests - 310P"
        key: ready-diffusion-npu-layer-tests-310p
        mirror_hardwares: 310p_npu_1
        commands:
          - >-
            pytest -s -v
            tests/diffusion/layers/test_activation.py
            -m 'core_model and npu and 310P'
            --run-level 'core_model'

      - label: "Platforms Test - 310P"
        key: ready-platforms-test-310p
        mirror_hardwares: 310p_npu_1
        commands:
          - >-
            pytest -s -v
            tests/platforms/npu/test_310p_real_device.py
            -m 'core_model and npu and 310P and omni'
            --run-level 'core_model'

  - group: ":card_index_dividers: E2E Test"
    key: ready-e2e-group
    depends_on: upload-ready-pipeline
    steps:
      - label: "Omni · MiniCPM-o 4.5 Test"
        mirror_hardwares: a3_npu_2
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
          - pytest -s -v tests/e2e/offline_inference/test_minicpmo_4_5.py tests/e2e/online_serving/test_minicpmo_4_5.py -m 'core_model and npu and A3 and omni' --run-level 'core_model'

      - label: "Omni · MiniCPM-o 4.5 Duplex Test"
        mirror_hardwares: a3_npu_2
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
          - pytest -s -v tests/e2e/online_serving/test_minicpmo_4_5_duplex.py -m 'core_model and npu and A3 and omni' --run-level 'core_model'

      - label: "Omni · MiniCPM-o 4.5 Perf Test"
        timeout_in_minutes: 60
        mirror_hardwares: a3_npu_2
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
          - export BENCHMARK_DIR=tests/dfx/perf/results
          - pytest -s -v tests/dfx/perf/scripts/run_benchmark.py --test-config-file tests/dfx/perf/tests/test_minicpmo_4_5_ready.json -m 'core_model and npu and A3 and omni'

      - label: "Omni · Qwen3-Omni Test"
        mirror_hardwares: a3_npu_4
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni.py -m 'core_model and npu and A3 and omni' --run-level 'core_model'
        timeout_in_minutes: 60

      - label: ":sound: TTS · MOSS-TTS Local MRV2 Test (A3)"
        key: ready-tts-moss-local-mrv2-npu
        source_file_dependencies: tts_moss_tts_local_npu_mrv2_function
        mirror_hardwares: a3_npu_2
        timeout_in_minutes: 60
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
        commands:
          # The A3 dummy-weight probe returned a header-only WAV (44 bytes).
          # Keep real weights for payload checks; Whisper runs in Nightly.
          - >-
            pytest -s -v
            tests/platforms/npu/test_moss_tts_local_model_state.py
            tests/e2e/online_serving/test_moss_tts_local_npu_mrv2.py
            -m 'core_model and npu and A3'
            --run-level 'advanced_model'

      - label: ":sound: TTS · Qwen3-TTS CustomVoice Test"
        mirror_hardwares: a3_npu_2
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
          HF_TOKEN: "${HF_TOKEN}"
        commands:
          - pytest -s -v tests/e2e/online_serving/test_qwen3_tts_customvoice.py -m 'core_model and npu' --run-level 'core_model'

      - label: "Diffusion · HunyuanVideo-1.5 Test"
        mirror_hardwares: a3_npu_2
        env:
            VLLM_WORKER_MULTIPROC_METHOD: spawn
            VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
            - |
              timeout 40m bash -c "
                export VLLM_IMAGE_FETCH_TIMEOUT=60
                pytest -s -v tests/e2e/online_serving/test_hunyuan_video_15_expansion.py -m 'core_model and diffusion and npu' --run-level 'core_model'
                "
        timeout_in_minutes: 60

      - label: "Diffusion · Wan22 Test"
        mirror_hardwares: a3_npu_2
        env:
            VLLM_WORKER_MULTIPROC_METHOD: spawn
            VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
            - |
                timeout 40m bash -c "
                export VLLM_IMAGE_FETCH_TIMEOUT=60
                pytest -s -v tests/e2e/online_serving/test_wan22_t2v.py -m 'core_model and npu' --run-level 'core_model'
                "
        timeout_in_minutes: 60

      - label: "Diffusion · Hunyuan Image Test"
        mirror_hardwares: a3_npu_4
        env:
            VLLM_WORKER_MULTIPROC_METHOD: spawn
            VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        commands:
            - |
                timeout 40m bash -c "
                export VLLM_IMAGE_FETCH_TIMEOUT=60
                pytest -s -v tests/e2e/online_serving/test_hunyuan_image.py -m 'core_model and diffusion and npu' --run-level 'core_model'
                "
        timeout_in_minutes: 60

      - label: "Diffusion · MiniMax-H3 DLO DP2 T2VA Test"
        key: ready-diffusion-minimax-h3
        source_file_dependencies: diffusion_minimax_h3_function
        timeout_in_minutes: 90
        mirror_hardwares: a3_npu_2
        env:
          VLLM_WORKER_MULTIPROC_METHOD: spawn
          HF_HUB_OFFLINE: "1"
          DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
        commands:
          - |
            [ -d "$${VLLM_TEST_MINIMAX_H3_MODEL:-}/FL2VA" ] && export VLLM_TEST_MINIMAX_H3_MODEL="$$VLLM_TEST_MINIMAX_H3_MODEL/FL2VA" || true
            pytest -s -v tests/e2e/online_serving/test_minimax_h3_dlo_dp2_t2va.py -m "core_model and npu and A3 and diffusion and cards_2" --run-level core_model
