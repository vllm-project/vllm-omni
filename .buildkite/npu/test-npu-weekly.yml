steps:

  - group: ":card_index_dividers: World Model Test"
    depends_on: upload-weekly-pipeline
    if: (build.pull_request.id == null || build.pull_request.labels includes "npu-test") && (build.env("WEEKLY") == "1" || build.pull_request.labels includes "weekly-test")
    steps:
      - label: "LingBot World · NPU long-session stability"
        key: lingbot-npu-weekly-stability
        concurrency: 1
        concurrency_group: vllm-omni/lingbot-world/npu-generation
        concurrency_method: eager
        priority: 0
        source_file_dependencies: lingbot_world_regression
        timeout_in_minutes: 1440
        mirror_hardwares: a2b3_npu_8
        artifact_paths:
          - "lingbot-artifacts/npu-long/**/*"
        commands:
          - bash tests/dfx/lingbot_world/run_ci.sh stability tests/dfx/lingbot_world/configs/npu_long.json lingbot-artifacts/npu-long
