# CUDA CI L3 (`advanced_model` e2e).
# Uploaded by Upload Merge Pipeline: PR label `merge-test`, or post-merge on main
# (both diff-aware via source_file_dependencies).
# L1 CPU Simple Test stays in test-ready.yml.
#
# Directory sweeps set `automatic_shard: true`. The uploader reads a per-step
# profile from the last 20 passed main builds' raw `timings/jobs` artifacts
# (or VLLM_OMNI_SHARD_TIMINGS). It uses that as a greedy estimate of how many
# jobs fit 80% of `timeout_in_minutes` (the rest is checkout, collection, and
# startup), then writes each bin as a file list. A shard
# runs only that list. No usable timings opens the smaller of MAX_AUTOMATIC_SHARDS
# and the files whose marks satisfy the command's -m. A static miss is dealt
# across those shards and does not open another one. No confirmed match stays
# one job, so a shard cannot collect zero tests.
# Enrolled steps always write `timings/jobs/*.json`. E2E model jobs stay one
# job: each case loads a server, and splitting them repeats that startup.

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: ":card_index_dividers: Diffusion Test"
    depends_on: upload-merge-pipeline
    steps:
      - label: "Diffusion · AR Paged Attention GPU Test"
        timeout_in_minutes: 20
        commands:
          - export VLLM_OMNI_AR_FA_REQUIRED=1
          - pytest -sv tests/diffusion/ar_diffusion/test_paged_attention.py -m 'core_model and cuda and L4 and cards_1' --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · LoRA Test"
        timeout_in_minutes: 25
        automatic_shard: true
        commands:
          - pytest -sv tests/diffusion/lora/ -m 'advanced_model and cuda' --run-level "advanced_model"
        mirror_hardwares: l4_1

  - label: "Distributed Test"
    depends_on: upload-merge-pipeline
    timeout_in_minutes: 25
    automatic_shard: true
    commands:
      - export VLLM_IMAGE_FETCH_TIMEOUT=60
      - pytest -s -v tests/distributed -m 'advanced_model and cuda and H100' --run-level 'advanced_model'
    mirror_hardwares: h100_1

  - group: ":card_index_dividers: Entrypoints Test"
    depends_on: upload-merge-pipeline
    steps:
      - label: "Entrypoint Test with H100"
        timeout_in_minutes: 60
        automatic_shard: true
        commands:
          - pytest -s -v tests/entrypoints/ -m "advanced_model and cuda and H100" --run-level "advanced_model"
        mirror_hardwares: h100_2

      - label: "Entrypoint Test with L4"
        timeout_in_minutes: 25
        automatic_shard: true
        # Workaround https://github.com/vllm-project/vllm-omni/issues/8016: shutdown()
        # leaves inline UniProc DiffusionWorker VRAM mapped in the pytest parent.
        # This job does not collect the ready leftover
        # (test_diffusion_generate_request_id, core_model); isolate the
        # advanced_model DiT handshake instead. Revert to a single sweep after
        # the product shutdown fix. An unsplit step leaves
        # BUILDKITE_PARALLEL_JOB unset, which the default treats as shard 0.
        commands:
          - |
            set -eu
            if [ "$${BUILDKITE_PARALLEL_JOB:-0}" = "0" ]; then
              pytest -s -v tests/entrypoints/test_omni_sleep_mode.py::TestOmniDiffusionSleepMode::test_diffusion_sleep_handshake -m "advanced_model and cuda and L4 and cards_1" --run-level "advanced_model"
            fi
          - pytest -s -v tests/entrypoints/ -m "advanced_model and cuda and L4 and cards_1" --run-level "advanced_model" --deselect tests/entrypoints/test_omni_sleep_mode.py::TestOmniDiffusionSleepMode::test_diffusion_sleep_handshake
        mirror_hardwares: l4_1

      - label: "Entrypoint Test with L4 · 2-GPU"
        timeout_in_minutes: 25
        automatic_shard: true
        commands:
          - pytest -s -v tests/entrypoints/ -m "advanced_model and cuda and L4 and cards_2" --run-level "advanced_model"
        mirror_hardwares: l4_2

  - group: ":card_index_dividers: E2E Test"
    depends_on: upload-merge-pipeline
    steps:
      - label: "TTS · Qwen3-TTS CustomVoice Test"
        source_file_dependencies: tts_qwen3_tts_function
        timeout_in_minutes: 40
        commands:
          - export VLLM_LOGGING_LEVEL=DEBUG
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
          - pytest -s -v tests/e2e/online_serving/test_qwen3_tts_customvoice.py tests/e2e/offline_inference/test_qwen3_tts_customvoice.py tests/e2e/features/prefill_phase/test_chunked_prefill_tail.py -m 'advanced_model and cuda' --run-level 'advanced_model'
        mirror_hardwares: l4_1

      # Drama 3 moved to CUDA weekly (slow). Keep LFM3 from main.
      - label: "TTS · LFM3 Test"
        source_file_dependencies: tts_lfm3_function
        timeout_in_minutes: 40
        commands:
          - pytest -s -v tests/e2e/online_serving/test_lfm3_omni.py tests/e2e/online_serving/test_lfm3_audio.py -m 'advanced_model and cuda' --run-level 'advanced_model'
        mirror_hardwares: l4_1

      - label: "TTS · Qwen3-TTS Base Test"
        source_file_dependencies: tts_qwen3_tts_cov
        # 40 -> 60: the coverage split runs the model twice.
        timeout_in_minutes: 60
        commands:
          - |
            export VLLM_LOGGING_LEVEL=DEBUG
            export VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
            .buildkite/common/scripts/run_cov_split.sh \
              --model-id qwen3_tts \
              --offline tests/e2e/offline_inference/test_qwen3_tts_base.py \
              --online tests/e2e/online_serving/test_qwen3_tts_base.py \
              -- -m 'advanced_model and cuda' --run-level 'advanced_model'
        mirror_hardwares: l4_1

      - label: "TTS · Spark-TTS Offline Test"
        timeout_in_minutes: 30
        source_file_dependencies: tts_spark_tts_function
        commands:
          - |
            # The pinned source and codec dependencies are cached in Dockerfile.ci.
            test -f "$${SPARK_TTS_SOURCE:?Spark-TTS source missing from CI image}/sparktts/models/bicodec.py"
            export PYTHONPATH="$$SPARK_TTS_SOURCE:$${PYTHONPATH:-}"
            timeout -k 2m 25m pytest -s -v tests/e2e/offline_inference/test_spark_tts.py \
              -m 'advanced_model and tts and cuda and L4 and cards_1' --run-level advanced_model
        mirror_hardwares: l4_1

      - label: "TTS · VibeVoice Offline Eager Test"
        source_file_dependencies: tts_vibevoice_function
        timeout_in_minutes: 30
        commands:
          - pytest -s -v tests/e2e/offline_inference/test_vibevoice_tts.py -m 'advanced_model and cuda and H100' --run-level 'advanced_model'
        mirror_hardwares: h100_1

      - label: "Omni · Qwen3-Omni Test"
        source_file_dependencies: omni_qwen3_omni_function
        timeout_in_minutes: 50
        commands:
          - pytest -s -v tests/e2e/offline_inference/test_qwen3_omni.py tests/e2e/online_serving/test_qwen3_omni.py tests/e2e/online_serving/test_qwen3_omni_thinking.py -m 'advanced_model and cuda' --run-level 'advanced_model'
        mirror_hardwares: h100_2

      - label: "Omni · Qwen3-Omni Async-Chunk SHM Leak"
        source_file_dependencies: omni_qwen3_omni_shm_leak_function
        timeout_in_minutes: 40
        commands:
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni_shm_leak.py -m 'advanced_model and cuda' --run-level 'advanced_model'
        mirror_hardwares: h100_2

      - label: "Omni · MiniCPM-o 4.5 Test"
        source_file_dependencies: omni_minicpmo_4_5_function
        timeout_in_minutes: 50
        commands:
          - pytest -s -v tests/e2e/offline_inference/test_minicpmo_4_5.py tests/e2e/online_serving/test_minicpmo_4_5.py -m 'advanced_model and cuda' --run-level 'advanced_model'
        # h100_2, not h100_1: advanced_model asserts transcribe every audio
        # response with Whisper, and tests/helpers/media.py requires at least
        # 16 GiB free VRAM on a device to run Whisper on GPU. When the model
        # server leaves insufficient memory, Whisper falls back to CPU:
        # ~8-10 min per clip vs ~30 s, which overruns the 50-minute job timeout
        # (build 2956). h100_2 guarantees a second GPU with ample free VRAM.
        mirror_hardwares: h100_2

      - label: "Omni · MiniCPM-o 4.5 Duplex Test"
        source_file_dependencies: omni_minicpmo_4_5_duplex_function
        timeout_in_minutes: 50
        commands:
          - pytest -s -v tests/e2e/online_serving/test_minicpmo_4_5_duplex.py tests/e2e/online_serving/test_minicpmo_4_5_window.py -m 'advanced_model and cuda' --run-level 'advanced_model'
        mirror_hardwares: h100_1

      - label: "Diffusion · Wan22 Test"
        source_file_dependencies: diffusion_wan22_function
        timeout_in_minutes: 40
        commands:
          - export VLLM_IMAGE_FETCH_TIMEOUT=60
          - pytest -s -v tests/e2e/offline_inference/test_wan22_t2v.py tests/e2e/online_serving/test_wan22_t2v.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
        mirror_hardwares: h100_1

      - label: "Diffusion · HunyuanVideo-1.5 Test"
        source_file_dependencies: diffusion_hunyuan_video_function
        timeout_in_minutes: 40
        commands:
          - export VLLM_IMAGE_FETCH_TIMEOUT=60
          - pytest -s -v tests/e2e/online_serving/test_hunyuan_video_15_expansion.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
        mirror_hardwares: h100_1

      - label: "Diffusion · LingBot-Video Test"
        source_file_dependencies: diffusion_lingbot_function
        timeout_in_minutes: 40
        commands:
          - export VLLM_IMAGE_FETCH_TIMEOUT=60
          - pytest -s -v tests/e2e/online_serving/test_lingbot_video.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
        mirror_hardwares: h100_1

      - label: "Diffusion · MiniMax-H3 L3 DLO DP2 and FastH3"
        source_file_dependencies: diffusion_minimax_h3_function
        # Three pytest processes. FL2VA and Ref2VA share one DP2+DLO server
        # (--task-type combined); that process does not tear it down between
        # the two full waves. -m advanced_model skips the full_model Ref2VA
        # partition case in the same file. That case runs in CUDA Nightly
        # Diffusion X2V · MiniMax H3 Function Test. Turbo LoRA (TP2) and
        # FastH3 LoRA (HSDP/USP) stay separate processes: different layouts,
        # and a DLO teardown can leave a stale resource_tracker /psm_* entry
        # that strands the next collective. A per-process timeout still fails
        # a hung regression instead of stalling the merge queue.
        timeout_in_minutes: 150
        commands:
          - |
            set -eu
            export VLLM_IMAGE_FETCH_TIMEOUT=60
            if [ -f vllm_omni/diffusion/models/minimax_h3/lora.py ]; then
              export VLLM_TEST_MINIMAX_H3_TURBO_LORA=$(python3 -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="lightx2v/Minimax-h3-Turbo", filename="minimax_h3_fl2v_turbo_4step_v1.0_768p_bf16.safetensors"))')
            fi
            if [ -f vllm_omni/diffusion/models/minimax_h3/fasth3.py ]; then
              export VLLM_TEST_MINIMAX_H3_FASTH3_LORA=$(python3 -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="FastVideo/FastVideo-FastH3-4-step-Preview-v1-LoRA", filename="dense-datafree/adapter_model.safetensors"))')
            fi
            timeout 35m pytest -s -v tests/e2e/online_serving/minimax_h3/test_minimax_h3_dlo_dp2_fl2va_ref2va.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
            timeout 35m pytest -s -v tests/e2e/online_serving/minimax_h3/test_minimax_h3_turbo_lora.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
            timeout 35m pytest -s -v tests/e2e/online_serving/minimax_h3/test_minimax_h3_fasth3_lora.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
        mirror_hardwares: h100_2

      - label: "Diffusion · MiniMax-H3 Latent Upscale and Refine"
        source_file_dependencies: diffusion_minimax_h3_function
        timeout_in_minutes: 40
        commands:
          - |
            set -eu
            VLLM_TEST_MINIMAX_H3_LATENT_UPSCALER=$(python3 -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="LBH-123-AI/Minimax_h3_latent_Upscaler", filename="minimax_h3_latent_upscaler_3d_conv_v1/minimax_h3_latent_upscaler_3d_conv_v1_bf16.safetensors"))')
            export VLLM_TEST_MINIMAX_H3_LATENT_UPSCALER
            pytest -s -v tests/e2e/online_serving/minimax_h3/test_minimax_h3.py -m 'advanced_model and cuda and diffusion' --run-level 'advanced_model'
        mirror_hardwares: h100_2
