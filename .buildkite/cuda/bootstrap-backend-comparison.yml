# Install in the existing vllm-omni pipeline's Settings > Steps.
# Keep the comparison route before either version of the regular generator.
steps:
  - label: ":pipeline: init"
    commands:
      - |
        set -euo pipefail
        if [[ -n "$${BACKEND_COMPARISON_ONLY:-}" || "$${BUILDKITE_BRANCH}" == "refs/pull/1994/head" ]]; then
          if [[ "$${BACKEND_COMPARISON_ONLY:-}" != "1" ||
                "$${BUILDKITE_SOURCE}" != "schedule" ||
                "$${BUILDKITE_BRANCH}" != "refs/pull/1994/head" ||
                "$${BUILDKITE_PIPELINE_SLUG}" != "vllm-omni" ||
                "$${BUILDKITE_REPO}" != "https://github.com/vllm-project/vllm-omni.git" ]]; then
            echo "Backend comparison requires the configured native schedule and PR 1994 ref." >&2
            exit 1
          fi
          for flag in NIGHTLY WEEKLY NON_CRITICAL MIRROR_HW; do
            if [[ -n "$${!flag:-}" ]]; then
              echo "Backend comparison cannot be combined with $${flag}." >&2
              exit 1
            fi
          done
          if [[ ! "$${BUILDKITE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$$(git rev-parse HEAD)" != "$${BUILDKITE_COMMIT}" ]]; then
            echo "Backend comparison requires an immutable commit matching the checkout." >&2
            exit 1
          fi
          buildkite-agent pipeline upload .buildkite/cuda/test-sglang-omni.yml
          exit 0
        fi
        if [[ -f .buildkite/.pipeline_gen_v2 ]]; then pip install git+https://github.com/vllm-project/ci-infra.git#subdirectory=buildkite/pipeline_generator && /var/lib/buildkite-agent/.local/bin/pipeline-generator --pipeline_config_path .buildkite/ci_config.yaml --output_file_path .buildkite/pipeline.yaml && buildkite-agent artifact upload .buildkite/pipeline.yaml && buildkite-agent pipeline upload .buildkite/pipeline.yaml && exit 0; fi
        buildkite-agent pipeline upload .buildkite/cuda/pipeline.yml
    agents:
      queue: medium_cpu_queue_premerge
