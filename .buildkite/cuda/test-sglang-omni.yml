# Separate upload preserves the dedicated image instead of applying the main
# nightly hardware mirrors, which select the standard vLLM-Omni image.
steps:
  - label: ":docker: Build SGLang-Omni comparison image"
    key: image-build-sglang-omni
    timeout_in_minutes: 60
    commands:
      - "aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7"
      - "docker build --progress=plain --file docker/Dockerfile.other -t vllm-omni-ci-sglang ."
      - "docker tag vllm-omni-ci-sglang public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-sglang-omni"
      - "docker push public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-sglang-omni"
    agents:
      queue: medium_cpu_queue_premerge

  - label: ":speaker: SGLang-Omni · Qwen3-Omni · 2-GPU Audio (10 prompts, 0.1 req/s)"
    key: nightly-sglang-omni-qwen3-omni
    depends_on: image-build-sglang-omni
    timeout_in_minutes: 90
    artifact_paths:
      - tests/dfx/perf/results/*.json
    commands:
      - 'export HF_TOKEN="$${VLLM_CI_HF_TOKEN}"'
      - export BENCHMARK_DIR=tests/dfx/perf/results
      - python3 .buildkite/cuda/scripts/check_vllm_runtime.py
      - >-
        pytest -s -v tests/dfx/perf/scripts/run_benchmark.py
        --test-config-file tests/dfx/perf/tests/test_qwen3_omni_sglang.json
        --run-level full_model
    agents:
      queue: mithril-h100-pool
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - image: "936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-sglang-omni"
                resources:
                  limits:
                    nvidia.com/gpu: 2
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /root/.cache/huggingface
                env:
                  - name: HF_HOME
                    value: /root/.cache/huggingface
                  - name: VLLM_CI_HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            nodeSelector:
              node.kubernetes.io/instance-type: gpu-h100-sxm
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
              - name: hf-cache
                hostPath:
                  path: /mnt/hf-cache
