# Separate upload preserves the dedicated image instead of applying the main
# nightly hardware mirrors, which select the standard vLLM-Omni image.
env:
  # Expanded once by the uploader after Buildkite resolves HEAD. All jobs must
  # use that checkout and the corresponding immutable image tag.
  BACKEND_COMPARISON_COMMIT: "${BUILDKITE_COMMIT}"
steps:
  - label: ":docker: Build SGLang-Omni comparison image"
    key: image-build-sglang-omni
    timeout_in_minutes: 60
    commands:
      - 'test "$$(git rev-parse HEAD)" = "$${BACKEND_COMPARISON_COMMIT}"'
      - "aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws/q9t5s3a7"
      # Explicit historical inputs for manually selected diagnostics. Weekly
      # builds replace this command with the snapshot resolver/image producer.
      - >-
        docker build --progress=plain --file docker/Dockerfile.other
        --build-arg SGLANG_OMNI_COMMIT=137eaa97b7ba426b13aa8837d37c5ba4e0a0daba
        --build-arg SGLANG_BASE_IMAGE=lmsysorg/sglang@sha256:5fc09edb6a0bb1d5b6992b543723c66d08f86d7a507e951e87e0d05db4ac766e
        --build-arg UCX_COMMIT=d8e50df6651b9ea5b76f23aee0aefbf053a4137a
        -t vllm-omni-ci-sglang .
      - "docker tag vllm-omni-ci-sglang public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-sglang-omni"
      - "docker push public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-sglang-omni"
    agents:
      queue: medium_cpu_queue_premerge

  - &audio_benchmark
    label: ":speaker: SGLang-Omni · Qwen3-Omni · 2-GPU Audio (10 prompts, 0.1 req/s)"
    key: nightly-sglang-omni-qwen3-omni
    env:
      COMPARISON_CONFIG: tests/dfx/perf/tests/test_qwen3_omni_sglang.json
    depends_on: image-build-sglang-omni
    timeout_in_minutes: 90
    artifact_paths:
      - tests/dfx/perf/results/*.json
    commands:
      - 'test "$$(git rev-parse HEAD)" = "$${BACKEND_COMPARISON_COMMIT}"'
      - 'export HF_TOKEN="$${VLLM_CI_HF_TOKEN}"'
      - export BENCHMARK_DIR=tests/dfx/perf/results
      - python3 .buildkite/cuda/scripts/check_vllm_runtime.py
      - >-
        pytest -s -v tests/dfx/perf/scripts/run_benchmark.py
        --test-config-file "$${COMPARISON_CONFIG}"
        --run-level full_model
    agents:
      queue: mithril-h100-pool
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - image: "936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-sglang-omni"
                resources:
                  limits:
                    nvidia.com/gpu: 2
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /root/.cache/huggingface
                env:
                  - name: HF_HOME
                    value: /root/.cache/huggingface
                  - name: VLLM_CI_HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            nodeSelector:
              node.kubernetes.io/instance-type: gpu-h100-sxm
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
              - name: hf-cache
                hostPath:
                  path: /mnt/hf-cache

  - <<: *audio_benchmark
    label: ":speaker: SGLang-Omni · Qwen3-TTS Base · 2-GPU voice clone (20 prompts, concurrency 1)"
    key: nightly-sglang-omni-qwen3-tts
    if: build.source == "schedule"
    env:
      COMPARISON_CONFIG: tests/dfx/perf/tests/test_qwen3_tts_sglang.json
