env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  VLLM_USE_FLASHINFER_MOE_FP16: 0
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: ":card_index_dividers: Simple Test"
    depends_on: upload-ready-pipeline
    steps:
      # docker / gpu_1_queue: editable APP_DIR is /opt/vllm-omni (#5364).
      - label: "Simple · vllm_omni import diag"
        commands:
          - |
            python - <<'PY'
            from __future__ import annotations

            import os
            import subprocess
            import sys
            import tempfile
            from importlib.util import find_spec
            from pathlib import Path

            candidates = [
                "/opt/vllm-omni",
                "/opt/vllm-omni/vllm_omni",
                "/workspace/vllm-omni",
                "/workspace/vllm-omni/vllm_omni",
                "/workspace/build/buildkite",
                "/workspace/build/buildkite/vllm_omni",
                "/workdir",
                "/workdir/vllm_omni",
            ]

            def run_child(*, cwd: str, env: dict[str, str], label: str) -> int:
                code = (
                    "from importlib.util import find_spec; "
                    "import os, sys; "
                    "print('child_cwd', os.getcwd()); "
                    "print('child_sys_path0', repr(sys.path[0])); "
                    "print('child_PYTHONPATH', os.environ.get('PYTHONPATH')); "
                    "print('child_sys_path[:8]', sys.path[:8]); "
                    "s = find_spec('vllm_omni'); "
                    "print('child_find_spec', s); "
                    "print('child_loader', None if s is None else type(s.loader).__name__); "
                    "print('child_origin', None if s is None else s.origin); "
                    "raise SystemExit(0 if s is not None else 1)"
                )
                proc = subprocess.run(
                    [sys.executable, "-c", code],
                    cwd=cwd,
                    env=env,
                    capture_output=True,
                    text=True,
                    check=False,
                )
                print(f"--- subprocess ({label}) ---")
                print(proc.stdout, end="")
                print(proc.stderr, end="")
                print("child_exit:", proc.returncode)
                return proc.returncode

            print("=== vllm_omni package discovery diag (#5364) ===")
            print("cwd:", os.getcwd())
            print("executable:", sys.executable)
            print("PYTHONPATH:", os.environ.get("PYTHONPATH"))
            print("sys.path[:10]:", sys.path[:10])
            try:
                print("/workspace listing:", sorted(os.listdir("/workspace")))
            except OSError as exc:
                print("/workspace listing: <unavailable>", exc)

            for path in candidates:
                p = Path(path)
                print(f"exists {path!r}: {p.exists()} is_dir={p.is_dir() if p.exists() else None}")

            spec = find_spec("vllm_omni")
            print("find_spec(vllm_omni) [main, env as-is]:", spec)
            if spec is not None:
                print("  loader:", type(spec.loader).__name__)
                print("  origin:", spec.origin)
                print("  submodule_search_locations:", list(spec.submodule_search_locations or []))

            base_env = os.environ.copy()
            no_pp_env = {k: v for k, v in base_env.items() if k != "PYTHONPATH"}

            with tempfile.TemporaryDirectory(prefix="omni_import_diag_") as tmp:
                # 1) With PYTHONPATH (current image default): must work off-repo-cwd.
                rc_with = run_child(
                    cwd=tmp,
                    env=base_env,
                    label="cwd=tmpdir, PYTHONPATH kept",
                )
                # 2) Without PYTHONPATH: tests editable finder alone (what #5341 relied on).
                rc_without = run_child(
                    cwd=tmp,
                    env=no_pp_env,
                    label="cwd=tmpdir, PYTHONPATH unset",
                )

            print("=== summary ===")
            print("with_PYTHONPATH_child_ok:", rc_with == 0)
            print("without_PYTHONPATH_child_ok:", rc_without == 0)
            if rc_without == 0:
                print(
                    "editable_only: PASS "
                    "(find_spec works off-repo-cwd without PYTHONPATH)"
                )
            else:
                print(
                    "editable_only: FAIL "
                    "(off-repo-cwd needs PYTHONPATH; editable finder insufficient here)"
                )

            if spec is None:
                raise SystemExit("find_spec(vllm_omni) is None in the main process")
            if rc_without != 0:
                raise SystemExit(
                    "find_spec(vllm_omni) failed off-repo-cwd without PYTHONPATH "
                    "(editable APP_DIR=/opt/vllm-omni should work)"
                )
            print("diag ok (editable /opt/vllm-omni verified)")
            PY
        agents:
          queue: "gpu_1_queue"
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

