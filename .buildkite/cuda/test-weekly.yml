# CUDA CI L5 (`slow` / reliability / extra coverage).
# Uploaded by Upload Weekly Pipeline: WEEKLY=1 / NON_CRITICAL=1, or PR label `weekly-test`.

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: "Reliability Test"
    depends_on: upload-weekly-pipeline
    if: build.env("WEEKLY") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "Reliability Test · qwen3-omni"
        source_file_dependencies: omni_qwen3_omni_reliability
        timeout_in_minutes: 180
        commands:
          - pytest -s -v tests/dfx/reliability/test_qwen3_omni.py -m "slow and cards_2"
        mirror_hardwares: h100_2

      - label: "Reliability Test · wan22"
        source_file_dependencies: diffusion_wan22_reliability
        timeout_in_minutes: 180
        commands:
          - pytest -s -v tests/dfx/reliability/test_wan22.py -m "slow and cards_1"
        mirror_hardwares: h100_1

      - label: "Reliability Test · hunyuan-image"
        source_file_dependencies: diffusion_hunyuan_image3_reliability
        timeout_in_minutes: 180
        commands:
          - pytest -s -v tests/dfx/reliability/test_hunyuan_image.py -m "slow and cards_4"
        mirror_hardwares: h100_4

      - label: "Reliability Test · minicpmo-4.5"
        source_file_dependencies: omni_minicpmo_4_5_reliability
        timeout_in_minutes: 180
        commands:
          - pytest -s -v tests/dfx/reliability/test_minicpmo_4_5.py -m "slow and cards_1"
        mirror_hardwares: h100_1

      - label: "Reliability Test · Invalid parameters · H100 · Single-GPU"
        source_file_dependencies: reliability_invalid_param_h100
        timeout_in_minutes: 90
        commands:
          - pytest -s -v tests/dfx/reliability/invalid_param_test/ -m "slow and H100 and cards_1"
        mirror_hardwares: h100_1

      - label: "Reliability Test · Invalid parameters · H100 · 2-GPU"
        source_file_dependencies: reliability_invalid_param_h100
        timeout_in_minutes: 90
        commands:
          - pytest -s -v tests/dfx/reliability/invalid_param_test/ -m "slow and H100 and cards_2"
        mirror_hardwares: h100_2

      - label: "Reliability Test · Invalid parameters · L4"
        source_file_dependencies: reliability_invalid_param_l4
        timeout_in_minutes: 120
        commands:
          - pytest -s -v tests/dfx/reliability/invalid_param_test/ -m "slow and L4"
        mirror_hardwares: l4_1

  # Keep the scheduled CUDA lane unchanged while allowing a PR carrying the
  # weekly-test label to qualify this exact workload. The source dependency
  # union keeps that PR validation focused instead of enabling the entire E2E
  # weekly group.
  - group: ":microphone: VoxCPM2 and Voxtral Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "TTS · VoxCPM2 · Voxtral · L4"
        source_file_dependencies:
          - tts_voxcpm2_weekly
          - tts_voxtral_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_voxcpm2_tts.py \
              tests/e2e/online_serving/test_voxcpm2_tts.py \
              tests/e2e/online_serving/test_voxcpm2_tts_expansion.py \
              tests/e2e/online_serving/test_voxcpm2_tts_lora.py \
              tests/e2e/offline_inference/test_voxtral_tts_expansion.py \
              tests/e2e/online_serving/test_voxtral_tts_expansion.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

  # Keep the scheduled CUDA lanes unchanged while allowing the weekly-test
  # label to qualify the exact Moss and Higgs workloads added on AMD.
  - group: ":microphone: Moss and Higgs Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "TTS · Moss · L4"
        source_file_dependencies:
          - tts_moss_tts_expansion
          - tts_moss_tts_extended_weekly
          - tts_moss_tts_nano_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
          # The standalone realtime reference codec is about 7 GiB. Keep only
          # this 24 GiB L4 qualification lane on CPU so both serving stages fit.
          VLLM_OMNI_MOSS_REALTIME_REF_ENCODER_DEVICE: "cpu"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_moss_tts_expansion.py \
              tests/e2e/offline_inference/test_moss_tts_nano_expansion.py \
              tests/e2e/offline_inference/test_moss_tts_realtime.py \
              tests/e2e/offline_inference/test_moss_tts_realtime_expansion.py \
              tests/e2e/online_serving/test_moss_tts_expansion.py \
              tests/e2e/online_serving/test_moss_tts_nano_expansion.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

      - label: "TTS · Higgs · L4"
        source_file_dependencies:
          - tts_higgs_audio_v2_weekly
          - tts_higgs_audio_v3_weekly
        timeout_in_minutes: 90
        env:
          # The L4 Higgs profiles exercise the established V1 path. Higgs V2
          # does not produce audio under MRV2, while Higgs V3's MRV2 profile
          # requires the H200-only audio_async_payload configuration.
          VLLM_OMNI_CI_MODEL_RUNNER: "v1"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_higgs_audio_v2_expansion.py \
              tests/e2e/online_serving/test_higgs_audio_v2_expansion.py \
              tests/e2e/online_serving/test_higgs_audio_v3.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

  # Qualify the CUDA owner of the OmniVoice and Step-Audio AMD additions on
  # weekly-test PRs without enabling the rest of the weekly E2E matrix.
  - group: ":microphone: OmniVoice and Step-Audio Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "TTS · OmniVoice · Step-Audio · L4"
        source_file_dependencies:
          - tts_omnivoice_offline_parity_weekly
          - tts_omnivoice_online_weekly
          - tts_step_audio2_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_omnivoice_expansion.py \
              tests/e2e/online_serving/test_omnivoice_expansion.py \
              tests/e2e/online_serving/test_omnivoice_parity.py \
              tests/e2e/offline_inference/test_step_audio2_expansion.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

  # Qualify the CUDA owner of the Ming, GLM, IndexTTS, and Breeze AMD
  # additions on weekly-test PRs without enabling unrelated E2E jobs. Keep
  # each model in a separate process/agent lifetime so full-weight teardown
  # from one model cannot corrupt or prevent startup of the next model. These
  # established L4 profiles use model runner v1: forcing v2 corrupts Ming/GLM
  # online audio and breaks IndexTTS2/Breeze output metadata during execution
  # or sampler warmup.
  - group: ":microphone: Ming GLM IndexTTS and Breeze Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "TTS · Ming · L4"
        source_file_dependencies:
          - tts_ming_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v1"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_ming_tts_expansion.py \
              tests/e2e/online_serving/test_ming_tts_expansion.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

      - label: "TTS · GLM · L4"
        source_file_dependencies:
          - tts_glm_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v1"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_glm_tts_expansion.py \
              tests/e2e/online_serving/test_glm_tts_expansion.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

      - label: "TTS · IndexTTS2 · L4"
        source_file_dependencies:
          - tts_indextts2_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v1"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_indextts2_expansion.py \
              tests/e2e/online_serving/test_indextts2_expansion.py
            do
              pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

      - label: "TTS · Breeze TTS 2 · L4"
        source_file_dependencies:
          - tts_breeze_tts2_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v1"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - pytest -s -v tests/e2e/online_serving/test_breeze_tts_2.py -m "slow and L4 and tts" --run-level "full_model"
        mirror_hardwares: l4_1

  # Qualify the existing CUDA owner while the AMD Audex and CosyVoice jobs
  # expand to the remaining shared tests.
  - group: ":microphone: Audex CosyVoice and Qwen3-TTS Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "TTS · Audex · CosyVoice · Qwen3-TTS · L4"
        source_file_dependencies:
          - tts_audex_weekly
          - tts_cosyvoice3_function
          - tts_qwen3_tts_function
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            for f in \
              tests/e2e/offline_inference/test_audex_tts.py \
              tests/e2e/offline_inference/test_audex_s2t.py \
              tests/e2e/offline_inference/test_audex_tta.py \
              tests/e2e/offline_inference/test_cosyvoice3_expansion.py \
              tests/e2e/online_serving/test_qwen3_tts_word_timestamps.py
            do
              runner=v2
              # Audex's CFG/RVQ processors implement vLLM's V1 contract.
              # CosyVoice3's full-weight weekly path also stays on V1: its
              # vLLM 0.33 V2 sync path can exceed the generic connector wait,
              # and the async path still sends the obsolete sampling_params
              # payload field. The ROCm owners exercise the same V1 paths.
              case "$$f" in
                tests/e2e/offline_inference/test_audex_*) runner=v1 ;;
                tests/e2e/offline_inference/test_cosyvoice3_expansion.py) runner=v1 ;;
              esac
              VLLM_OMNI_CI_MODEL_RUNNER="$$runner" \
                pytest -s -v "$$f" -m "slow and L4 and tts" --run-level "full_model" || failed=1
            done
            exit $$failed
        mirror_hardwares: l4_1

  # Qualify the dedicated CUDA Gepard and Kokoro owners alongside their AMD
  # additions when a parity PR carries weekly-test.
  - group: ":microphone: Gepard and Kokoro Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      # The image has no NanoCodec. Preserve the scheduled lane's dependency
      # setup so PR validation executes the same workload.
      - label: "TTS · Gepard-1.0 · L4"
        source_file_dependencies: tts_gepard_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - printf '%s\n' "transformers>=5.5.3" "huggingface-hub>=1.0" > /tmp/gepard-overrides.txt
          - uv pip install --python "$(python3 -c 'import sys; print(sys.executable)')" "nemo_toolkit[tts]==2.7.3" --overrides /tmp/gepard-overrides.txt
          - >-
            pytest -s -v tests/e2e/offline_inference/test_gepard_tts.py
            tests/e2e/online_serving/test_gepard_tts.py
            -m "tts and cuda"
            --run-level "full_model"
        mirror_hardwares: l4_1

      # The image has no misaki G2P. Preserve the scheduled lane's explicit
      # install so this is an execution gate rather than an import-skip.
      - label: "TTS · Kokoro-82M · L4"
        source_file_dependencies: tts_kokoro_weekly
        timeout_in_minutes: 30
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - >-
            uv pip install --python "$(python3 -c 'import sys; print(sys.executable)')"
            "misaki[en]>=0.9.4"
            "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          - >-
            pytest -s -v tests/e2e/offline_inference/test_kokoro.py
            tests/e2e/online_serving/test_kokoro.py
            -m "tts and cuda"
            --run-level "advanced_model"
        mirror_hardwares: l4_1

  # Run the aggregate CUDA H100 owner on parity PRs that touch one of the
  # executable H100 TTS workloads now represented on AMD. Audex's custom
  # processors and the supported CosyVoice3, Higgs V3, MiniMax Music3, and
  # YuE2 paths use V1; retain V2 for the remaining H100 paths instead of
  # forcing one runner across the suite.
  - group: ":microphone: H100 TTS Weekly Test"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1" || build.pull_request.labels includes "weekly-test"
    steps:

      - label: "TTS · H100"
        source_file_dependencies:
          - tts_audex_weekly
          - tts_higgs_audio_v3_weekly
          - tts_step_audio2_weekly
          - tts_moss_v15_weekly
          - tts_minimax_music3_weekly
          - tts_yue2_weekly
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_USE_DEEP_GEMM="0"
          - export VLLM_MOE_USE_DEEP_GEMM="0"
          - |
            failed=0
            VLLM_OMNI_CI_MODEL_RUNNER=v1 pytest -sv \
              tests/e2e/offline_inference/test_audex_s2s.py \
              tests/e2e/online_serving/test_audex_tta.py \
              tests/e2e/online_serving/test_audex_tts.py \
              tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py \
              tests/e2e/online_serving/test_higgs_audio_v3.py \
              tests/e2e/online_serving/test_minimax_music3.py \
              tests/e2e/online_serving/test_yue2.py \
              -m "slow and H100 and tts" \
              --run-level "full_model" || failed=1
            VLLM_OMNI_CI_MODEL_RUNNER=v2 pytest -sv \
              tests/e2e/ -m "slow and H100 and tts" \
              --ignore=tests/e2e/offline_inference/test_audex_s2s.py \
              --ignore=tests/e2e/online_serving/test_audex_tta.py \
              --ignore=tests/e2e/online_serving/test_audex_tts.py \
              --ignore=tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py \
              --ignore=tests/e2e/online_serving/test_drama_3.py \
              --ignore=tests/e2e/online_serving/test_higgs_audio_v3.py \
              --ignore=tests/e2e/online_serving/test_minimax_music3.py \
              --ignore=tests/e2e/online_serving/test_yue2.py \
              --run-level "full_model" || failed=1
            exit $$failed
        mirror_hardwares: h100_1

  - group: ":card_index_dividers: E2E Tests"
    depends_on: upload-weekly-pipeline
    if: build.env("NON_CRITICAL") == "1"
    steps:

      # VLLM_OMNI_CI_MODEL_RUNNER writes deploy model_runner before the server
      # starts. Upstream VLLM_USE_V2_MODEL_RUNNER does not select Omni stages.
      # Online Qwen2.5 expansion is 2-card; offline expansion + AutoRound are 4-card.
      - label: "Omni · L4 · 2-GPU"
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/e2e/online_serving/test_qwen2_5_omni_expansion.py -m "slow and L4 and omni and cards_2" --run-level "core_model"
        mirror_hardwares: l4_2

      - label: "Omni · L4 · 4-GPU"
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/e2e/offline_inference/test_qwen2_5_omni_expansion.py -m "slow and L4 and omni and cards_4" --run-level "core_model"
          - >-
            pytest -s -v tests/e2e/
            --ignore=tests/e2e/online_serving/test_qwen2_5_omni_expansion.py
            --ignore=tests/e2e/offline_inference/test_qwen2_5_omni_expansion.py
            -m "slow and L4 and omni and cards_4"
            --run-level "full_model"
        mirror_hardwares: l4_4

      - label: "Omni · H100 · Single-GPU"
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - >-
            pytest -sv
            tests/e2e/ -m "slow and H100 and omni and cards_1"
            --run-level "full_model"
        mirror_hardwares: h100_1

      - label: "Omni · H100 · 4-GPU"
        timeout_in_minutes: 90
        env:
          VLLM_OMNI_CI_MODEL_RUNNER: "v2"
        commands:
          - >-
            pytest -sv
            tests/e2e/ -m "slow and H100 and omni and cards_4"
            --run-level "full_model"
        mirror_hardwares: h100_4

      - label: "Diffusion · L4 · Single-GPU"
        timeout_in_minutes: 60
        commands:
          - >-
            pytest -sv
            tests/e2e/ -m "slow and diffusion and L4 and cards_1"
            --ignore=tests/e2e/offline_inference/test_qwen_image_autoround_w4a16_expansion.py
            --run-level "full_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · L4 · 2-GPU"
        timeout_in_minutes: 60
        commands:
          - >-
            pytest -sv
            tests/e2e/ -m "slow and diffusion and L4 and cards_2"
            --run-level "full_model"
        mirror_hardwares: l4_2

      - label: "Diffusion · L4 · 4-GPU"
        timeout_in_minutes: 60
        commands:
          - >-
            pytest -sv
            tests/e2e/ -m "slow and diffusion and L4 and cards_4"
            --run-level "full_model"
        mirror_hardwares: l4_4

      # Split the old shared H100 Single-GPU sweep: one pytest process collected
      # every slow+cards_1 diffusion file and exceeded 150 minutes.

      - label: "Diffusion · Qwen-Image · H100 · Single-GPU"
        timeout_in_minutes: 120
        commands:
          - >-
            pytest -sv
            tests/e2e/online_serving/test_qwen_image_edit.py
            tests/e2e/online_serving/test_qwen_image_edit_expansion.py
            tests/e2e/online_serving/test_qwen_image_layered.py
            tests/e2e/online_serving/test_qwen_image_layered_expansion.py
            tests/e2e/accuracy/test_qwen_image_edit.py
            tests/e2e/accuracy/test_qwen_image_layered.py
            -m "slow and diffusion and H100 and cards_1"
            --run-level "full_model"
        mirror_hardwares: h100_1

      - label: "Diffusion · JoyAI-Image-Edit · Accuracy · H100 · Single-GPU"
        timeout_in_minutes: 180
        commands:
          - >-
            pytest -sv
            tests/e2e/accuracy/test_joy_image_edit.py
            -m "slow and diffusion and H100 and cards_1"
            --run-level "full_model"
        mirror_hardwares: h100_1

      - label: "Diffusion · Wan2.1 VACE · H100 · Single-GPU"
        timeout_in_minutes: 90
        commands:
          - >-
