            --junitxml="$$ROCM_MINICPMO_OFFLINE_ARTIFACT_DIR/pytest.xml" || status=$$?
          if [[ "$$status" -eq 0 ]]; then
            if python -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite")); tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites); skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites); ok = tests == 2 and skipped == 0; print(f"Expected exactly two executed MiniCPM-o offline tests; reported tests={tests}, skipped={skipped}.", file=sys.stderr) if not ok else None; raise SystemExit(0 if ok else 5)' "$$ROCM_MINICPMO_OFFLINE_ARTIFACT_DIR/pytest.xml"
            then
              status=0
            else
              status=$$?
            fi
          fi
          (exit "$$status")

    - label: "ROCm · MiniCPM-o 4.5 Online Coverage"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      timeout_in_minutes: 30
      artifact_paths:
        - artifacts/rocm-minicpmo-45-online/**/*
      commands:
        - export ROCM_MINICPMO_ONLINE_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-minicpmo-45-online"
        - mkdir -p "$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR"
        - |
          set -euo pipefail
          nodes=(
            "tests/e2e/online_serving/test_minicpmo_4_5.py::test_text_to_text_001[async_chunk]"
            "tests/e2e/online_serving/test_minicpmo_4_5.py::test_text_to_text_001[turn_async_chunk]"
            "tests/e2e/online_serving/test_minicpmo_4_5.py::test_mix_to_text_audio_001[async_chunk]"
          )
          marker="core_model and omni and rocm and MI325 and cards_1"
          pytest --collect-only -q "$${nodes[@]}" \
            --shard-id=0 --num-shards=1 \
            -m "$$marker" --run-level core_model \
            > "$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR/collection.txt"
          count=$$(awk '/::/ { n++ } END { print n + 0 }' \
            "$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR/collection.txt")
          if [[ "$$count" != "$${#nodes[@]}" ]]; then
            echo "Expected exactly $${#nodes[@]} MiniCPM-o online nodes, found $$count." >&2
            cat "$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR/collection.txt" >&2
            exit 1
          fi
          for node in "$${nodes[@]}"; do
            if ! grep -Fq "$$node" "$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR/collection.txt"; then
              echo "MiniCPM-o online node was not collected: $$node" >&2
              exit 1
            fi
          done
        - |
          nodes=(
            "tests/e2e/online_serving/test_minicpmo_4_5.py::test_text_to_text_001[async_chunk]"
            "tests/e2e/online_serving/test_minicpmo_4_5.py::test_text_to_text_001[turn_async_chunk]"
            "tests/e2e/online_serving/test_minicpmo_4_5.py::test_mix_to_text_audio_001[async_chunk]"
          )
          status=0
          timeout --signal=TERM --kill-after=1m 20m \
            pytest -s -v "$${nodes[@]}" \
            --shard-id=0 --num-shards=1 \
            -m "core_model and omni and rocm and MI325 and cards_1" --run-level core_model \
            --junitxml="$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR/pytest.xml" || status=$$?
          if [[ "$$status" -eq 0 ]]; then
            if python -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite")); tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites); skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites); ok = tests == 3 and skipped == 0; print(f"Expected exactly three executed MiniCPM-o online tests; reported tests={tests}, skipped={skipped}.", file=sys.stderr) if not ok else None; raise SystemExit(0 if ok else 5)' "$$ROCM_MINICPMO_ONLINE_ARTIFACT_DIR/pytest.xml"
            then
              status=0
            else
              status=$$?
            fi
          fi
          (exit "$$status")

