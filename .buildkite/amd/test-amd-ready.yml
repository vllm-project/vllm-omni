- label: "ROCm · Model Executor GPU Coverage (R2-01) · Shard %N/%t"
  agent_pool: mi300_1
  parallelism: 3
  depends_on: amd-build
  mirror_hardwares: [amdproduction]
  grade: NonBlocking
  # Two shards measured median 22.7 minutes and max 30.8 from October 19-26.
  # A third shard is the next cut. Re-read --durations=0 before adding a fourth.
  # The command timeout leaves five minutes for the summary artifact.
  timeout_in_minutes: 50
  artifact_paths:
    - "artifacts/rocm-r2-01/**/*"
  commands:
    # Native AMD tests run from /app/vllm-omni, while Buildkite uploads
    # artifacts relative to its checkout directory.
    - export R2_01_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-r2-01"
    - mkdir -p "$$R2_01_ARTIFACT_DIR"
    # The dedicated Engine Test below owns the only selected tests/engine case;
    # do not duplicate its model startup in this time-bounded coverage lane.
    # The CUDA ready job also covers tests/worker/test_batched_omni_output.py.
    # Keep the initial ROCm burn-in scoped to tests/model_executor/.
    # Shard 0 checks the full 1416-node set. The other shards skip that
    # collection and run their pytest slice immediately.
    - |
      if [[ "$${BUILDKITE_PARALLEL_JOB:-0}" == "0" ]]; then
        bash .buildkite/amd/scripts/assert-pytest-collection.sh 1416 \
          tests/model_executor/ \
          -m 'core_model and rocm and MI325 and not nvidia_only and not (cards_2 or cards_3 or cards_4 or cards_5 or cards_6 or cards_7 or cards_8)' \
          --run-level "core_model"
      fi
    - >-
      timeout --signal=TERM --kill-after=2m 45m
      pytest -s -v -ra
      tests/model_executor/
      -m 'core_model and rocm and MI325 and not nvidia_only and not
      (cards_2 or cards_3 or cards_4 or cards_5 or cards_6 or cards_7 or cards_8)'
      --run-level "core_model"
      --durations=0
      --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
      --shard-id=$$BUILDKITE_PARALLEL_JOB
      --junitxml="$$R2_01_ARTIFACT_DIR/pytest-$${BUILDKITE_PARALLEL_JOB}-of-$${BUILDKITE_PARALLEL_JOB_COUNT}.xml"
      2>&1 | tee "$$R2_01_ARTIFACT_DIR/pytest-$${BUILDKITE_PARALLEL_JOB}-of-$${BUILDKITE_PARALLEL_JOB_COUNT}.log"
    - >-
      tail -n 100
      "$$R2_01_ARTIFACT_DIR/pytest-$${BUILDKITE_PARALLEL_JOB}-of-$${BUILDKITE_PARALLEL_JOB_COUNT}.log"
      > "$$R2_01_ARTIFACT_DIR/pytest-summary-$${BUILDKITE_PARALLEL_JOB}-of-$${BUILDKITE_PARALLEL_JOB_COUNT}.txt"

