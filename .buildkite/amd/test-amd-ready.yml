- group: ":card_index_dividers: E2E Test"
  steps:
    - label: "Qwen3-TTS E2E Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_LOGGING_LEVEL=DEBUG
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
        # Card counts match, so hardware_test does not add a platform id suffix.
        - |
          timeout 30m bash <<'QWEN3_TTS_READY'
          set -euo pipefail
          nodes=(
            "tests/e2e/online_serving/test_qwen3_tts_customvoice.py::test_cached_predictor_streaming_audio[omni_server0]"
            "tests/e2e/online_serving/test_qwen3_tts_customvoice.py::test_default_cuda_graph_startup[async_chunk]"
            "tests/e2e/online_serving/test_qwen3_tts_customvoice.py::test_text_to_audio_001[async_chunk]"
            "tests/e2e/online_serving/test_qwen3_tts_customvoice.py::test_text_to_audio_002[async_chunk]"
          )
          printf '%s\n' "$${nodes[@]}" | sort > /tmp/qwen3-tts-ready-expected.txt
          pytest -q tests/e2e/online_serving/test_qwen3_tts_customvoice.py \
            -m "core_model and tts and rocm and MI325 and cards_1" \
            --run-level "core_model" \
            --collect-only \
            | sed -n 's/^\(tests\/.*::.*\)/\1/p' \
            | sort > /tmp/qwen3-tts-ready-collected.txt
          if ! diff -u /tmp/qwen3-tts-ready-expected.txt /tmp/qwen3-tts-ready-collected.txt; then
            echo "Qwen3-TTS READY collection drifted from the selected CustomVoice core nodes" >&2
            exit 1
          fi
          pytest -s -v tests/e2e/online_serving/test_qwen3_tts_customvoice.py \
            -m "core_model and tts and rocm and MI325 and cards_1" \
            --run-level "core_model"
          QWEN3_TTS_READY

    # Keep a fast model/server integration check in the blocking lane. The
    # full default-backend suite remains in the nightly pipeline because a
    # cold ROCm AITER MHA build can add more than 25 minutes to this job.
    - label: "CosyVoice3-TTS E2E Smoke (SDPA)"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      # A ROCm hardware hang aborts the interpreter with 134. Let Buildkite
      # create one fresh pod instead of retrying on the poisoned GPU process.
      retry:
        automatic:
          - exit_status: 134
            limit: 1
      commands:
        - export DIFFUSION_ATTENTION_BACKEND=TORCH_SDPA
        - pytest -s -v tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py::test_voice_clone_zh_002 -m "slow" --run-level "core_model"

    # One-card text-to-audio only. Voice-clone cases stay out until they have
    # an MI325 run. The command budget stays 30 minutes inside a 40-minute step.
    - label: "Drama 3 E2E Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      timeout_in_minutes: 40
      artifact_paths:
        - "artifacts/rocm-drama3-ready/**/*"
      commands:
        - |
          timeout 30m bash <<'DRAMA3_READY'
          set -euo pipefail
          export DRAMA3_READY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-drama3-ready"
          mkdir -p "$$DRAMA3_READY_ARTIFACT_DIR"
          nodes=(
            "tests/e2e/online_serving/test_drama_3.py::test_text_to_audio_001[drama_3-rocm]"
          )
          printf '%s\n' "$${nodes[@]}" | sort > /tmp/drama3-ready-expected.txt
          pytest -q tests/e2e/online_serving/test_drama_3.py \
            -m "core_model and tts and rocm and MI325 and cards_1" \
            --run-level "core_model" \
            --collect-only \
            | sed -n 's/^\(tests\/.*::.*\)/\1/p' \
            | sort > /tmp/drama3-ready-collected.txt
          if ! diff -u /tmp/drama3-ready-expected.txt /tmp/drama3-ready-collected.txt; then
            echo "Drama 3 READY collection drifted from test_text_to_audio_001[drama_3-rocm]" >&2
            exit 1
          fi
          pytest -s -v tests/e2e/online_serving/test_drama_3.py \
            -m "core_model and tts and rocm and MI325 and cards_1" \
            --run-level "core_model" \
            --junitxml="$$DRAMA3_READY_ARTIFACT_DIR/pytest.xml"
          DRAMA3_READY

    - label: "ROCm · VeRL-Omni Generate GPU Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      # The step is 40 minutes. The command leaves ten minutes for preflight.
      # Cold AITER MHA JIT varied from 911s to 1211s in READY qualification,
      # consuming most of the command before VeRL generation began. Keep this
      # focused integration/cleanup smoke bounded; dedicated READY jobs cover
      # the AITER backend itself.
      timeout_in_minutes: 40
      commands:
        - |
          timeout --signal=TERM --kill-after=1m 30m bash <<'VERL_GENERATE_READY'
          set -euo pipefail
          export DIFFUSION_ATTENTION_BACKEND=TORCH_SDPA
          nodes=(
            "tests/e2e/features/rlhf_test/test_verl_omni_e2e.py::test_generate"
          )
          printf '%s\n' "$${nodes[@]}" | sort > /tmp/verl-generate-ready-expected.txt
          pytest -q tests/e2e/features/rlhf_test/test_verl_omni_e2e.py \
            -m "core_model and diffusion and rocm and MI325 and cards_1" \
            --run-level "core_model" \
            --collect-only \
            | sed -n 's/^\(tests\/.*::.*\)/\1/p' \
            | sort > /tmp/verl-generate-ready-collected.txt
          if ! diff -u /tmp/verl-generate-ready-expected.txt /tmp/verl-generate-ready-collected.txt; then
            echo "VeRL-Omni READY collection drifted from test_generate" >&2
            exit 1
          fi
          pytest -s -v tests/e2e/features/rlhf_test/test_verl_omni_e2e.py \
            -m "core_model and diffusion and rocm and MI325 and cards_1" \
            --run-level "core_model"
          VERL_GENERATE_READY

