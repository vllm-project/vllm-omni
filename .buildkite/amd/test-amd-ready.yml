- group: ":card_index_dividers: E2E Test"
  steps:
    - label: "Qwen3-TTS E2E Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_LOGGING_LEVEL=DEBUG
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
        - timeout 30m pytest -s -v tests/e2e/online_serving/test_qwen3_tts_customvoice.py -m "core_model" --run-level "core_model"

    # Keep a fast model/server integration check in the blocking lane. The
    # full default-backend suite remains in the nightly pipeline because a
    # cold ROCm AITER MHA build can add more than 25 minutes to this job.
    - label: "CosyVoice3-TTS E2E Smoke (SDPA)"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      # A ROCm hardware hang aborts the interpreter with 134. Let Buildkite
      # create one fresh pod instead of retrying on the poisoned GPU process.
      retry:
        automatic:
          - exit_status: 134
            limit: 1
      commands:
        - export DIFFUSION_ATTENTION_BACKEND=TORCH_SDPA
        - pytest -s -v tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py::test_voice_clone_zh_002 -m "slow" --run-level "core_model"

