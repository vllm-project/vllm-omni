env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:

- group: ":card_index_dividers: Simple Test"
  steps:
    - label: "Simple · Model Executor Test · Shard %N/%t"
      agent_pool: mi300_1
      parallelism: 3
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 90
      commands:
        - export VLLM_ROCM_USE_AITER=0
        # ignore test_teacache_extractors.py because it use rocm gemm kernel from vLLM
        # that is not supported on CPU
        - >-
          pytest -sv tests/model_executor
          -m 'core_model and cpu and not omni'
          --deselect=tests/model_executor/models/personaplex/test_temporal_streaming_hoist.py::test_mimi_streaming_step_matches_legacy_end_to_end
          --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
          --shard-id=$$BUILDKITE_PARALLEL_JOB

    - label: "Simple · Omni Processor Snapshot Smoke"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 10
      commands:
        - export VLLM_ROCM_USE_AITER=0
        - >-
          timeout --signal=TERM --kill-after=1m 8m
          pytest -sv
          tests/model_executor/models/test_omni_processing.py::test_rocm_processor_snapshot_smoke
          -m 'core_model and cpu and omni' --durations=0

    - label: "Simple · Diffusion Test · Shard %N/%t"
      agent_pool: mi300_1
      parallelism: 5
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 60
      artifact_paths:
        - "artifacts/amd-diffusion-cpu-shards/*.xml"
      # Buildkite's status-based rule cannot prove every exit 134 is a GPU hang.
      # It retries 134 once; the Kubernetes job retry starts a fresh pod.
      # Assertions (1), timeouts (124), and OOMs (137) remain non-retryable.
      retry:
        automatic:
          - exit_status: 134
            limit: 1
      commands:
        - export VLLM_ROCM_USE_AITER=0
        - export DIFFUSION_CPU_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/amd-diffusion-cpu-shards"
        - mkdir -p "$$DIFFUSION_CPU_ARTIFACT_DIR"
        # ignore test_teacache_extractors.py because it use rocm gemm kernel from vLLM
        # that is not supported on CPU
        # Keep multi-GPU tests out of this one-GPU pool even when their module
        # also carries the cpu marker for unit tests.
        # Keep π0.5 CPU units out of these shards: CUDA READY/MERGE already run
        # the same suite mandatorily, and AMD covers it non-blocking in nightly.
        - >-
          pytest -sv tests/diffusion
          -m 'core_model and cpu and not (cards_2 or cards_3 or cards_4 or cards_5 or cards_6 or cards_7 or cards_8)'
          --ignore=tests/diffusion/cache/test_teacache_extractors.py
          --ignore=tests/diffusion/models/pi05/test_pi05_units.py
          --deselect='tests/diffusion/distributed/test_wan_vae_fastpath_install.py::test_omni_wan_vae_decode_override_is_bitwise_exact[dtype0]'
          --deselect='tests/diffusion/distributed/test_wan_vae_fastpath_install.py::test_omni_wan_vae_decode_override_is_bitwise_exact[dtype1]'
          --deselect='tests/diffusion/distributed/test_wan_decoder_fast_path.py::test_sharded_fast_path_on_every_rank[True-exact]'
          --deselect='tests/diffusion/models/lingbot_world/test_pipeline_lingbot_world.py::test_condition_continues_real_causal_vae_beyond_initial_horizon[realtime]'
          --deselect='tests/diffusion/models/lingbot_world/test_pipeline_lingbot_world.py::test_condition_continues_real_causal_vae_beyond_initial_horizon[stepwise]'
          --deselect='tests/diffusion/models/lingbot_world/test_pipeline_lingbot_world.py::test_condition_encoder_stops_at_its_fixed_point_and_restarts_with_the_session'
          --num-shards=$$BUILDKITE_PARALLEL_JOB_COUNT
          --shard-id=$$BUILDKITE_PARALLEL_JOB
          --durations=50
          --junitxml="$$DIFFUSION_CPU_ARTIFACT_DIR/pytest-$${BUILDKITE_PARALLEL_JOB}-of-$${BUILDKITE_PARALLEL_JOB_COUNT}.xml"

    # Hash sharding put these six CPU cases on shard 2/5. Main builds 13600 and
    # 13615 spent about 15 and 23 minutes on them. A separate job keeps that
    # cost off the five-way critical path.
    - label: "Simple · Diffusion Slow CPU Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 40
      artifact_paths:
        - "artifacts/amd-diffusion-slow-cpu/pytest.xml"
      # Same exit-134 retry as the five-way shards. Buildkite cannot prove
      # every 134 is a GPU hang. Assertions (1), timeouts (124), and OOMs
      # (137) remain non-retryable.
      retry:
        automatic:
          - exit_status: 134
            limit: 1
      commands:
        - export VLLM_ROCM_USE_AITER=0
        - export DIFFUSION_SLOW_CPU_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/amd-diffusion-slow-cpu"
        - mkdir -p "$$DIFFUSION_SLOW_CPU_ARTIFACT_DIR"
        - >-
          pytest -sv
          'tests/diffusion/distributed/test_wan_vae_fastpath_install.py::test_omni_wan_vae_decode_override_is_bitwise_exact[dtype0]'
          'tests/diffusion/distributed/test_wan_vae_fastpath_install.py::test_omni_wan_vae_decode_override_is_bitwise_exact[dtype1]'
          'tests/diffusion/distributed/test_wan_decoder_fast_path.py::test_sharded_fast_path_on_every_rank[True-exact]'
          'tests/diffusion/models/lingbot_world/test_pipeline_lingbot_world.py::test_condition_continues_real_causal_vae_beyond_initial_horizon[realtime]'
          'tests/diffusion/models/lingbot_world/test_pipeline_lingbot_world.py::test_condition_continues_real_causal_vae_beyond_initial_horizon[stepwise]'
          'tests/diffusion/models/lingbot_world/test_pipeline_lingbot_world.py::test_condition_encoder_stops_at_its_fixed_point_and_restarts_with_the_session'
          -m 'core_model and cpu and not (cards_2 or cards_3 or cards_4 or cards_5 or cards_6 or cards_7 or cards_8)'
          --durations=20
          --junitxml="$$DIFFUSION_SLOW_CPU_ARTIFACT_DIR/pytest.xml"

    - label: "Diffusion · AuK VAE GPU Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 40
      commands:
        - export VLLM_ROCM_USE_AITER=0
        - >-
          timeout --signal=TERM --kill-after=2m 35m
          pytest -sv tests/diffusion/models/auk/test_auk_vae_fastpath.py
          -m 'core_model and rocm and cards_1' --run-level core_model

    - label: "Simple · Engine&Entrypoints Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_ROCM_USE_AITER=0
        - "pytest -sv tests/entrypoints tests/engine -m 'core_model and cpu'"

    - label: "Simple · Other Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_ROCM_USE_AITER=0
        # ignore test_teacache_extractors.py because it use rocm gemm kernel from vLLM
        # that is not supported on CPU
        - "pytest -sv tests/ -m 'core_model and cpu' --ignore=tests/diffusion --ignore=tests/model_executor --ignore=tests/entrypoints --ignore=tests/engine  --ignore=tests/diffusion/cache/test_teacache_extractors.py"

- label: "Custom Pipeline Test"
  agent_pool: mi300_1
  # FlashAttention stays soft-failed, so this step still runs when that job
  # misses. prepare restores its artifact only after the publisher exits 0.
  depends_on: amd-fa-aiter
  env:
    VLLM_OMNI_AITER_MHA_SAME_BUILD_STEP: amd-fa-aiter
  mirror_hardwares: [amdproduction]
  grade: Blocking
  commands:
    # Restore the unmasked BF16 AITER module into a job-local directory.
    # This consumer does not publish a duplicate artifact.
    - eval "$$(python .buildkite/amd/scripts/aiter_mha_cache.py prepare)"
    - pytest -s -v tests/e2e/features/custom_pipeline/ -m "core_model"


- label: "Voxtral TTS CUDA Unit Test"
  agent_pool: mi300_1
  depends_on: amd-build
  mirror_hardwares: [amdproduction]
  grade: Blocking
  commands:
    - timeout 10m pytest -s -v tests/model_executor/models/voxtral_tts/test_cuda_graph_acoustic_transformer.py

- group: ":card_index_dividers: Diffusion Test"
  steps:
    # Keep real FlashAttention execution out of the CPU-marked Simple lane.
    # Restore the unmasked BF16 AITER module into a job-local directory.
    # A miss, and the varlen module, still compile there. One pytest worker
    # lets Mammoth reuse that directory instead of compiling again.
    - label: "ROCm · FlashAttention/AITER GPU Coverage"
      key: amd-fa-aiter
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      timeout_in_minutes: 60
      commands:
        - export VLLM_ROCM_USE_AITER=1
        - export TORCH_EXTENSIONS_DIR="/tmp/vllm-omni-torch-extensions-$$BUILDKITE_JOB_ID"
        - mkdir -p "$$TORCH_EXTENSIONS_DIR"
        # Restore a provenance-checked Buildkite artifact into a job-local
        # directory. A miss still compiles there. Publish only when the
        # attention suite returns 0 so later READY/MERGE jobs can hit this ABI.
        - eval "$$(python .buildkite/amd/scripts/aiter_mha_cache.py prepare)"
        - |
          if timeout --signal=TERM --kill-after=2m 55m \
            pytest -s -v -n 1 \
            tests/diffusion/attention/ \
            -m 'core_model and rocm and MI325 and cards_1' \
            --run-level "core_model"; then
            python .buildkite/amd/scripts/aiter_mha_cache.py publish
          else
            pytest_status=$$?
            exit "$${pytest_status}"
          fi
        # MammothModa2 exercises the same two AITER MHA modules built by the
        # attention suite. Keep its default-backend run in this job so a cold
        # worker compiles each module once instead of timing out the generic
        # model job.
        - >-
          timeout --signal=TERM --kill-after=2m 10m
          pytest -s -v -n 1
          tests/diffusion/models/mammoth_moda2/test_dit_attention_cuda.py
          --run-level "core_model"

    # AR paged attention is real GPU work, including cold AITER compilation.
    # Keep its complete numerical matrix out of the CPU-marked Simple shards.
    - label: "ROCm · AR Diffusion Paged Attention GPU Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 25
      commands:
        - export VLLM_ROCM_USE_AITER=1
        - export VLLM_OMNI_AR_FA_REQUIRED=1
        - export AITER_JIT_DIR="/tmp/vllm-omni-ar-aiter-$$BUILDKITE_JOB_ID"
        - export TORCH_EXTENSIONS_DIR="/tmp/vllm-omni-ar-torch-extensions-$$BUILDKITE_JOB_ID"
        - mkdir -p "$$AITER_JIT_DIR" "$$TORCH_EXTENSIONS_DIR"
        - >-
          timeout --signal=TERM --kill-after=2m 15m
          pytest -sv tests/diffusion/ar_diffusion/test_paged_attention.py
          -m 'core_model and rocm and MI325 and cards_1' --run-level core_model
        # Keep the pinned-ring device contract blocking without making the
        # cold, experimental AITER coverage lane a required check.
        - >-
          timeout --signal=TERM --kill-after=1m 5m pytest -sv tests/diffusion/utils/test_chunked_transfer.py
          -m 'core_model and rocm and MI325 and cards_1' --run-level core_model

    - label: "Diffusion · Batch Test"
      agent_pool: mi300_1
      # Same soft-fail dependency as Custom Pipeline. The same-build restore
      # is limited to the publisher job that exited 0.
      depends_on: amd-fa-aiter
      env:
        VLLM_OMNI_AITER_MHA_SAME_BUILD_STEP: amd-fa-aiter
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        # Restore the unmasked BF16 AITER module into a job-local directory.
        # This consumer does not publish a duplicate artifact.
        - eval "$$(python .buildkite/amd/scripts/aiter_mha_cache.py prepare)"
        - pytest -sv tests/diffusion/batching -m 'core_model and rocm and MI325 and cards_1' --run-level "core_model"

    - label: "Diffusion · Offloader Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_LOGGING_LEVEL=DEBUG
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -s -v tests/diffusion/offloader -m "core_model and rocm and MI325 and cards_1" --run-level "core_model"

    - label: "Diffusion · Cache Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export GPU_ARCHS=gfx942
        - export VLLM_LOGGING_LEVEL=DEBUG
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - pytest -sv tests/diffusion/cache -m 'core_model and rocm and MI325 and cards_1' --run-level "core_model"

    - label: "Diffusion Sequence Parallelism Test"
      agent_pool: mi300_2
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_LOGGING_LEVEL=DEBUG
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - timeout 20m pytest -s -v tests/diffusion/distributed/test_sequence_parallel.py -m core_model
        - >-
          timeout 20m pytest -s -v
          tests/diffusion/attention/test_ulysses_uaa.py::test_ulysses_uaa_2d_mask_layout_matches_baseline
          -m 'core_model and cards_2'
          --run-level "core_model"
        - >-
          timeout 20m pytest -s -v
          tests/diffusion/models/ltx2/test_ltx2_transformer_ulysses.py
          -m 'core_model and rocm and cards_2'
          --run-level "core_model"

    - label: "ROCm · Ulysses UAA Attention · 2-GPU"
      agent_pool: mi300_2
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      timeout_in_minutes: 25
      commands:
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - >-
          timeout --signal=TERM --kill-after=2m 20m pytest -s -v
          tests/diffusion/attention/test_ulysses_uaa.py
          tests/diffusion/attention/test_attention_sp.py
          -m 'core_model and rocm and MI325 and cards_2'
          --run-level "core_model" --durations=20

    - label: "ROCm · Pause-Keep Two-Rank GPU Test"
      agent_pool: mi300_2
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      # The step is 40 minutes. The command leaves ten minutes for preflight.
      timeout_in_minutes: 40
      commands:
        - |
          timeout --signal=TERM --kill-after=1m 30m bash <<'PAUSE_KEEP_READY'
          set -euo pipefail
          # Cold AITER JIT can consume the default 600-second DLO wave budget
          # before the first execute_model returns. Keep AITER enabled while
          # leaving the 30-minute command as the outer bound.
          export VLLM_OMNI_DLO_DP_WAVE_TIMEOUT=900
          nodes=(
            "tests/diffusion/distributed/test_pause_keep_two_ranks.py::test_keep_pause_two_ranks_ack_and_rank_failure"
          )
          printf '%s\n' "$${nodes[@]}" | sort > /tmp/pause-keep-ready-expected.txt
          pytest -q tests/diffusion/distributed/test_pause_keep_two_ranks.py \
            -m "core_model and diffusion and rocm and MI325 and cards_2" \
            --run-level "core_model" \
            --collect-only \
            | sed -n 's/^\(tests\/.*::.*\)/\1/p' \
            | sort > /tmp/pause-keep-ready-collected.txt
          if ! diff -u /tmp/pause-keep-ready-expected.txt /tmp/pause-keep-ready-collected.txt; then
            echo "Pause-keep READY collection drifted from test_keep_pause_two_ranks_ack_and_rank_failure" >&2
            exit 1
          fi
          pytest -s -v tests/diffusion/distributed/test_pause_keep_two_ranks.py \
            -m "core_model and diffusion and rocm and MI325 and cards_2" \
            --run-level "core_model"
          PAUSE_KEEP_READY

    - label: "Diffusion GPU Worker Test"
      agent_pool: mi300_2
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - timeout 20m pytest -s -v tests/diffusion/test_diffusion_worker.py

    - label: "Diffusion · Model Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        # Build 14531 qualified this ROCm collection. Preserve legacy one-GPU
        # tests without cards_1 while excluding every registered multi-GPU
        # marker from this one-GPU job.
        # JoyImage's nonblocking nightly lane owns its cold AITER builds.
        # H3 VAE ops assume NVIDIA CUDA; ROCm sets torch.version.hip.
        - >-
          bash .buildkite/amd/scripts/assert-pytest-collection.sh 117
          tests/diffusion/models/
          --ignore=tests/diffusion/models/auk/test_auk_vae_fastpath.py
          --ignore=tests/diffusion/models/mammoth_moda2/test_dit_attention_cuda.py
          --ignore=tests/diffusion/models/joy_image/test_joy_image_gpu.py
          --ignore=tests/diffusion/models/minimax_h3/test_minimax_h3_vae_ops.py
          -m 'core_model and rocm and MI325 and not nvidia_only and not
          (cards_2 or cards_3 or cards_4 or cards_5 or cards_6 or cards_7 or cards_8)'
          --run-level "core_model"
        - >-
          timeout 15m pytest -sv tests/diffusion/models/
          --ignore=tests/diffusion/models/auk/test_auk_vae_fastpath.py
          --ignore=tests/diffusion/models/mammoth_moda2/test_dit_attention_cuda.py
          --ignore=tests/diffusion/models/joy_image/test_joy_image_gpu.py
          --ignore=tests/diffusion/models/minimax_h3/test_minimax_h3_vae_ops.py
          -m 'core_model and rocm and MI325 and not nvidia_only and not
          (cards_2 or cards_3 or cards_4 or cards_5 or cards_6 or cards_7 or cards_8)'
          --run-level "core_model"
        # Keep the model-specific numerical coverage blocking without paying
        # the default ROCm backend's cold AITER compilation cost in this lane.
        - >-
          timeout 10m env DIFFUSION_ATTENTION_BACKEND=TORCH_SDPA
          pytest -sv
          tests/diffusion/models/mammoth_moda2/test_dit_attention_cuda.py
          --run-level "core_model"

    - label: "Diffusion · Wan22 Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        # Both params use id "default". Pytest 9 suffixes them in source order:
        # default0 is the one-card CUDA/ROCm param, default1 is the NPU param.
        - |
          timeout 40m bash <<'WAN22_READY'
          set -euo pipefail
          export VLLM_TEST_CLEAN_GPU_MEMORY=1
          export VLLM_IMAGE_FETCH_TIMEOUT=60
          nodes=(
            "tests/e2e/online_serving/test_wan22_t2v.py::test_text_to_video_001[default0]"
          )
          printf '%s\n' "$${nodes[@]}" | sort > /tmp/wan22-ready-expected.txt
          pytest -q tests/e2e/online_serving/test_wan22_t2v.py \
            -m "core_model and diffusion and rocm and MI325 and cards_1" \
            --run-level "core_model" \
            --collect-only \
            | sed -n 's/^\(tests\/.*::.*\)/\1/p' \
            | sort > /tmp/wan22-ready-collected.txt
          if ! diff -u /tmp/wan22-ready-expected.txt /tmp/wan22-ready-collected.txt; then
            echo "Wan2.2 READY collection drifted from test_text_to_video_001[default0]" >&2
            exit 1
          fi
          pytest -s -v tests/e2e/online_serving/test_wan22_t2v.py \
            -m "core_model and diffusion and rocm and MI325 and cards_1" \
            --run-level "core_model"
          WAN22_READY

    - label: "ROCm · Diffusion Device-Reduction GPU Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      # The step is 20 minutes. The command leaves five minutes for preflight.
      timeout_in_minutes: 20
      commands:
        - |
          timeout --signal=TERM --kill-after=1m 15m bash <<'DEVICE_REDUCTION_READY'
          set -euo pipefail
          nodes=(
            "tests/diffusion/test_device_reduction.py::test_device_reduction_matches_a_float32_reference[dtype0]"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_matches_a_float32_reference[dtype1]"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_matches_a_float32_reference[dtype2]"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_deviates_from_a_narrow_postprocess_by_at_most_one[dtype0]"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_deviates_from_a_narrow_postprocess_by_at_most_one[dtype1]"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_shrinks_hop1_payload_4x"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_stays_on_device"
            "tests/diffusion/test_device_reduction.py::test_device_reduction_without_denormalize_matches_already_unit_range"
            "tests/diffusion/test_diffusion_engine.py::test_move_tensor_tree_moves_nested_cuda_tensors_to_cpu"
            "tests/diffusion/test_wan_device_reduction.py::test_wan_media_reduction_matches_float32_reference_and_bounds_native_path"
            "tests/diffusion/test_wan_device_reduction.py::test_wan_uint8_media_finalization_does_not_rescale"
            "tests/diffusion/test_wan_device_reduction.py::test_diffusion_output_to_cpu_moves_wan_media_off_device"
            "tests/diffusion/test_wan_device_reduction.py::test_small_typed_media_is_on_cpu_before_ipc"
            "tests/diffusion/test_wan_device_reduction.py::test_wan_float_media_finalization_matches_the_legacy_path"
            "tests/diffusion/test_wan_device_reduction.py::test_oom_fallback_media_packs_without_device_widening"
            "tests/diffusion/test_wan_device_reduction.py::test_oom_fallback_recovers_the_allocator"
            "tests/diffusion/test_wan_device_reduction.py::test_oom_fallback_releases_late_uint8_traceback_before_clone"
          )
          printf '%s\n' "$${nodes[@]}" | sort > /tmp/device-reduction-ready-expected.txt
          pytest -q \
            tests/diffusion/test_device_reduction.py \
            tests/diffusion/test_wan_device_reduction.py \
            tests/diffusion/test_diffusion_engine.py::test_move_tensor_tree_moves_nested_cuda_tensors_to_cpu \
            -m "core_model and diffusion and rocm and MI325 and cards_1" \
            --run-level "core_model" \
            --collect-only \
            | sed -n 's/^\(tests\/.*::.*\)/\1/p' \
            | sort > /tmp/device-reduction-ready-collected.txt
          if ! diff -u /tmp/device-reduction-ready-expected.txt /tmp/device-reduction-ready-collected.txt; then
            echo "Device-reduction READY collection drifted from the pinned GPU nodes" >&2
            exit 1
          fi
          pytest -s -v \
            tests/diffusion/test_device_reduction.py \
            tests/diffusion/test_wan_device_reduction.py \
            tests/diffusion/test_diffusion_engine.py::test_move_tensor_tree_moves_nested_cuda_tensors_to_cpu \
