- group: ":card_index_dividers: E2E Test"
  steps:
    - label: "ROCm · VeRL-Omni E2E Coverage"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: NonBlocking
      timeout_in_minutes: 30
      artifact_paths:
        - "artifacts/rocm-verl-omni-e2e/**/*"
      commands:
        - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-verl-omni-e2e"
        - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
        - python3 -m pip install --no-deps "ray==2.56.1" "omegaconf==2.3.0"
        - python3 -m pip show ray omegaconf > "$$ROCM_CI_ARTIFACT_DIR/dependencies.txt"
        - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
        - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
        - export ROCM_TEST_STARTED_EPOCH=$$(date +%s)
        - >-
          timeout --signal=TERM --kill-after=1m 20m
          pytest -s -v -ra
          tests/e2e/features/rlhf_test/test_verl_omni_e2e.py
          --durations=0
          --junitxml="$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
          2>&1 | tee "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
        - echo "runtime_seconds=$$(( $$(date +%s) - ROCM_TEST_STARTED_EPOCH ))" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
        - tail -n 100 "$$ROCM_CI_ARTIFACT_DIR/pytest.log" > "$$ROCM_CI_ARTIFACT_DIR/pytest-summary.txt"
        - >-
          python3 .buildkite/amd/scripts/rocm_ci_evidence.py pytest-result
          --xml "$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
          --log "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
          --output "$$ROCM_CI_ARTIFACT_DIR/pytest-result.txt"
        - >-
          python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup
          --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
          --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt"
          --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"

    - label: "Qwen3-TTS E2E Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      commands:
        - export VLLM_LOGGING_LEVEL=DEBUG
        - export VLLM_WORKER_MULTIPROC_METHOD=spawn
        - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
        - timeout 30m pytest -s -v tests/e2e/online_serving/test_qwen3_tts_customvoice.py -m "core_model" --run-level "core_model"

    - label: "CosyVoice3-TTS E2E Test"
      agent_pool: mi300_1
      depends_on: amd-build
      mirror_hardwares: [amdproduction]
      grade: Blocking
      # A ROCm hardware hang aborts the interpreter with 134. Let Buildkite
      # create one fresh pod instead of retrying on the poisoned GPU process.
      retry:
        automatic:
          - exit_status: 134
            limit: 1
      commands:
        - pytest -s -v tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py -m "slow" --run-level "core_model"

