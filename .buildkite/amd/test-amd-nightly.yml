# AMD MI300 `full_model` nightly coverage during burn-in.
# All jobs are non-blocking until the lane has stable runtime evidence.
# Historical build #11646 was red in Function Expansion and Accuracy (one
# async_chunk similarity mismatch; Seed-TTS WER 0.376480 > 0.35).

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  # MI325 is the repository's legacy ROCm pytest marker. The AMD template maps
  # agent_pool to the current MI300 Buildkite queues independently of that mark.
  - group: ":full_moon: Qwen3-Omni MI300 Nightly"
    steps:
      - label: "Qwen3-Omni Function Expansion"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni_expansion.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

      - label: "Qwen3-Omni Accuracy"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        artifact_paths:
          - tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json
        commands:
          - export SEED_TTS_WER_EVAL=1
          # PyTorch ROCm uses the torch.cuda device namespace.
          - export SEED_TTS_EVAL_DEVICE=cuda:1
          - pytest -s -v tests/e2e/accuracy/qwen3_omni/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"
          # Native tests run from the image copy under /app/vllm-omni, while
          # Buildkite's artifact hook searches the checkout workspace.
          - |
            if [[ "$$PWD" != "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}" ]]; then
              artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH}/tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc"
              mkdir -p "$$artifact_dir"
              cp -v tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json "$$artifact_dir/"
            fi

      - label: "Qwen3-Omni Documentation Examples"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/examples/online_serving/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

      - label: "Qwen3-Omni AITER-on Smoke"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        commands:
          - export VLLM_ROCM_USE_AITER=1
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni_expansion.py::test_text_to_text_audio_001 -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

  - group: ":microscope: Diffusion parity burn-in"
    steps:
      - label: "ROCm · Tiny Diffusion Multi-GPU · 2-GPU"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 40
        artifact_paths:
          - "artifacts/rocm-tiny-diffusion-2gpu/**/*"
        commands:
          - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-tiny-diffusion-2gpu"
          - export VLLM_OMNI_TEST_INIT_TIMEOUT=900
          - export VLLM_OMNI_TEST_STAGE_INIT_TIMEOUT=600
          - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
          - export ROCM_TEST_STARTED_EPOCH=$$(date +%s)
          - >-
            timeout --signal=TERM --kill-after=1m 30m
            pytest -s -v -ra
            tests/model_tests/diffusion/
            -m 'full_model and L4 and B200 and cuda and cards_2'
            --run-level "core_model"
            --durations=0
            --junitxml="$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
          - echo "runtime_seconds=$$(( $$(date +%s) - ROCM_TEST_STARTED_EPOCH ))" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - tail -n 100 "$$ROCM_CI_ARTIFACT_DIR/pytest.log" > "$$ROCM_CI_ARTIFACT_DIR/pytest-summary.txt"
          - >-
            python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup
            --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
            --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt"
            --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"

      - label: "ROCm · Tiny Diffusion Multi-GPU · 4-GPU"
        agent_pool: mi300_4
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 40
        artifact_paths:
          - "artifacts/rocm-tiny-diffusion-4gpu/**/*"
        commands:
          - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-tiny-diffusion-4gpu"
          - export VLLM_OMNI_TEST_INIT_TIMEOUT=900
          - export VLLM_OMNI_TEST_STAGE_INIT_TIMEOUT=600
          - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
          - export ROCM_TEST_STARTED_EPOCH=$$(date +%s)
          - >-
            timeout --signal=TERM --kill-after=1m 30m
            pytest -s -v -ra
            tests/model_tests/diffusion/
            -m 'full_model and L4 and B200 and cuda and cards_4'
            --run-level "core_model"
            --durations=0
            --junitxml="$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
          - echo "runtime_seconds=$$(( $$(date +%s) - ROCM_TEST_STARTED_EPOCH ))" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - tail -n 100 "$$ROCM_CI_ARTIFACT_DIR/pytest.log" > "$$ROCM_CI_ARTIFACT_DIR/pytest-summary.txt"
          - >-
            python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup
            --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
            --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt"
            --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"

      # Both CUDA quantization lanes map to MI300. L4 is a marker-defined
      # test subset, not a request for a lower-memory AMD architecture.
      - label: "ROCm · Diffusion Quantization · H100-class Scope"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 100
        artifact_paths:
          - "artifacts/rocm-diffusion-quant-h100/**/*"
        commands:
          - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-diffusion-quant-h100"
          - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
          # The quality gate compares BF16 and FP8 under the same attention
          # backend. Avoid first-use AITER JIT consuming Omni's 600-second
          # startup budget on ROCm and poisoning later cases in this shard.
          - export DIFFUSION_ATTENTION_BACKEND=TORCH_SDPA
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - echo "diffusion_attention_backend=$$DIFFUSION_ATTENTION_BACKEND" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
          - export ROCM_TEST_STARTED_EPOCH=$$(date +%s)
          - >-
            timeout --signal=TERM --kill-after=1m 90m
            pytest -s -v -ra
            tests/diffusion/quantization/
            -m 'full_model and cuda and H100 and B200 and cards_1'
            --run-level "full_model"
            --durations=0
            --junitxml="$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
          - echo "runtime_seconds=$$(( $$(date +%s) - ROCM_TEST_STARTED_EPOCH ))" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - tail -n 100 "$$ROCM_CI_ARTIFACT_DIR/pytest.log" > "$$ROCM_CI_ARTIFACT_DIR/pytest-summary.txt"
          - >-
            python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup
            --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
            --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt"
            --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"

      - label: "ROCm · Diffusion Quantization · Legacy L4 Scope"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 70
        artifact_paths:
          - "artifacts/rocm-diffusion-quant-l4/**/*"
        commands:
          - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-diffusion-quant-l4"
          - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
          - python3 -m pip install "vllm-gguf-plugin==0.0.4"
          - export ROCM_TEST_STARTED_EPOCH=$$(date +%s)
          - >-
            timeout --signal=TERM --kill-after=1m 60m
            pytest -s -v -ra
            tests/diffusion/quantization/
            -m 'full_model and cuda and L4 and B200 and cards_1'
            --run-level "full_model"
            --durations=0
            --junitxml="$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
          - echo "runtime_seconds=$$(( $$(date +%s) - ROCM_TEST_STARTED_EPOCH ))" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - tail -n 100 "$$ROCM_CI_ARTIFACT_DIR/pytest.log" > "$$ROCM_CI_ARTIFACT_DIR/pytest-summary.txt"
          - >-
            python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup
            --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
            --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt"
            --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"
