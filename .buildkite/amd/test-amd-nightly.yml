  # CUDA nightly "Diffusion · Offloader Test" selects this full_model node.
  # The ROCm mark is cards_1. The existing 512 MB savings check stays in the
  # test. The former quarantined MERGE leaf is removed, making this the sole
  # Stable Audio layerwise-offload owner on ROCm.
