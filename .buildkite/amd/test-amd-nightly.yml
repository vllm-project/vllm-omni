# AMD MI300 nightly coverage during burn-in, including cold-AITER GPU units.
# Promote individual jobs after reviewing runtime evidence; keep other jobs non-blocking.
# Historical build #11646 was red in Function Expansion and Accuracy (one
# async_chunk similarity mismatch; Seed-TTS WER 0.376480 > 0.35).

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: ":full_moon: Qwen3-TTS Base Expansion MI300 Nightly"
    steps:
      - label: "Qwen3-TTS Base Full-Model Expansion"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: tts_qwen3_tts_function
        env:
          VLLM_OMNI_FAILED_SPEECH_AUDIO_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-tts-base-expansion/failed-audio"
        artifact_paths:
          - artifacts/rocm-qwen3-tts-base-expansion/**/*
        commands:
          # Real weights; async/no-async streaming, seeded PCM, and cache reuse.
          # Preserve the existing audio validators and the deploy's ROCm V1 override.
          - bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh tests/e2e/online_serving/test_qwen3_tts_base_expansion.py 8 tts rocm-qwen3-tts-base-expansion

  - group: ":full_moon: Qwen3-TTS CustomVoice Expansion MI300 Nightly"
    steps:
      - label: "Qwen3-TTS CustomVoice Full-Model Expansion"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: tts_qwen3_tts_function
        env:
          VLLM_OMNI_FAILED_SPEECH_AUDIO_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-tts-customvoice-expansion/failed-audio"
        artifact_paths:
          - artifacts/rocm-qwen3-tts-customvoice-expansion/**/*
        commands:
          - bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh tests/e2e/online_serving/test_qwen3_tts_customvoice_expansion.py 10 tts rocm-qwen3-tts-customvoice-expansion

  - group: ":full_moon: Wan2.2 Backend Similarity MI300 Nightly"
    steps:
      - label: "Wan2.2 Diffusers Backend Similarity"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: diffusion_wan22_accuracy
        env:
          DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
        artifact_paths:
          - artifacts/rocm-wan22-backend-similarity/**/*
        commands:
          - |
            # ROCm similarity gates stay active; latency is recorded for future
            # per-GPU calibration, without borrowing H100/B200 allowances.
            if bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh \
              tests/e2e/accuracy/test_diffusers_backend_similarity.py::test_diffusers_backend_i2v_matches_diffusers \
              1 diffusion rocm-wan22-backend-similarity; then
              status=0
            else
              status=$$?
            fi
            source_dir=tests/e2e/accuracy/artifacts/Wan2_2-I2V-A14B-Diffusers-diffusers-backend
            artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-wan22-backend-similarity/accuracy"
            if [[ -d "$$source_dir" ]]; then
              mkdir -p "$$artifact_dir"
              cp -a "$$source_dir/." "$$artifact_dir/"
            fi
            if [[ "$$status" -eq 0 ]]; then
              for artifact in vllm_omni.mp4 diffusers.mp4 metrics.json ssim.txt psnr.txt; do
                if [[ ! -s "$$artifact_dir/$$artifact" ]]; then
                  echo "Missing Wan2.2 comparison artifact: $$artifact" >&2
                  status=5
                fi
              done
            fi
            (exit "$$status")

  # Full weights and existing response validators. ROCm uses the legacy V1
  # path (the deploy default); these jobs do not qualify the CUDA MRV2 path.
  - group: ":full_moon: MiniCPM-o Full-Model Modalities MI300 Nightly"
    steps:
      - label: "MiniCPM-o Offline Full-Model Modalities"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: omni_minicpmo_4_5_function
        artifact_paths:
          - artifacts/rocm-minicpmo-offline-modalities/**/*
        commands:
          - bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh tests/e2e/offline_inference/test_minicpmo_4_5.py 5 omni rocm-minicpmo-offline-modalities

      - label: "MiniCPM-o Online Full-Model Modalities"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: omni_minicpmo_4_5_function
        artifact_paths:
          - artifacts/rocm-minicpmo-online-modalities/**/*
        commands:
          - bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh tests/e2e/online_serving/test_minicpmo_4_5.py 5 omni rocm-minicpmo-online-modalities

  # One-card Omni cases from the CUDA "Omni · Function Test with H100 · Single-GPU"
  # selection that no AMD job ran: Qwen3-Omni colocate async (2), MiniCPM-o 4.5
  # expansion (10) and JoyAI-VL visual duplex (1). Non-blocking until burn-in.
  - group: ":full_moon: Omni Full-Model Additions MI300 Nightly"
    steps:
      - label: "Omni Full-Model Additions · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 150
        source_file_dependencies:
          - omni_qwen3_omni_function
          - omni_minicpmo_4_5_function
          - omni_joyai_duplex_function
        retry:
          automatic:
            - exit_status: 134
              limit: 1
        env:
          ROCM_E2E_TIMEOUT_MINUTES: "135"
        artifact_paths:
          - artifacts/rocm-omni-full-model-additions/**/*
        commands:
          - >-
            bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh
            tests/e2e/offline_inference/test_qwen3_omni_colocate_async.py
            13 omni rocm-omni-full-model-additions
            tests/e2e/online_serving/test_minicpmo_4_5_expansion.py
            tests/e2e/online_serving/test_joyai_vl_interaction.py

  # MI325 is the repository's legacy ROCm pytest marker. The AMD template maps
  # agent_pool to the current MI300 Buildkite queues independently of that mark.
  - group: ":full_moon: Qwen3-Omni MI300 Nightly"
    steps:
      - label: "Qwen3-Omni Function Expansion"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_qwen3_omni_function
        env:
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
          PYTHONFAULTHANDLER: "1"
          QWEN3_OMNI_ARTIFACT_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-function-expansion"
          VLLM_OMNI_FAILED_SPEECH_AUDIO_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-function-expansion/failed-audio"
          QWEN3_OMNI_EXPECTED_GPUS: "2"
          QWEN3_OMNI_EXPECTED_RESULTS: "0"
          QWEN3_OMNI_EXPECTED_TESTS: "28"
          QWEN3_OMNI_MARK_EXPRESSION: "full_model and rocm and MI325 and cards_2"
          QWEN3_OMNI_TEST_TARGET: tests/e2e/online_serving/test_qwen3_omni_expansion.py
          QWEN3_OMNI_TIMEOUT: 165m
        artifact_paths:
          - artifacts/rocm-qwen3-omni-function-expansion/**/*
        commands:
          - bash .buildkite/amd/scripts/run-qwen3-omni-rocm-nightly.sh

      - label: "Qwen3-Omni Accuracy"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 180
        source_file_dependencies: [omni_qwen3_omni_accuracy, ci_rocm]
        artifact_paths:
          - artifacts/rocm-qwen3-omni-accuracy/**/*
          - tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json
        commands:
          - export SEED_TTS_WER_EVAL=1
          # PyTorch ROCm uses the torch.cuda device namespace.
          - export SEED_TTS_EVAL_DEVICE=cuda:1
          - |
            bash <<'RUN_QWEN3_ACCURACY'
            set -euo pipefail
            export ROCM_QWEN3_ACCURACY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-accuracy"
            mkdir -p "$$ROCM_QWEN3_ACCURACY_ARTIFACT_DIR"
            export ROCM_QWEN3_ACCURACY_COLLECTED="$$(pytest -q tests/e2e/accuracy/qwen3_omni/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model" --collect-only 2>/dev/null | grep -c '::' || true)"
            timeout --signal=TERM --kill-after=2m 165m pytest -s -v tests/e2e/accuracy/qwen3_omni/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model" --junitxml="$$ROCM_QWEN3_ACCURACY_ARTIFACT_DIR/pytest.xml"
            python -c 'import os, sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            if root.tag not in {"testsuite", "testsuites"}:
                raise SystemExit("Unexpected JUnit root")
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            failures = sum(int(suite.attrib.get("failures", "0")) for suite in suites)
            errors = sum(int(suite.attrib.get("errors", "0")) for suite in suites)
            collected = int(os.environ.get("ROCM_QWEN3_ACCURACY_COLLECTED", "0") or 0)
            if collected <= 0 or tests != collected or skipped != 0 or failures != 0 or errors != 0:
                print("Expected every collected Qwen3-Omni accuracy test to run and pass: "
                      f"collected={collected}, tests={tests}, skipped={skipped}, "
                      f"failures={failures}, errors={errors}", file=sys.stderr)
                raise SystemExit(5)
            ' "$$ROCM_QWEN3_ACCURACY_ARTIFACT_DIR/pytest.xml"
            RUN_QWEN3_ACCURACY
          # Native tests run from the image copy under /app/vllm-omni, while
          # Buildkite's artifact hook searches the checkout workspace.
          - |
            if [[ "$$PWD" != "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}" ]]; then
              artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH}/tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc"
              mkdir -p "$$artifact_dir"
              cp -v tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json "$$artifact_dir/"
            fi

      - label: "Qwen3-Omni Documentation Examples"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: omni_qwen3_omni_doc
        artifact_paths:
          - artifacts/rocm-qwen3-omni-doc/**/*
          - qwen3-omni-doc-artifacts/**/*
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - |
            bash <<'RUN_QWEN3_DOC'
            set -euo pipefail
            export ROCM_QWEN3_DOC_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-doc"
            mkdir -p "$$ROCM_QWEN3_DOC_ARTIFACT_DIR"
            timeout --signal=TERM --kill-after=2m 105m pytest -s -v tests/examples/online_serving/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model" --junitxml="$$ROCM_QWEN3_DOC_ARTIFACT_DIR/pytest.xml"
            python -c 'import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            if root.tag not in {"testsuite", "testsuites"}:
                raise SystemExit("Unexpected JUnit root")
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            failures = sum(int(suite.attrib.get("failures", "0")) for suite in suites)
            errors = sum(int(suite.attrib.get("errors", "0")) for suite in suites)
            if tests != 7 or skipped != 0 or failures != 0 or errors != 0:
                print("Expected exactly 7 executed Qwen3-Omni documentation tests; "
                      f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}", file=sys.stderr)
                raise SystemExit(5)
            ' "$$ROCM_QWEN3_DOC_ARTIFACT_DIR/pytest.xml"
            RUN_QWEN3_DOC

      - label: "Qwen3-Omni AITER-on Smoke"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 90
        source_file_dependencies: [omni_qwen3_omni_function, rocm_diffusion_nightly_runner]
        artifact_paths:
          - artifacts/rocm-qwen3-omni-aiter-smoke/**/*
        env:
          QWEN3_OMNI_EXPECT_AITER_MM_ENCODER: "1"
        commands:
          - export VLLM_ROCM_USE_AITER=1
          - >-
            bash .buildkite/amd/scripts/run-rocm-diffusion-nightly.sh
            2 3 75m rocm-qwen3-omni-aiter-smoke
            'tests/e2e/online_serving/test_qwen3_omni_expansion.py::test_text_to_text_audio_001[default]'
            'tests/e2e/online_serving/test_qwen3_omni_expansion.py::test_text_to_text_audio_001[async_chunk]'
            'tests/e2e/online_serving/test_qwen3_omni_expansion.py::test_text_to_text_audio_001[batch_token_2048]'
            -m 'full_model and rocm and MI325 and cards_2'

  - group: ":full_moon: Qwen3-Omni Scale and Performance MI300 Nightly"
    steps:
      - label: "Qwen3-Omni Multi-Replica Correctness"
        agent_pool: mi300_4
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_qwen3_omni_function
        env:
          QWEN3_OMNI_ARTIFACT_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-multi-replica-correctness"
          QWEN3_OMNI_EXPECTED_GPUS: "4"
          QWEN3_OMNI_EXPECTED_RESULTS: "0"
          QWEN3_OMNI_EXPECTED_TESTS: "3"
          QWEN3_OMNI_MARK_EXPRESSION: "full_model and omni and rocm and MI325 and cards_4"
          QWEN3_OMNI_TEST_TARGET: tests/e2e/online_serving/test_qwen3_omni_multi_replicas.py
          QWEN3_OMNI_TIMEOUT: 165m
        artifact_paths:
          - artifacts/rocm-qwen3-omni-multi-replica-correctness/**/*
        commands:
          - bash .buildkite/amd/scripts/run-qwen3-omni-rocm-nightly.sh

      - label: "Qwen3-Omni No-Async-Chunk Perf"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 300
        source_file_dependencies: [omni_qwen3_omni_perf, ci_rocm]
        env:
          # Avoid solver searches on new codec shapes and oversized host pools.
          MIOPEN_FIND_MODE: "FAST"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          QWEN3_OMNI_REQUIRE_BASELINE: "1"
          QWEN3_OMNI_ARTIFACT_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-no-async-chunk-perf"
          QWEN3_OMNI_CONFIG_FILE: tests/dfx/perf/tests/test_qwen3_omni_no_async_chunk.json
          QWEN3_OMNI_EXPECTED_GPUS: "2"
          QWEN3_OMNI_EXPECTED_RESULTS: "8"
          QWEN3_OMNI_EXPECTED_TESTS: "4"
          QWEN3_OMNI_MARK_EXPRESSION: "full_model and omni and rocm and MI325 and cards_2"
          QWEN3_OMNI_TEST_TARGET: tests/dfx/perf/scripts/run_benchmark.py
          QWEN3_OMNI_TIMEOUT: 285m
        artifact_paths:
          - artifacts/rocm-qwen3-omni-no-async-chunk-perf/**/*
        commands:
          - bash .buildkite/amd/scripts/run-qwen3-omni-rocm-nightly.sh

      - label: "Qwen3-Omni Async-Chunk Perf"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: [omni_qwen3_omni_perf, ci_rocm]
        env:
          MIOPEN_FIND_MODE: "FAST"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          QWEN3_OMNI_REQUIRE_BASELINE: "1"
          QWEN3_OMNI_ARTIFACT_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-async-chunk-perf"
          QWEN3_OMNI_CONFIG_FILE: tests/dfx/perf/tests/test_qwen3_omni_async_chunk.json
          QWEN3_OMNI_EXPECTED_GPUS: "2"
          QWEN3_OMNI_EXPECTED_RESULTS: "6"
          QWEN3_OMNI_EXPECTED_TESTS: "6"
          QWEN3_OMNI_MARK_EXPRESSION: "full_model and omni and rocm and MI325 and cards_2"
          QWEN3_OMNI_TEST_TARGET: tests/dfx/perf/scripts/run_benchmark.py
          QWEN3_OMNI_TIMEOUT: 165m
        artifact_paths:
          - artifacts/rocm-qwen3-omni-async-chunk-perf/**/*
        commands:
          - bash .buildkite/amd/scripts/run-qwen3-omni-rocm-nightly.sh

  - group: ":speaker: CosyVoice3 MI300 Nightly"
    steps:
      # Exercise all sync/async and Chinese/English cases with the platform's
      # default attention backend. On ROCm this retains end-to-end AITER
      # coverage without putting its cold JIT build on the READY critical path.
      - label: "CosyVoice3-TTS E2E Test"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 90
        source_file_dependencies: tts_cosyvoice3_function
        retry:
          automatic:
            - exit_status: 134
              limit: 1
        env:
          ROCM_E2E_LEVEL_MARKER: slow
          ROCM_E2E_RUN_LEVEL: core_model
          ROCM_E2E_TIMEOUT_MINUTES: "75"
        artifact_paths:
          - artifacts/rocm-cosyvoice3-e2e-nightly/**/*
        commands:
          - >-
            bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh
            tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py
            3 tts rocm-cosyvoice3-e2e-nightly

  # One-card TTS cases from the CUDA "TTS · Function Test with L4" selection that
  # no AMD job ran: YuE2 offline example (2), Chatterbox encoded audio (4) and
  # CosyVoice3 voice isolation (7). Non-blocking until burn-in.
  - group: ":speaker: TTS Full-Model Additions MI300 Nightly"
    steps:
      - label: "TTS Full-Model Additions · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 150
        source_file_dependencies:
          - tts_yue2_function
          - tts_chatterbox_function
          - tts_cosyvoice3_voice_isolation
        retry:
          automatic:
            - exit_status: 134
              limit: 1
        env:
          VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
          ROCM_E2E_TIMEOUT_MINUTES: "135"
          # The voice-isolation speaker embedders score on CPU. Cap BLAS/OpenMP
          # at the pod's four-CPU quota (as the READY CPU suites do): with the
          # host-visible 96 threads, scoring that takes 0.5 min on CUDA ran for
          # over 40 min in AMD build 17564.
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "4"
          NUMEXPR_NUM_THREADS: "4"
        artifact_paths:
          - artifacts/rocm-tts-full-model-additions/**/*
        commands:
          # CosyVoice3's code2wav stage otherwise cold-compiles the unmasked BF16
          # AITER MHA module on its first request: 1580 s in AMD build 17564,
          # long enough for the voice-isolation requests to hit their 600 s
          # timeout twice. Restore the provenance-checked module instead.
          - eval "$$(python .buildkite/amd/scripts/aiter_mha_cache.py prepare)"
          - >-
            bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh
            tests/e2e/offline_inference/test_yue2.py
            13 tts rocm-tts-full-model-additions
            tests/e2e/online_serving/test_chatterbox_expansion.py
            tests/e2e/online_serving/test_cosyvoice3_voice_isolation.py

  # π0.5 CPU units are mandatory on CUDA READY/MERGE. On AMD they exercise the
  # ROCm container/import path with CPU tensors only, so keep them off the
  # READY/MERGE critical path while making their nightly regression gate blocking.
  - group: ":robot_face: Pi0.5 CPU Nightly"
    steps:
      - label: "Simple · Pi0.5 CPU Test"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 60
        source_file_dependencies: diffusion_pi05_unit
        artifact_paths:
          - artifacts/pi05-cpu/*.xml
        commands:
          - export PI05_CPU_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/pi05-cpu"
          - mkdir -p "$$PI05_CPU_ARTIFACT_DIR"
          - export VLLM_ROCM_USE_AITER=0
          # The collection count is taken in this job instead of hardcoded: a
          # test added next to an existing one otherwise fails the job with
          # every test passing, which is what happened when #8086 added a Pi0.5
          # unit test and this step still expected 103.
          - export PI05_CPU_COLLECTED="$$(pytest -q tests/diffusion/models/pi05/test_pi05_units.py -m 'core_model and cpu' --collect-only 2>/dev/null | grep -c '::' || true)"
          - |
            pytest -sv tests/diffusion/models/pi05/test_pi05_units.py -m 'core_model and cpu' --junitxml="$$PI05_CPU_ARTIFACT_DIR/pytest.xml"
            python -c 'import os, sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            if root.tag not in {"testsuite", "testsuites"}:
                raise SystemExit("Unexpected JUnit root")
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            failures = sum(int(suite.attrib.get("failures", "0")) for suite in suites)
            errors = sum(int(suite.attrib.get("errors", "0")) for suite in suites)
            collected = int(os.environ.get("PI05_CPU_COLLECTED", "0") or 0)
            if collected <= 0 or tests != collected or skipped != 0 or failures != 0 or errors != 0:
                print("Expected every collected Pi0.5 CPU test to run and pass: "
                      f"collected={collected}, tests={tests}, skipped={skipped}, "
                      f"failures={failures}, errors={errors}", file=sys.stderr)
                raise SystemExit(5)
            ' "$$PI05_CPU_ARTIFACT_DIR/pytest.xml"

  # READY/MERGE retain a two-repository smoke for the ROCm-only local
