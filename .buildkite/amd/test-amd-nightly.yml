  - group: ":full_moon: MiniCPM-o 4.5 Accuracy MI300 Nightly"
    steps:
      # The combined Daily-Omni + Seed-TTS job repeatedly exhausted its 165m
      # command bound during the evaluation tail. Keep independent bounded jobs
      # so one accuracy lane cannot consume the other's execution budget.
      - label: "MiniCPM-o 4.5 Daily-Omni Accuracy"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_minicpmo_4_5_accuracy
        env:
          ROCM_E2E_TIMEOUT_MINUTES: "165"
          ACC_BENCH_RESULT_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-minicpmo-daily-omni-accuracy/results"
        artifact_paths:
          - artifacts/rocm-minicpmo-daily-omni-accuracy/**/*
        commands:
          - mkdir -p "$$ACC_BENCH_RESULT_DIR"
          - rm -f "$${ACC_BENCH_RESULT_DIR:?}"/result_acc_*_daily_omni_*.json
          - >-
            bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh
            tests/e2e/accuracy/minicpmo_4_5/test_minicpmo_4_5.py::test_minicpmo_4_5_daily_omni_accuracy_bench
            1 omni rocm-minicpmo-daily-omni-accuracy
          - |
            python3 - "$$ACC_BENCH_RESULT_DIR" <<'PY'
            import json
            import sys
            from pathlib import Path

            results = list(Path(sys.argv[1]).glob("result_acc_*_daily_omni_*.json"))
            if len(results) != 1:
                raise SystemExit(f"Expected one Daily-Omni result, found {len(results)}")
            result = json.loads(results[0].read_text())
            expected = {"daily_omni_evaluated_ok": 1197, "daily_omni_no_gold": 0, "daily_omni_request_failed": 0}
            for key, value in expected.items():
                if result.get(key) != value:
                    raise SystemExit(f"Expected {key}={value}, got {result.get(key)!r}")
            PY

      - label: "MiniCPM-o 4.5 Seed-TTS Accuracy"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_minicpmo_4_5_accuracy
        env:
          ROCM_E2E_TIMEOUT_MINUTES: "165"
          SEED_TTS_WER_EVAL: "1"
          SEED_TTS_SIM_EVAL: "1"
          VLLM_OMNI_CODE2WAV_WATCHDOG_TIMEOUT_S: "60"
        artifact_paths:
          - artifacts/rocm-minicpmo-seed-tts-accuracy/**/*
        commands:
          - |
            if bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh \
              tests/e2e/accuracy/minicpmo_4_5/test_minicpmo_4_5.py::test_minicpmo_4_5_seed_tts_wer_bench \
              1 omni rocm-minicpmo-seed-tts-accuracy; then
              status=0
            else
              status=$$?
            fi
            if [[ -d tests/e2e/accuracy/minicpmo_4_5/results ]]; then
              artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-minicpmo-seed-tts-accuracy"
              mkdir -p "$$artifact_dir/results"
              cp -a tests/e2e/accuracy/minicpmo_4_5/results/. "$$artifact_dir/results/"
            fi
            exit "$$status"

