            if [[ -d tests/dfx/perf/results ]]; then
              mkdir -p "$$ROCM_OMNI_DUPLEX_EVAL_ARTIFACT_DIR/perf"
              cp -a tests/dfx/perf/results/. "$$ROCM_OMNI_DUPLEX_EVAL_ARTIFACT_DIR/perf/"
            fi

            exit "$$status"
