              tests/e2e/accuracy/minimax_h3/test_minimax_h3_i2va_ref2va_similarity.py::test_minimax_h3_i2va_matches_official_reference \
              tests/e2e/accuracy/minimax_h3/test_minimax_h3_i2va_ref2va_similarity.py::test_minimax_h3_ref2va_matches_official_reference \
              -m "full_model and diffusion and rocm and MI325 and cards_4"; then
              status=0
            else
              status=$$?
            fi
            if [[ -d tests/e2e/accuracy/artifacts ]]; then
              artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-minimax-h3-i2va"
              mkdir -p "$$artifact_dir/accuracy"
