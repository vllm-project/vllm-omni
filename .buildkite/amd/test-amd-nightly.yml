# AMD MI300 nightly coverage during burn-in, including cold-AITER GPU units.
# All jobs are non-blocking until the lane has stable runtime evidence.
# Historical build #11646 was red in Function Expansion and Accuracy (one
# async_chunk similarity mismatch; Seed-TTS WER 0.376480 > 0.35).

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  # MI325 is the repository's legacy ROCm pytest marker. The AMD template maps
  # agent_pool to the current MI300 Buildkite queues independently of that mark.
  - group: ":full_moon: Qwen3-Omni MI300 Nightly"
    steps:
      - label: "Qwen3-Omni Function Expansion"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni_expansion.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

      - label: "Qwen3-Omni Accuracy"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        artifact_paths:
          - tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json
        commands:
          - export SEED_TTS_WER_EVAL=1
          # PyTorch ROCm uses the torch.cuda device namespace.
          - export SEED_TTS_EVAL_DEVICE=cuda:1
          - pytest -s -v tests/e2e/accuracy/qwen3_omni/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"
          # Native tests run from the image copy under /app/vllm-omni, while
          # Buildkite's artifact hook searches the checkout workspace.
          - |
            if [[ "$$PWD" != "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}" ]]; then
              artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH}/tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc"
              mkdir -p "$$artifact_dir"
              cp -v tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json "$$artifact_dir/"
            fi

      - label: "Qwen3-Omni Documentation Examples"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/examples/online_serving/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

      - label: "Qwen3-Omni AITER-on Smoke"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        commands:
          - export VLLM_ROCM_USE_AITER=1
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni_expansion.py::test_text_to_text_audio_001 -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

  - group: ":speaker: CosyVoice3 MI300 Nightly"
    steps:
      # Exercise all sync/async and Chinese/English cases with the platform's
      # default attention backend. On ROCm this retains end-to-end AITER
      # coverage without putting its cold JIT build on the READY critical path.
      - label: "CosyVoice3-TTS E2E Test"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        retry:
          automatic:
            - exit_status: 134
              limit: 1
        commands:
          - pytest -s -v tests/e2e/online_serving/test_cosyvoice3_tts_expansion.py -m "slow" --run-level "core_model"

  - group: ":full_moon: CosyVoice3 Offline MI300 Nightly"
    steps:
      - label: "CosyVoice3 Offline Zero-shot Smoke"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        retry:
          automatic:
            - exit_status: 134
              limit: 1
        artifact_paths:
          - artifacts/rocm-cosyvoice3-offline-nightly/**/*
        commands:
          - pytest --collect-only -q tests/e2e/offline_inference/test_cosyvoice3_expansion.py -m "slow and tts and rocm and MI325 and cards_1" --run-level full_model
          - pytest -s -v tests/e2e/offline_inference/test_cosyvoice3_expansion.py -m "slow and tts and rocm and MI325 and cards_1" --run-level full_model --junitxml=/tmp/cosyvoice3-offline-pytest.xml
          - |
            artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-cosyvoice3-offline-nightly"
            mkdir -p "$$artifact_dir"
            cp -v /tmp/cosyvoice3-offline-pytest.xml "$$artifact_dir/"

  - group: ":full_moon: JoyImage MI300 Nightly"
    steps:
      # Dense AITER compilation alone took 23m on cold workers; masked varlen
      # compilation then exceeded the former 25m READY/MERGE command budget.
      # Retain the complete default-backend GPU inference suite here, while
      # CPU units and CUDA GPU coverage stay on their existing blocking routes.
      # The 80m command budget is provisional until a full cold run completes.
      # Revisit blocking AMD coverage once exact-module prebuilds or measured
      # cold runtimes make its budget reliable.
      - label: "Diffusion · JoyImage GPU Inference Test"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        artifact_paths:
          - "artifacts/joy-image-gpu/*.xml"
        commands:
          - export VLLM_ROCM_USE_AITER=1
          - export AITER_JIT_DIR="/tmp/vllm-omni-joy-aiter-$$BUILDKITE_JOB_ID"
          - export TORCH_EXTENSIONS_DIR="/tmp/vllm-omni-joy-torch-$$BUILDKITE_JOB_ID"
          - export JOY_GPU_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/joy-image-gpu"
          - mkdir -p "$$AITER_JIT_DIR" "$$TORCH_EXTENSIONS_DIR" "$$JOY_GPU_ARTIFACT_DIR"
          - >-
            timeout --signal=TERM --kill-after=2m 80m
            pytest -sv tests/diffusion/models/joy_image/test_joy_image_gpu.py
            -m 'core_model and rocm and MI325 and cards_1' --run-level core_model
            --durations=20 --junitxml="$$JOY_GPU_ARTIFACT_DIR/pytest.xml"

  # π0.5 CPU units are mandatory on CUDA READY/MERGE. On AMD they exercise the
  # ROCm container/import path with CPU tensors only, so keep them off the
  # blocking READY/MERGE critical path and retain non-blocking nightly coverage.
  - group: ":robot_face: Pi0.5 CPU Nightly"
    steps:
      - label: "Simple · Pi0.5 CPU Test"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 60
        commands:
          - export VLLM_ROCM_USE_AITER=0
          - "pytest -sv tests/diffusion/models/pi05/test_pi05_units.py -m 'core_model and cpu'"

  # READY/MERGE retain a two-repository smoke for the ROCm-only local
  # metadata-snapshot path. Run the complete 12-case, 32-batch correctness
  # matrix here with timing artifacts so it does not dominate the PR gate.
  - group: ":robot_face: Omni Processor Nightly"
    steps:
      - label: "Simple · Omni Processor Test"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 60
        env:
          VLLM_OMNI_AMD_PROCESSOR_TIMING: "1"
        artifact_paths:
          - "artifacts/omni-processor/**/*"
        commands:
          - export VLLM_ROCM_USE_AITER=0
          - bash .buildkite/amd/scripts/run-omni-processor-test.sh

  # AMD builds #13509 and #13511 measured the four long-running oracle cases
  # at about 57-84 minutes total. Keep enough budget for the slower observation,
  # collection, and artifact finalization while running the stress cases serially.
  - group: ":performing_arts: PersonaPlex CPU Nightly"
    steps:
      - label: "Simple · PersonaPlex Temporal Streaming Test"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        artifact_paths:
          - "artifacts/personaplex-temporal-streaming/**/*"
        commands:
          - export VLLM_ROCM_USE_AITER=0
          - export PERSONAPLEX_TEMPORAL_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/personaplex-temporal-streaming"
          - mkdir -p "$$PERSONAPLEX_TEMPORAL_ARTIFACT_DIR"
          - >-
            pytest --collect-only -q
            tests/model_executor/models/personaplex/test_temporal_streaming_hoist.py::test_mimi_streaming_step_matches_legacy_end_to_end
            2>&1 | tee "$$PERSONAPLEX_TEMPORAL_ARTIFACT_DIR/collection.txt"
          - >-
            timeout --signal=TERM --kill-after=2m 110m
            pytest -s -v -ra
            tests/model_executor/models/personaplex/test_temporal_streaming_hoist.py::test_mimi_streaming_step_matches_legacy_end_to_end
            --durations=50
            --junitxml="$$PERSONAPLEX_TEMPORAL_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$PERSONAPLEX_TEMPORAL_ARTIFACT_DIR/pytest.log"
          - >-
            tail -n 100 "$$PERSONAPLEX_TEMPORAL_ARTIFACT_DIR/pytest.log" >
            "$$PERSONAPLEX_TEMPORAL_ARTIFACT_DIR/pytest-summary.txt"

  - group: ":full_moon: LingBot-Video MI300 Nightly"
    steps:
      - label: "LingBot-Video Dense CFG-off Smoke"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        artifact_paths:
          - artifacts/rocm-lingbot-nightly/**/*
        commands:
          - pytest --collect-only -q tests/e2e/online_serving/test_lingbot_video_expansion.py::test_cfg_off -m "full_model and diffusion and rocm and MI325 and cards_1" --run-level full_model
          - pytest -s -v tests/e2e/online_serving/test_lingbot_video_expansion.py::test_cfg_off -m "full_model and diffusion and rocm and MI325 and cards_1" --run-level full_model --junitxml=/tmp/lingbot-pytest.xml
          - |
            artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-lingbot-nightly"
            mkdir -p "$$artifact_dir"
            cp -v /tmp/lingbot-pytest.xml "$$artifact_dir/"

  - group: ":full_moon: HunyuanVideo-1.5 MI300 Nightly"
    steps:
      - label: "HunyuanVideo-1.5 Default T2V Smoke"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        env:
          DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
        artifact_paths:
          - artifacts/rocm-hunyuanvideo15-nightly/**/*
        commands:
          - pytest --collect-only -q 'tests/e2e/online_serving/test_hunyuan_video_15_expansion.py::test_hunyuan_video_15_t2v_default[default]' -m "full_model and diffusion and rocm and MI325 and cards_1" --run-level full_model
          - pytest -s -v 'tests/e2e/online_serving/test_hunyuan_video_15_expansion.py::test_hunyuan_video_15_t2v_default[default]' -m "full_model and diffusion and rocm and MI325 and cards_1" --run-level full_model --junitxml=/tmp/hunyuanvideo15-pytest.xml
          - |
            artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-hunyuanvideo15-nightly"
            mkdir -p "$$artifact_dir"
            cp -v /tmp/hunyuanvideo15-pytest.xml "$$artifact_dir/"

  - group: ":full_moon: MiniMax-H3 MI300 Nightly"
    steps:
      - label: "MiniMax-H3 Official T2VA Smoke"
        agent_pool: mi300_4
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        artifact_paths:
          - artifacts/rocm-minimax-h3-nightly/**/*
        commands:
          - export VLLM_ROCM_USE_AITER=1
          - export DIFFUSION_ATTENTION_BACKEND=FLASH_ATTN
          - export MINIMAX_H3_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-minimax-h3-nightly"
          - mkdir -p "$$MINIMAX_H3_ARTIFACT_DIR"
          - |
            {
              echo "commit=$$(git rev-parse HEAD)"
              echo "hf_home=$${HF_HOME:-unset}"
              echo "--- rocm-smi"
              rocm-smi
              echo "--- rocminfo"
              rocminfo
              echo "--- PyTorch"
              python -c 'import torch; print(f"torch={torch.__version__}"); print(f"hip={torch.version.hip}"); print(f"gpus={torch.cuda.device_count()}"); [print(f"gpu[{index}]={torch.cuda.get_device_name(index)}") for index in range(torch.cuda.device_count())]'
            } > "$$MINIMAX_H3_ARTIFACT_DIR/runtime-inventory.txt" 2>&1
          - >-
            ps -eo pid=,ppid=,lstart=,stat=,comm=,args= >
            "$$MINIMAX_H3_ARTIFACT_DIR/processes-before.txt"
          - >-
            rocm-smi --showpids >
            "$$MINIMAX_H3_ARTIFACT_DIR/gpu-holders-before.txt" 2>&1
          - |
            if pytest --collect-only -q \
              'tests/e2e/online_serving/test_minimax_h3_dlo_dp2_t2va.py::test_minimax_h3_rocm_t2va[minimax_h3_rocm_t2va]' \
              -m 'full_model and diffusion and rocm and MI325 and cards_4' \
              --run-level full_model \
              2>&1 | tee "$$MINIMAX_H3_ARTIFACT_DIR/collection.txt"; then
              collection_count=$$(awk '/::/ { count += 1 } END { print count + 0 }' \
                "$$MINIMAX_H3_ARTIFACT_DIR/collection.txt")
              if (( collection_count != 1 )); then
                echo "Expected exactly one MiniMax-H3 ROCm test, collected $$collection_count." >&2
                exit 5
              fi
            else
              exit $$?
            fi
          - >-
            timeout --signal=TERM --kill-after=2m 105m
            pytest -s -v -ra
            'tests/e2e/online_serving/test_minimax_h3_dlo_dp2_t2va.py::test_minimax_h3_rocm_t2va[minimax_h3_rocm_t2va]'
            -m 'full_model and diffusion and rocm and MI325 and cards_4'
            --run-level full_model
            --durations=0
            --junitxml="$$MINIMAX_H3_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$MINIMAX_H3_ARTIFACT_DIR/pytest.log"
          - >-
            tail -n 200 "$$MINIMAX_H3_ARTIFACT_DIR/pytest.log" >
            "$$MINIMAX_H3_ARTIFACT_DIR/pytest-summary.txt"
          - |
            sleep 5
            ps -eo pid=,ppid=,lstart=,stat=,comm=,args= > "$$MINIMAX_H3_ARTIFACT_DIR/processes-after.txt"
            rocm-smi --showpids > "$$MINIMAX_H3_ARTIFACT_DIR/gpu-holders-after.txt" 2>&1
            awk '
              NR == FNR {
                if ($$9 != "ps") {
                  baseline[$$1 "|" $$3 "|" $$4 "|" $$5 "|" $$6 "|" $$7] = 1
                }
                next
              }
              $$9 != "ps" {
                identity = $$1 "|" $$3 "|" $$4 "|" $$5 "|" $$6 "|" $$7
                if (!(identity in baseline)) {
                  print
                  leaked = 1
                }
              }
              END {
                if (leaked) {
                  print "status=FAIL leaked_processes_detected=1"
                  exit 1
                }
                print "status=PASS leaked_processes=0"
              }
            ' "$$MINIMAX_H3_ARTIFACT_DIR/processes-before.txt" \
              "$$MINIMAX_H3_ARTIFACT_DIR/processes-after.txt" \
              2>&1 | tee "$$MINIMAX_H3_ARTIFACT_DIR/process-cleanup.txt"

  - group: ":full_moon: Qwen-Image MI300 Nightly"
    steps:
      - label: "Qwen-Image Official-Weight Smoke"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        env:
          VLLM_ROCM_USE_AITER: "1"
          DIFFUSION_ATTENTION_BACKEND: FLASH_ATTN
        artifact_paths:
          - artifacts/rocm-qwen-image-nightly/**/*
        commands:
          - export QWEN_IMAGE_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen-image-nightly"
          - export AITER_JIT_DIR="/tmp/vllm-omni-qwen-image-aiter-$$BUILDKITE_JOB_ID"
          - export TORCH_EXTENSIONS_DIR="/tmp/vllm-omni-qwen-image-torch-$$BUILDKITE_JOB_ID"
          - mkdir -p "$$QWEN_IMAGE_ARTIFACT_DIR" "$$AITER_JIT_DIR" "$$TORCH_EXTENSIONS_DIR"
          - |
            node='tests/e2e/online_serving/test_qwen_image.py::test_text_to_image_001[default]'
            pytest --collect-only -q \
              'tests/e2e/online_serving/test_qwen_image.py::test_text_to_image_001[default]' \
              -m 'full_model and diffusion and rocm and MI325 and cards_1' \
              --run-level full_model > "$$QWEN_IMAGE_ARTIFACT_DIR/collection.txt"
            count=$$(awk -v node="$$node" 'index($$0, node) { n++ } END { print n + 0 }' \
              "$$QWEN_IMAGE_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 1 ]]; then
              echo "Expected exactly one Qwen-Image ROCm node, found $$count." >&2
              cat "$$QWEN_IMAGE_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
          - >-
            timeout --signal=TERM --kill-after=2m 75m
            pytest -s -v -ra
            'tests/e2e/online_serving/test_qwen_image.py::test_text_to_image_001[default]'
            -m 'full_model and diffusion and rocm and MI325 and cards_1'
            --run-level full_model
            --durations=0
            --junitxml="$$QWEN_IMAGE_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$QWEN_IMAGE_ARTIFACT_DIR/pytest.log"

  - group: ":full_moon: Cosmos3 MI300 Nightly"
    steps:
      - label: "Cosmos3 T2I Function"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        artifact_paths:
          - artifacts/rocm-cosmos3-nightly/**/*
        commands:
          # Cosmos3 uses both masked and unmasked BF16 AITER MHA modules. Build
          # them before server startup, then reuse the same job-local cache
          # during the smoke test.
          - export VLLM_ROCM_USE_AITER=1
          - export AITER_JIT_DIR="/tmp/vllm-omni-cosmos3-aiter-$$BUILDKITE_JOB_ID"
          - export TORCH_EXTENSIONS_DIR="/tmp/vllm-omni-cosmos3-torch-extensions-$$BUILDKITE_JOB_ID"
          - mkdir -p "$$AITER_JIT_DIR" "$$TORCH_EXTENSIONS_DIR"
          - pytest --collect-only -q tests/e2e/online_serving/test_cosmos3.py::test_text_to_image_001 -m "core_model and rocm and MI325 and cards_1" --run-level full_model
          - >-
            timeout --signal=TERM --kill-after=2m 55m
            python .buildkite/amd/scripts/prewarm_cosmos3_aiter.py
          - >-
            timeout --signal=TERM --kill-after=2m 25m
            pytest -s -v
            tests/e2e/online_serving/test_cosmos3.py::test_text_to_image_001
            -m "core_model and rocm and MI325 and cards_1"
            --run-level full_model
            --junitxml=/tmp/cosmos3-pytest.xml
          - |
            artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-cosmos3-nightly"
            mkdir -p "$$artifact_dir"
            cp -v /tmp/cosmos3-pytest.xml "$$artifact_dir/"

  - group: ":full_moon: HunyuanImage3 MI300 Nightly"
    steps:
      - label: "HunyuanImage3 Offline Pixel Accuracy"
        agent_pool: mi300_4
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        env:
          HUNYUAN_IMAGE3_MODEL: "tencent/HunyuanImage-3.0-Instruct"
          HUNYUAN_IMAGE3_DEVICES: "0,1,2,3"
          DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
        artifact_paths:
          - artifacts/rocm-hunyuanimage3/**/*
        commands:
          - pytest --collect-only -q tests/e2e/accuracy/test_hunyuan_image3_pixel_accuracy.py::test_hunyuan_image3_pixel_accuracy_offline -m "full_model and rocm and MI325 and cards_4" --run-level full_model
          - pytest -s -v tests/e2e/accuracy/test_hunyuan_image3_pixel_accuracy.py::test_hunyuan_image3_pixel_accuracy_offline -m "full_model and rocm and MI325 and cards_4" --run-level full_model --junitxml=/tmp/hunyuanimage3-pytest.xml
          - |
            artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-hunyuanimage3"
            mkdir -p "$$artifact_dir"
            cp -v tests/e2e/accuracy/artifacts/HunyuanImage-3_0-Instruct/*.png "$$artifact_dir/"
            cp -v /tmp/hunyuanimage3-pytest.xml "$$artifact_dir/"

  # Full-model Stable Audio CPU offload. READY keeps the core_model Qwen-Image
  # cases, and MERGE runs this file under TORCH_SDPA. This lane is the default
  # ROCm backend and stays non-blocking while the ROCm memory threshold is unset.
  - group: ":full_moon: Stable Audio CPU Offload MI300 Nightly"
    steps:
      - label: "Stable Audio CPU Offload"
        agent_pool: mi300_1
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 60
        artifact_paths:
          - artifacts/rocm-stable-audio-cpu-offload/**/*
        commands:
          - export STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-stable-audio-cpu-offload"
          - mkdir -p "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR"
          # Restore the provenance-checked unmasked BF16 AITER MHA module used
          # by the default ROCm diffusion backend before either inference path.
          - eval "$$(python .buildkite/amd/scripts/aiter_mha_cache.py prepare)"
          - |
            node='tests/diffusion/offloader/test_diffusion_cpu_offload.py::test_cpu_offload_diffusion_model[stabilityai/stable-audio-open-1.0]'
            pytest --collect-only -q \
              tests/diffusion/offloader/test_diffusion_cpu_offload.py \
              -m 'full_model and rocm and MI325 and cards_1' \
              --run-level full_model > "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/collection.txt"
            count=$$(awk -v node="$$node" 'index($$0, node) { n++ } END { print n + 0 }' \
              "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 1 ]]; then
              echo "Expected exactly one Stable Audio CPU-offload node, found $$count." >&2
              cat "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
          - >-
            timeout --signal=TERM --kill-after=2m 45m
            pytest -s -v -ra
            tests/diffusion/offloader/test_diffusion_cpu_offload.py
            -m 'full_model and rocm and MI325 and cards_1'
            --run-level full_model
            --durations=0
            --junitxml="$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/pytest.log"
          - >-
            tail -n 100 "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/pytest.log" >
            "$$STABLE_AUDIO_OFFLOAD_ARTIFACT_DIR/pytest-summary.txt"
