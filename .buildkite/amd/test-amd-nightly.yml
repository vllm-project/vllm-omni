      # Both CUDA quantization lanes map to MI300. L4 is a marker-defined
      # test subset, not a request for a lower-memory AMD architecture.
      - label: "ROCm · Diffusion Quantization · H100-class Scope"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 100
        artifact_paths:
          - "artifacts/rocm-diffusion-quant-h100/**/*"
        commands:
          - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-diffusion-quant-h100"
          - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
          # The quality gate compares BF16 and FP8 under the same attention
          # backend. Avoid first-use AITER JIT consuming Omni's 600-second
          # startup budget on ROCm and poisoning later cases in this shard.
          - export DIFFUSION_ATTENTION_BACKEND=TORCH_SDPA
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - echo "diffusion_attention_backend=$$DIFFUSION_ATTENTION_BACKEND" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
