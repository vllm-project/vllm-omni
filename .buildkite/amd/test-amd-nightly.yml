  - group: ":full_moon: MiniMax-H3 MI300 Nightly"
    steps:
      # Ref2VA partition only: the two advanced_model full-wave cases use a
      # different combined checkpoint and remain outside this NIGHTLY lane.
      - label: "MiniMax-H3 Ref2VA Partition DP2 DLO"
        agent_pool: mi300_2
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 120
        source_file_dependencies: diffusion_minimax_h3_function
        env:
