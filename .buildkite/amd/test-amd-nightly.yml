              echo "Expected exactly one MiniMax-H3 timeline accuracy node, found $$count." >&2
              cat "$$ROCM_MINIMAX_H3_TIMELINE_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
          - |
            set +e
            node="tests/e2e/accuracy/minimax_h3/test_minimax_h3_timeline_guides.py::test_minimax_h3_timeline_guides_condition_frames_and_audio"
            timeout --signal=TERM --kill-after=2m 165m \
              pytest -s -v "$$node" \
              -m "full_model and diffusion and rocm and MI325 and cards_2" --run-level full_model \
              --junitxml="$$ROCM_MINIMAX_H3_TIMELINE_ARTIFACT_DIR/pytest.xml" \
              2>&1 | tee "$$ROCM_MINIMAX_H3_TIMELINE_ARTIFACT_DIR/pytest.log"
            status=$${PIPESTATUS[0]}
            set -e
            if [[ -d tests/e2e/accuracy/artifacts ]]; then
              mkdir -p "$$ROCM_MINIMAX_H3_TIMELINE_ARTIFACT_DIR/accuracy"
              cp -a tests/e2e/accuracy/artifacts/. "$$ROCM_MINIMAX_H3_TIMELINE_ARTIFACT_DIR/accuracy/"
            fi

            if [[ "$$status" -eq 0 ]]; then
              python -c 'import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            if root.tag not in {"testsuite", "testsuites"}:
                raise SystemExit("Unexpected JUnit root")
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            failures = sum(int(suite.attrib.get("failures", "0")) for suite in suites)
            errors = sum(int(suite.attrib.get("errors", "0")) for suite in suites)
            if tests != 1 or skipped != 0 or failures != 0 or errors != 0:
                print("Expected exactly 1 executed MiniMax-H3 timeline accuracy tests; "
                      f"tests={tests}, skipped={skipped}, failures={failures}, errors={errors}", file=sys.stderr)
                raise SystemExit(5)
            ' "$$ROCM_MINIMAX_H3_TIMELINE_ARTIFACT_DIR/pytest.xml"
            fi
            exit "$$status"
      - label: "MiniMax-H3 I2VA Ref2VA Accuracy"
        agent_pool: mi300_4
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 180
        source_file_dependencies: diffusion_minimax_h3_accuracy
        env:
          DIFFUSION_ATTENTION_BACKEND: TORCH_SDPA
        artifact_paths:
          - artifacts/rocm-minimax-h3-i2va/**/*
        commands:
