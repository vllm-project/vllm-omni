            --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"

      - label: "ROCm · Omni Performance · No Async Chunk"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 310
        artifact_paths:
          - "artifacts/rocm-omni-perf-no-async/**/*"
