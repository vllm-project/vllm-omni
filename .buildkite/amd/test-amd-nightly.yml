        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_qwen3_omni_seed_tts_perf
        env:
          BENCHMARK_DIR: "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-seed-tts-perf/benchmark-results"
        artifact_paths:
          - artifacts/rocm-qwen3-omni-seed-tts-perf/**/*
        commands:
          - export ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-seed-tts-perf"
          - mkdir -p "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/benchmark-results"
          - >-
            python3 -c 'from huggingface_hub import hf_hub_download;
            from vllm_omni.engine.duplex.vad import SILERO_VAD_FILENAME, SILERO_VAD_REPO_ID,
            SILERO_VAD_REVISION, SileroVADBackendProvider;
            path = hf_hub_download(repo_id=SILERO_VAD_REPO_ID, filename=SILERO_VAD_FILENAME,
            revision=SILERO_VAD_REVISION); SileroVADBackendProvider().get(); print(path)'
          # Measure the explicit and VAD realtime cases. No MI300 baseline yet.
          - |
            nodes=(
              "tests/dfx/perf/scripts/run_benchmark.py::test_performance_benchmark[test_qwen3_omni_seed_tts_realtime-explicit]"
              "tests/dfx/perf/scripts/run_benchmark.py::test_performance_benchmark[test_qwen3_omni_seed_tts_realtime-vad]"
            )
            pytest --collect-only -q "$${nodes[@]}" \
              --test-config-file tests/dfx/perf/tests/test_qwen3_omni_seed_tts.json \
              -m "full_model and omni and rocm and MI325 and cards_2" --run-level full_model \
              > "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/collection.txt"
            count=$$(awk '/::/ { n++ } END { print n + 0 }' \
              "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != "$${#nodes[@]}" ]]; then
              echo "Expected exactly $${#nodes[@]} Qwen3-Omni Seed-TTS realtime nodes, found $$count." >&2
              cat "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            for node in "$${nodes[@]}"; do
              if ! grep -Fq "$$node" "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/collection.txt"; then
                echo "Qwen3-Omni Seed-TTS realtime node was not collected: $$node" >&2
                cat "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/collection.txt" >&2
                exit 5
              fi
            done
          - |
            set +e
            nodes=(
              "tests/dfx/perf/scripts/run_benchmark.py::test_performance_benchmark[test_qwen3_omni_seed_tts_realtime-explicit]"
              "tests/dfx/perf/scripts/run_benchmark.py::test_performance_benchmark[test_qwen3_omni_seed_tts_realtime-vad]"
            )
            timeout --signal=TERM --kill-after=2m 165m \
              pytest -s -v -ra "$${nodes[@]}" \
              --test-config-file tests/dfx/perf/tests/test_qwen3_omni_seed_tts.json \
              -m "full_model and omni and rocm and MI325 and cards_2" --run-level full_model \
              --junitxml="$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/pytest.xml" \
              2>&1 | tee "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/pytest.log"
            status=$${PIPESTATUS[0]}
            set -e
            tail -n 100 "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/pytest.log" > \
              "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/pytest-summary.txt"
            find "$$BENCHMARK_DIR" -maxdepth 1 -type f \
              -name 'result_test_qwen3_omni_seed_tts_realtime_*.json' -print | sort > \
              "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/result-files.txt"
            if [[ "$$status" == 0 ]]; then
              result_count=$$(wc -l < "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/result-files.txt" | tr -d '[:space:]')
              if [[ "$$result_count" != 2 ]]; then
                echo "Expected exactly 2 Qwen3-Omni Seed-TTS result JSON files, found $$result_count." >&2
                cat "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/result-files.txt" >&2
                status=5
              fi
              for name in explicit vad; do
                matches=$$(grep -Fc "_$${name}_" \
                  "$$ROCM_QWEN3_SEED_TTS_PERF_ARTIFACT_DIR/result-files.txt" || true)
                if [[ "$$matches" != 1 ]]; then
                  echo "Expected exactly one Qwen3-Omni Seed-TTS $$name result JSON, found $$matches." >&2
                  status=5
                fi
              done
            fi
            exit "$$status"

