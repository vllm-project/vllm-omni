# AMD MI300 `full_model` nightly coverage during burn-in.
# All jobs are non-blocking until the lane has stable runtime evidence.
# Historical build #11646 was red in Function Expansion and Accuracy (one
# async_chunk similarity mismatch; Seed-TTS WER 0.376480 > 0.35).

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  # MI325 is the repository's legacy ROCm pytest marker. The AMD template maps
  # agent_pool to the current MI300 Buildkite queues independently of that mark.
  - group: ":full_moon: Qwen3-Omni MI300 Nightly"
    steps:
      - label: "Qwen3-Omni Function Expansion"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        artifact_paths:
          - artifacts/rocm-qwen3-omni-function/**/*
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - export VLLM_CI_QWEN3_OMNI_SEED=42
          - export PYTHONHASHSEED=42
          - export QWEN3_OMNI_FUNCTION_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-qwen3-omni-function"
          - mkdir -p "$$QWEN3_OMNI_FUNCTION_ARTIFACT_DIR"
          - >-
            timeout --signal=TERM --kill-after=1m 170m
            pytest -s -v -ra
            tests/e2e/online_serving/test_qwen3_omni_expansion.py
            -m "full_model and rocm and MI325 and cards_2"
            --run-level "full_model"
            --durations=0
            --junitxml="$$QWEN3_OMNI_FUNCTION_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$QWEN3_OMNI_FUNCTION_ARTIFACT_DIR/pytest.log"
          - tail -n 100 "$$QWEN3_OMNI_FUNCTION_ARTIFACT_DIR/pytest.log" > "$$QWEN3_OMNI_FUNCTION_ARTIFACT_DIR/pytest-summary.txt"
          - printf 'qwen3_omni_sampling_seed=42\npythonhashseed=42\n' > "$$QWEN3_OMNI_FUNCTION_ARTIFACT_DIR/reproducibility.txt"

      - label: "Qwen3-Omni Accuracy"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        artifact_paths:
          - tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json
          - artifacts/rocm-qwen3-omni-accuracy/**/*
        commands:
          - export SEED_TTS_WER_EVAL=1
          - export SEED_TTS_WER_SAVE_ITEMS=1
          # PyTorch ROCm uses the torch.cuda device namespace.
          - export SEED_TTS_EVAL_DEVICE=cuda:1
          - export VLLM_CI_QWEN3_OMNI_SEED=42
          - export PYTHONHASHSEED=42
          - export QWEN3_OMNI_ACCURACY_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-qwen3-omni-accuracy"
          - mkdir -p "$$QWEN3_OMNI_ACCURACY_ARTIFACT_DIR"
          - >-
            timeout --signal=TERM --kill-after=1m 170m
            pytest -s -v -ra
            tests/e2e/accuracy/qwen3_omni/test_qwen3_omni.py
            -m "full_model and rocm and MI325 and cards_2"
            --run-level "full_model"
            --durations=0
            --junitxml="$$QWEN3_OMNI_ACCURACY_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$QWEN3_OMNI_ACCURACY_ARTIFACT_DIR/pytest.log"
          - tail -n 100 "$$QWEN3_OMNI_ACCURACY_ARTIFACT_DIR/pytest.log" > "$$QWEN3_OMNI_ACCURACY_ARTIFACT_DIR/pytest-summary.txt"
          - printf 'qwen3_omni_sampling_seed=42\npythonhashseed=42\n' > "$$QWEN3_OMNI_ACCURACY_ARTIFACT_DIR/reproducibility.txt"
          # Native tests run from the image copy under /app/vllm-omni, while
          # Buildkite's artifact hook searches the checkout workspace.
          - |
            if [[ "$$PWD" != "$${BUILDKITE_BUILD_CHECKOUT_PATH:?}" ]]; then
              artifact_dir="$${BUILDKITE_BUILD_CHECKOUT_PATH}/tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc"
              mkdir -p "$$artifact_dir"
              cp -v tests/e2e/accuracy/qwen3_omni/results/qwen_omni_acc/*.json "$$artifact_dir/"
            fi

      - label: "Qwen3-Omni Documentation Examples"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        commands:
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - pytest -s -v tests/examples/online_serving/test_qwen3_omni.py -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

      - label: "Qwen3-Omni AITER-on Smoke"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        commands:
          - export VLLM_ROCM_USE_AITER=1
          - pytest -s -v tests/e2e/online_serving/test_qwen3_omni_expansion.py::test_text_to_text_audio_001 -m "full_model and rocm and MI325 and cards_2" --run-level "full_model"

  - group: ":full_moon: ROCm Omni parity expansion"
    steps:
      - label: "ROCm · Omni Function · Single-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 130
        artifact_paths:
          - "artifacts/rocm-omni-function-1gpu/**/*"
        commands:
          - export ROCM_CI_ARTIFACT_DIR="$$BUILDKITE_BUILD_CHECKOUT_PATH/artifacts/rocm-omni-function-1gpu"
          - export VLLM_ALLOW_LONG_MAX_MODEL_LEN="1"
          - mkdir -p "$$ROCM_CI_ARTIFACT_DIR"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py environment --output "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - python3 .buildkite/amd/scripts/rocm_ci_evidence.py processes --output "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
          - export ROCM_TEST_STARTED_EPOCH=$$(date +%s)
          - >-
            timeout --signal=TERM --kill-after=1m 120m
            pytest -s -v -ra tests/e2e/
            --run-level "full_model"
            -m "full_model and H100 and B200 and omni and cards_1"
            --ignore=tests/e2e/accuracy
            --ignore=tests/e2e/online_serving/test_minicpmo_4_5_duplex_expansion.py
            --durations=0
            --junitxml="$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
          - echo "runtime_seconds=$$(( $$(date +%s) - ROCM_TEST_STARTED_EPOCH ))" >> "$$ROCM_CI_ARTIFACT_DIR/environment.txt"
          - tail -n 100 "$$ROCM_CI_ARTIFACT_DIR/pytest.log" > "$$ROCM_CI_ARTIFACT_DIR/pytest-summary.txt"
          - >-
            python3 .buildkite/amd/scripts/rocm_ci_evidence.py pytest-result
            --xml "$$ROCM_CI_ARTIFACT_DIR/pytest.xml"
            --log "$$ROCM_CI_ARTIFACT_DIR/pytest.log"
            --output "$$ROCM_CI_ARTIFACT_DIR/pytest-result.txt"
          - >-
            python3 .buildkite/amd/scripts/rocm_ci_evidence.py cleanup
            --before "$$ROCM_CI_ARTIFACT_DIR/processes-before.txt"
            --after "$$ROCM_CI_ARTIFACT_DIR/processes-after.txt"
            --output "$$ROCM_CI_ARTIFACT_DIR/process-cleanup.txt"

      - label: "ROCm · Omni Function · 2-GPU"
