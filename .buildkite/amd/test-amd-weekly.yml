      # CUDA weekly names these files at core_model and also sweeps slow Omni
      # cases at full_model. MERGE runs eight nodes at core_model; weekly runs
      # the seven stable full-weight cases. The mixed-input semantic case is
      # known-red with synthetic media (PR #2211) and remains explicitly
      # deselected until its fixtures can exercise recognition reliably.
