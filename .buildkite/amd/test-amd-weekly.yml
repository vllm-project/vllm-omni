  # CUDA weekly Omni full_model sweeps. Run the ROCm-marked MiMo, Covo, Ming,
  # and Qwen2.5 cases here; Ming online remains skipped for 4x H100.
  - group: "Omni E2E Weekly"
    steps:
      - label: "MiMo-Audio · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        source_file_dependencies: omni_mimo_audio_function
        artifact_paths:
          - artifacts/rocm-mimo-audio-weekly/**/*
        commands:
          - export ROCM_MIMO_WEEKLY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-mimo-audio-weekly"
          - mkdir -p "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR"
          - |
            node="tests/e2e/online_serving/test_mimo_audio_expansion.py::test_text_to_text_001"
            pytest --collect-only -q "$$node" \
              --shard-id=0 --num-shards=1 \
              -m "slow and rocm and MI325 and omni and cards_1" \
              --run-level full_model \
              > "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt"
            count=$$(awk '/^tests\/.*::/ { n++ } END { print n + 0 }' \
              "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 1 ]]; then
              echo "Expected exactly one MiMo-Audio ROCm node, found $$count." >&2
              cat "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            if ! grep -Fq "$$node" "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt"; then
              echo "MiMo-Audio node was not collected: $$node" >&2
              cat "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
          - |
            if (
              trap - ERR
              set +e
              node="tests/e2e/online_serving/test_mimo_audio_expansion.py::test_text_to_text_001"
              timeout --signal=TERM --kill-after=2m 105m \
                pytest -s -v -ra "$$node" \
                --shard-id=0 --num-shards=1 \
                -m "slow and rocm and MI325 and omni and cards_1" \
                --run-level full_model --durations=20 \
                --junitxml="$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/pytest.xml" \
