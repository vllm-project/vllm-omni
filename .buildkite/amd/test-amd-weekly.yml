# AMD MI300 weekly. Nightly owns functional and accuracy smokes.
# Reliability owns fault injection and invalid-parameter contracts.
# Omni E2E owns full-weight cases that already have MI325 marks.
# HunyuanImage process-kill coverage uses a generated ROCm expert-parallel-off config.
# One separate job keeps full-model expert-parallel startup and health visible.
# main + WEEKLY=1 selects it. A PR weekly-test label selects it.
# NIGHTLY=1 and NON_CRITICAL=1 do not.

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: "Reliability Test"
    steps:
      - label: "Reliability Test · qwen3-omni"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_qwen3_omni_reliability
        artifact_paths:
          - artifacts/rocm-qwen3-omni-reliability/**/*
        commands:
          - export ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-qwen3-omni-reliability"
          - mkdir -p "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR"
          - |
            pytest --collect-only -q tests/dfx/reliability/test_qwen3_omni.py \
              --shard-id=0 --num-shards=1 \
              -m "slow and rocm and MI325 and cards_2" \
              > "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/collection.txt"
            count=$$(awk '/^tests\/.*::/ { n++ } END { print n + 0 }' \
              "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 37 ]]; then
              echo "Expected exactly 37 Qwen3-Omni reliability nodes, found $$count." >&2
              cat "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
          - |
            if (
              trap - ERR
              set +e
              timeout --signal=TERM --kill-after=2m 165m \
                pytest -s -v -ra tests/dfx/reliability/test_qwen3_omni.py \
                --shard-id=0 --num-shards=1 \
                -m "slow and rocm and MI325 and cards_2" \
                --junitxml="$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/pytest.xml" \
                2>&1 | tee "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/pytest.log"
              exit "$${PIPESTATUS[0]}"
            ); then
              status=0
            else
              status=$$?
            fi
            tail -n 100 "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/pytest.log" > \
              "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/pytest-summary.txt"
            if [[ "$$status" -eq 0 ]]; then
              if python -c 'import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            if tests != 37 or skipped != 10:
                print(
                    f"Expected exactly 37 executed Qwen3-Omni reliability tests with 10 known skips; "
                    f"reported tests={tests}, skipped={skipped}.",
                    file=sys.stderr,
                )
                raise SystemExit(5)
            ' "$$ROCM_QWEN3_RELIABILITY_ARTIFACT_DIR/pytest.xml"
              then
                status=0
              else
                status=$$?
              fi
            fi
            (exit "$$status")

