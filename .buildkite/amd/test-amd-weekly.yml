            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            if tests != 3 or skipped != 0:
                print(
                    f"Expected exactly three executed Moss TTS weekly tests; "
                    f"reported tests={tests}, skipped={skipped}.",
                    file=sys.stderr,
                )
                raise SystemExit(5)
            ' "$$ROCM_MOSS_WEEKLY_ARTIFACT_DIR/pytest.xml"
              then
                status=0
              else
                status=$$?
              fi
            fi
            (exit "$$status")

      # CUDA weekly runs the same three Audex files together. Keep the ROCm
      # lane file-identical while recording exact collection and JUnit counts.
      - label: "Audex offline · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 210
