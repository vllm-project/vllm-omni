      # claimed.
      - label: "Qwen2.5-Omni expansion · 2-GPU"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 195
        source_file_dependencies: omni_qwen2_5_omni_expansion
        # Build #15565 exceeded OpenBLAS's compiled 192-thread metadata limit
        # during evaluation, then segfaulted and held both GPUs until timeout.
        # GPU inference dominates this job, so keep host math libraries bounded.
