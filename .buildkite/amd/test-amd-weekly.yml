              "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 1 ]]; then
              echo "Expected exactly one Bagel weekly ROCm node, found $$count." >&2
              cat "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            if ! grep -Fq "$$node" "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/collection.txt"; then
              echo "Bagel weekly node was not collected: $$node" >&2
              cat "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            if grep -Eq 'test_bagel_text2img_online|test_bagel_image_edit_' \
              "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/collection.txt"; then
              echo "H100-only Bagel nodes were collected." >&2
              exit 5
            fi
          - |
            if (
              trap - ERR
              set +e
              node="tests/e2e/online_serving/test_bagel.py::test_bagel_img2img_online[omni_server0]"
              timeout --signal=TERM --kill-after=2m 75m \
                pytest -s -v -ra "$$node" \
                --shard-id=0 --num-shards=1 \
                -m "slow and diffusion and rocm and MI325 and cards_1" \
                --run-level full_model --durations=20 \
                --junitxml="$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/pytest.xml" \
                2>&1 | tee "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/pytest.log"
              exit "$${PIPESTATUS[0]}"
            ); then
              status=0
            else
              status=$$?
            fi
            tail -n 100 "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/pytest.log" > \
              "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/pytest-summary.txt"
            if [[ "$$status" -eq 0 ]]; then
              if python -c 'import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            if tests != 1 or skipped != 0:
                print(
                    f"Expected exactly one executed Bagel weekly test; "
                    f"reported tests={tests}, skipped={skipped}.",
                    file=sys.stderr,
                )
                raise SystemExit(5)
            ' "$$ROCM_BAGEL_WEEKLY_ARTIFACT_DIR/pytest.xml"
              then
                status=0
              else
                status=$$?
              fi
            fi
            (exit "$$status")

      # These offline understanding and LoRA cases explicitly declare MI325.
      # Keep them in one bounded job to avoid consuming three accelerator slots.
      - label: "Bagel offline shared · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 180
        source_file_dependencies: diffusion_bagel_offline_weekly
        artifact_paths:
          - artifacts/rocm-bagel-offline-weekly/**/*
        commands:
          - export ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-bagel-offline-weekly"
          - mkdir -p "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR"
          - |
            nodes=(
              "tests/e2e/offline_inference/test_bagel.py::test_bagel_text2text[omni_runner0]"
              "tests/e2e/offline_inference/test_bagel.py::test_bagel_img2text[omni_runner0]"
              "tests/e2e/offline_inference/test_bagel_expansion.py::test_bagel_lora_scale_and_deactivation[omni_runner0]"
            )
            set +e
            pytest --collect-only -q "$${nodes[@]}" \
              --shard-id=0 --num-shards=1 \
              -m "slow and diffusion and rocm and MI325 and cards_1" \
              --run-level full_model \
              > "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/collection.txt" 2>&1
            collection_status=$$?
            set -e
            if [[ "$$collection_status" -ne 0 ]]; then
              cat "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit "$$collection_status"
            fi
            count=$$(awk '/^tests\/.*::/ { n++ } END { print n + 0 }' \
              "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 3 ]]; then
              echo "Expected exactly three shared offline Bagel ROCm nodes, found $$count." >&2
              cat "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            for node in "$${nodes[@]}"; do
              if ! grep -Fq "$$node" "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/collection.txt"; then
                echo "Bagel offline weekly node was not collected: $$node" >&2
                cat "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
                exit 5
              fi
            done
          - |
            if (
              trap - ERR
              set +e
              nodes=(
                "tests/e2e/offline_inference/test_bagel.py::test_bagel_text2text[omni_runner0]"
                "tests/e2e/offline_inference/test_bagel.py::test_bagel_img2text[omni_runner0]"
                "tests/e2e/offline_inference/test_bagel_expansion.py::test_bagel_lora_scale_and_deactivation[omni_runner0]"
              )
              timeout --signal=TERM --kill-after=2m 165m \
                pytest -s -v -ra "$${nodes[@]}" \
                --shard-id=0 --num-shards=1 \
                -m "slow and diffusion and rocm and MI325 and cards_1" \
                --run-level full_model --durations=20 \
                --junitxml="$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/pytest.xml" \
                2>&1 | tee "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/pytest.log"
              exit "$${PIPESTATUS[0]}"
            ); then
              status=0
            else
              status=$$?
            fi
            tail -n 100 "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/pytest.log" > \
              "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/pytest-summary.txt"
            if [[ "$$status" -eq 0 ]]; then
              if python -c 'import sys, xml.etree.ElementTree as ET
            root = ET.parse(sys.argv[1]).getroot()
            suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
            tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
            skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
            if tests != 3 or skipped != 0:
                print(
                    f"Expected exactly three executed shared offline Bagel tests; "
                    f"reported tests={tests}, skipped={skipped}.",
                    file=sys.stderr,
                )
                raise SystemExit(5)
            ' "$$ROCM_BAGEL_OFFLINE_WEEKLY_ARTIFACT_DIR/pytest.xml"
              then
                status=0
              else
                status=$$?
              fi
            fi
            (exit "$$status")

      # Keep the complete Cosmos3 image and T2V/I2V/V2V file as the blocking
      # weekly owner after scheduled MI325 qualification. This replaces the
      # narrower nightly T2I-only owner.
      - label: "Cosmos3 generation modes · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: Blocking
        timeout_in_minutes: 300
        source_file_dependencies:
          - diffusion_cosmos3_function
          - .buildkite/amd/scripts/prewarm_cosmos3_aiter.py
          - .buildkite/amd/scripts/run-rocm-full-model-nightly.sh
          - tests/helpers/
        artifact_paths:
          - artifacts/rocm-cosmos3-weekly/**/*
        commands:
          # Cosmos3 starts its server with both masked and unmasked BF16 AITER
          # MHA modules. Compile them before the 900-second orchestrator startup
          # window, then reuse the same job-local cache for both generation tests.
          - export VLLM_ROCM_USE_AITER=1
          - export AITER_JIT_DIR="/tmp/vllm-omni-cosmos3-aiter-$$BUILDKITE_JOB_ID"
          - export TORCH_EXTENSIONS_DIR="/tmp/vllm-omni-cosmos3-torch-extensions-$$BUILDKITE_JOB_ID"
          - mkdir -p "$$AITER_JIT_DIR" "$$TORCH_EXTENSIONS_DIR"
          - >-
            timeout --signal=TERM --kill-after=2m 55m
            python .buildkite/amd/scripts/prewarm_cosmos3_aiter.py
          - >-
            env ROCM_E2E_LEVEL_MARKER=slow ROCM_E2E_RUN_LEVEL=full_model
            ROCM_E2E_TIMEOUT_MINUTES=210
            bash .buildkite/amd/scripts/run-rocm-full-model-nightly.sh
