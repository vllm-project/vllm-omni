# AMD MI300 weekly. Reliability owns fault injection.
# Omni E2E owns full-weight cases that already have MI325 marks.
# main + WEEKLY=1 selects it. A PR weekly-test label selects it.
# NIGHTLY=1 and NON_CRITICAL=1 do not.

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: "Reliability Test"
    steps:
      - label: "Reliability Test · qwen3-omni"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: omni_qwen3_omni_reliability
        commands:
          - >-
            pytest -s -v tests/dfx/reliability/test_qwen3_omni.py
            -m "slow and rocm and MI325 and cards_2"

      - label: "Reliability Test · wan22"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: diffusion_wan22_reliability
        commands:
          - >-
            pytest -s -v tests/dfx/reliability/test_wan22.py
            -m "slow and rocm and MI325 and cards_1"

      - label: "Reliability Test · hunyuan-image"
        agent_pool: mi300_4
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        source_file_dependencies: diffusion_hunyuan_image3_reliability
        commands:
          - >-
            pytest -s -v tests/dfx/reliability/test_hunyuan_image.py
            -m "slow and rocm and MI325 and cards_4"

      - label: "Reliability Test · Invalid parameters · MI300 · 2-GPU"
        agent_pool: mi300_2
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 90
        source_file_dependencies: reliability_invalid_param_h100
        commands:
          - >-
            pytest -s -v
            tests/dfx/reliability/invalid_param_test/test_invalid_omni_chat.py
            -m "slow and rocm and MI325 and cards_2"

  # CUDA weekly Omni H100 full_model sweeps. Only the ROCm-marked cases run
  # here. Ming online is skipped for 4x H100, and Covo has no MI325 mark.
  - group: "Omni E2E Weekly"
    steps:
      - label: "MiMo-Audio · 1-GPU"
        agent_pool: mi300_1
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 120
        artifact_paths:
          - artifacts/rocm-mimo-audio-weekly/**/*
        commands:
          - |
            export ROCM_MIMO_WEEKLY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-mimo-audio-weekly"
            mkdir -p "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR"
            pytest --collect-only -q \
              tests/e2e/online_serving/test_mimo_audio_expansion.py \
              -m "slow and rocm and MI325 and omni and cards_1" \
              --run-level full_model \
              > "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt"
            count=$$(awk 'index($$0, "test_mimo_audio_expansion.py::") { n++ } END { print n + 0 }' \
              "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 2 ]]; then
              echo "Expected exactly 2 MiMo-Audio ROCm nodes, found $$count." >&2
              cat "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            for node in test_text_to_text_001 test_audio_to_text_audio_001; do
              if ! grep -Fq "test_mimo_audio_expansion.py::$$node" \
                "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt"; then
                echo "MiMo-Audio node was not collected: $$node" >&2
                cat "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
                exit 5
              fi
            done
          - >-
            timeout --signal=TERM --kill-after=2m 105m
            pytest -s -v -ra
            tests/e2e/online_serving/test_mimo_audio_expansion.py
            -m "slow and rocm and MI325 and omni and cards_1"
            --run-level full_model
            --durations=20
            --junitxml="$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/pytest.log"
          - >-
            tail -n 100 "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/pytest.log" >
            "$$ROCM_MIMO_WEEKLY_ARTIFACT_DIR/pytest-summary.txt"

      - label: "Ming-flash-omni offline · 4-GPU"
        agent_pool: mi300_4
        depends_on: amd-build
        mirror_hardwares: [amdproduction]
        grade: NonBlocking
        timeout_in_minutes: 180
        artifact_paths:
          - artifacts/rocm-ming-flash-omni-weekly/**/*
        commands:
          - |
            export ROCM_MING_WEEKLY_ARTIFACT_DIR="$${BUILDKITE_BUILD_CHECKOUT_PATH:?}/artifacts/rocm-ming-flash-omni-weekly"
            mkdir -p "$$ROCM_MING_WEEKLY_ARTIFACT_DIR"
            pytest --collect-only -q \
              tests/e2e/offline_inference/test_ming_flash_omni_expansion.py \
              -m "slow and rocm and MI325 and omni and cards_4" \
              --run-level full_model \
              > "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/collection.txt"
            count=$$(awk 'index($$0, "test_ming_flash_omni_expansion.py::") { n++ } END { print n + 0 }' \
              "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/collection.txt")
            if [[ "$$count" != 7 ]]; then
              echo "Expected exactly 7 Ming-flash-omni offline ROCm nodes, found $$count." >&2
              cat "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
              exit 5
            fi
            for node in \
              test_text_to_text \
              test_image_to_text \
              test_audio_to_text \
              test_video_to_text \
              test_mixed_to_text \
              test_text_to_audio \
              test_image_to_audio
            do
              if ! grep -Fq "test_ming_flash_omni_expansion.py::$$node" \
                "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/collection.txt"; then
                echo "Ming-flash-omni node was not collected: $$node" >&2
                cat "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/collection.txt" >&2
                exit 5
              fi
            done
          - >-
            timeout --signal=TERM --kill-after=2m 165m
            pytest -s -v -ra
            tests/e2e/offline_inference/test_ming_flash_omni_expansion.py
            -m "slow and rocm and MI325 and omni and cards_4"
            --run-level full_model
            --durations=20
            --junitxml="$$ROCM_MING_WEEKLY_ARTIFACT_DIR/pytest.xml"
            2>&1 | tee "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/pytest.log"
          - >-
            tail -n 100 "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/pytest.log" >
            "$$ROCM_MING_WEEKLY_ARTIFACT_DIR/pytest-summary.txt"
