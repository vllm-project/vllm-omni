            2 tts rocm-cosyvoice3-offline-weekly

      # Match CUDA's full Qwen3-TTS word-timestamp file on one MI325. The
      # forced aligner is part of this path, so keep all three API modes here.
      - label: "Qwen3-TTS word timestamps · 1-GPU"
