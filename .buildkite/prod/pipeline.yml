steps:
  # ==================== HK-001 (a2b3) ====================
  - label: ":buildkit: Build and Push NPU Prod Image (HK-001 a2b3 - Default: 1 Card)"
    key: image-build-hk001
    agents:
      queue: "linux-aarch64-a2b3"
    plugins:
      - kubernetes:
          metadata:
            annotations:
              vault.hashicorp.com/agent-init-first: "true"
              vault.hashicorp.com/agent-inject: "true"
              vault.hashicorp.com/agent-inject-perms-ca.pem: "0400"
              vault.hashicorp.com/agent-inject-perms-cert.pem: "0400"
              vault.hashicorp.com/agent-inject-perms-config.json: "0400"
              vault.hashicorp.com/agent-inject-perms-key.pem: "0400"
              vault.hashicorp.com/agent-inject-secret-ca.pem: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-secret-cert.pem: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-secret-config.json: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-secret-key.pem: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-template-ca.pem: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.RootCA }}\n{{- end }}"
              vault.hashicorp.com/agent-inject-template-cert.pem: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.ClientCaCert }}\n{{- end }}"
              vault.hashicorp.com/agent-inject-template-config.json: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.dockerConfig }}\n{{- end }}"
              vault.hashicorp.com/agent-inject-template-key.pem: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.ClientCaKey }}\n{{- end }}"
              vault.hashicorp.com/agent-pre-populate-only: "true"
              vault.hashicorp.com/agent-run-as-user: "0"
              vault.hashicorp.com/agent-run-as-group: "0"
              vault.hashicorp.com/agent-service-account-token-volume-name: token-vol
              vault.hashicorp.com/role: ascend-gha-runners
              vault.hashicorp.com/secret-volume-path: /home/user/.docker/
              vault.hashicorp.com/tls-skip-verify: "true"
          podSpecPatch:
            volumes:
            - name: token-vol
              projected:
                defaultMode: 420
                sources:
                - serviceAccountToken:
                    audience: api
                    expirationSeconds: 600
                    path: token
    env:
      VLLM_IMAGE_TAG: "${BUILDKITE_COMMIT}"
      IMAGE_NAME: "vllm-omni-ci-npu"
      IMAGE_REGISTRY: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry"
      # buildkitd remote connection
      BUILDKITD_ADDR: "tcp://buildkitd-service.buildkitd:1234"
      NPU_COUNT: "1"  # A2 B3 默认为单卡
    command: |
      set -ex

      echo "--- Building and pushing NPU Prod Image (HK-001 a2b3)"
      echo "NPU Count: $${NPU_COUNT}"
      echo "Image: $${IMAGE_REGISTRY}/$${IMAGE_NAME}:$${VLLM_IMAGE_TAG}"
      echo "buildkitd address: $${BUILDKITD_ADDR}"

      # Ensure buildctl is available
      if ! command -v buildctl &> /dev/null; then
        echo "Installing buildctl..."
        mkdir -p /tmp/buildkit
        BUILDKIT_VERSION="v0.29.0"
        wget -q "https://github.com/moby/buildkit/releases/download/$${BUILDKIT_VERSION}/buildkit-$${BUILDKIT_VERSION}.linux-arm64.tar.gz" -O /tmp/buildkit.tar.gz
        tar -xzf /tmp/buildkit.tar.gz -C /tmp/buildkit
        cp /tmp/buildkit/bin/buildctl /usr/local/bin/
      fi

      # Build and push to SWR using buildctl
      export DOCKER_CONFIG=/home/user/.docker
      buildctl \
        --addr="$${BUILDKITD_ADDR}" \
        --tlscacert=/home/user/.docker/ca.pem \
        --tlscert=/home/user/.docker/cert.pem \
        --tlskey=/home/user/.docker/key.pem \
        build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./docker \
        --opt filename=Dockerfile.npu.test \
        --output type=image,name=$${IMAGE_REGISTRY}/$${IMAGE_NAME}:$${VLLM_IMAGE_TAG},push=true \
        --progress=plain

      echo "--- Image pushed successfully"
      echo "$${IMAGE_REGISTRY}/$${IMAGE_NAME}:$${VLLM_IMAGE_TAG}"

  - label: "Upload Test Pipeline (HK-001)"
    depends_on: image-build-hk001
    agents:
      queue: "linux-aarch64-a2b3"
    command: |
      buildkite-agent pipeline upload .buildkite/prod/test-npu-ready-hk001.yaml

  # ==================== CN12-001 (a3) ====================
  - label: ":buildkit: Build and Push NPU Prod Image (CN12-001 a3 - Default: 2 Cards)"
    key: image-build-cn12001
    agents:
      queue: "linux-aarch64-a3"
    plugins:
      - kubernetes:
          metadata:
            annotations:
              vault.hashicorp.com/agent-init-first: "true"
              vault.hashicorp.com/agent-inject: "true"
              vault.hashicorp.com/agent-inject-perms-ca.pem: "0400"
              vault.hashicorp.com/agent-inject-perms-cert.pem: "0400"
              vault.hashicorp.com/agent-inject-perms-config.json: "0400"
              vault.hashicorp.com/agent-inject-perms-key.pem: "0400"
              vault.hashicorp.com/agent-inject-secret-ca.pem: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-secret-cert.pem: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-secret-config.json: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-secret-key.pem: internal/data/ascend/buildkitd
              vault.hashicorp.com/agent-inject-template-ca.pem: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.RootCA }}\n{{- end }}"
              vault.hashicorp.com/agent-inject-template-cert.pem: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.ClientCaCert }}\n{{- end }}"
              vault.hashicorp.com/agent-inject-template-config.json: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.dockerConfig }}\n{{- end }}"
              vault.hashicorp.com/agent-inject-template-key.pem: "{{- with secret \"internal/data/ascend/buildkitd\" -}}\n{{ .Data.data.ClientCaKey }}\n{{- end }}"
              vault.hashicorp.com/agent-pre-populate-only: "true"
              vault.hashicorp.com/agent-run-as-user: "0"
              vault.hashicorp.com/agent-run-as-group: "0"
              vault.hashicorp.com/agent-service-account-token-volume-name: token-vol
              vault.hashicorp.com/role: ascend-gha-runners
              vault.hashicorp.com/secret-volume-path: /home/user/.docker/
              vault.hashicorp.com/tls-skip-verify: "true"
          podSpecPatch:
            volumes:
            - name: token-vol
              projected:
                defaultMode: 420
                sources:
                - serviceAccountToken:
                    audience: api
                    expirationSeconds: 600
                    path: token
    env:
      VLLM_IMAGE_TAG: "${BUILDKITE_COMMIT}"
      IMAGE_NAME: "vllm-omni-ci-npu"
      IMAGE_REGISTRY: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry"
      # buildkitd remote connection
      BUILDKITD_ADDR: "tcp://buildkitd-service.buildkitd:1234"
      NPU_COUNT: "2"  # A3 默认为双卡
    command: |
      set -ex

      echo "--- Building and pushing NPU Prod Image (CN12-001 a3)"
      echo "NPU Count: $${NPU_COUNT}"
      echo "Image: $${IMAGE_REGISTRY}/$${IMAGE_NAME}:$${VLLM_IMAGE_TAG}"
      echo "buildkitd address: $${BUILDKITD_ADDR}"

      # 配置 GitHub 代理（国内集群）
      git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"

      # Ensure buildctl is available
      if ! command -v buildctl &> /dev/null; then
        echo "Installing buildctl..."
        mkdir -p /tmp/buildkit
        BUILDKIT_VERSION="v0.29.0"
        wget -q "https://gh-proxy.test.osinfra.cn/https://github.com/moby/buildkit/releases/download/$${BUILDKIT_VERSION}/buildkit-$${BUILDKIT_VERSION}.linux-arm64.tar.gz" -O /tmp/buildkit.tar.gz
        tar -xzf /tmp/buildkit.tar.gz -C /tmp/buildkit
        cp /tmp/buildkit/bin/buildctl /usr/local/bin/
      fi

      # Build and push to SWR using buildctl
      export DOCKER_CONFIG=/home/user/.docker
      buildctl \
        --addr="$${BUILDKITD_ADDR}" \
        --tlscacert=/home/user/.docker/ca.pem \
        --tlscert=/home/user/.docker/cert.pem \
        --tlskey=/home/user/.docker/key.pem \
        build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./docker \
        --opt filename=Dockerfile.npu.test \
        --output type=image,name=$${IMAGE_REGISTRY}/$${IMAGE_NAME}:$${VLLM_IMAGE_TAG},push=true \
        --progress=plain

      echo "--- Image pushed successfully"
      echo "$${IMAGE_REGISTRY}/$${IMAGE_NAME}:$${VLLM_IMAGE_TAG}"

  - label: "Upload Test Pipeline (CN12-001)"
    depends_on: image-build-cn12001
    agents:
      queue: "linux-aarch64-a3"
    command: |
      buildkite-agent pipeline upload .buildkite/prod/test-npu-ready-cn12001.yaml

  # ==================== 动态资源准备 ====================
  - wait: ~

  - label: "🚀 Ready for Dynamic Resource Testing"
    command: |
      echo "--- All images built successfully"
      echo "NPU configurations ready for dynamic testing"
      echo "- A2 B3 (HK-001): Default 1 Card"
      echo "- A3 (CN12-001): Default 2 Cards"

notes: |
  ## 新队列架构说明

  **主要变更**：
  - ✅ 按机器类型分组：从 8 个队列减少到 2 个
  - ✅ A2 B3 默认单卡配置：`huawei.com/ascend-1980: "1"`
  - ✅ A3 默认双卡配置：`huawei.com/ascend-910-3: "2"`

  **后续计划**：
  - 📋 第二阶段：实现动态资源分配
  - 🔄 支持环境变量指定设备数量
  - 🎯 实现"K8s 控制器根据任务规格创建 Pod"