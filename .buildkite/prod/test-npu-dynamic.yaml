steps:
  # ==================== A2 B3 动态资源测试 ====================

  # A2 B3 单卡测试
  - label: "🧪 NPU Unit Test (A2 B3 - 1 Card)"
    agents:
      queue: "ascend-a2b3"
      resource_class: npu-1
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A2 B3 Single Card Test"

      echo "--- Container information"
      uname -a
      python3 --version

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running single card tests"
      timeout 15m pytest -v -s -m 'single_card and a2b3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # A2 B3 2卡测试
  - label: "🧪 NPU Unit Test (A2 B3 - 2 Cards)"
    agents:
      queue: "ascend-a2b3"
      resource_class: npu-2
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A2 B3 2 Card Test"

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running 2 card tests"
      timeout 20m pytest -v -s -m 'multi_card and a2b3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # A2 B3 4卡测试
  - label: "🧪 NPU Unit Test (A2 B3 - 4 Cards)"
    agents:
      queue: "ascend-a2b3"
      resource_class: npu-4
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A2 B3 4 Card Test"

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running 4 card tests"
      timeout 30m pytest -v -s -m 'multi_card and a2b3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # A2 B3 8卡测试
  - label: "🧪 NPU Unit Test (A2 B3 - 8 Cards)"
    agents:
      queue: "ascend-a2b3"
      resource_class: npu-8
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A2 B3 8 Card Test"

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running 8 card tests"
      timeout 45m pytest -v -s -m 'multi_card and a2b3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # ==================== A3 动态资源测试 ====================

  # A3 2卡测试
  - label: "🧪 NPU Unit Test (A3 - 2 Cards)"
    agents:
      queue: "ascend-a3"
      resource_class: npu-2
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A3 Dual Card Test"

      echo "--- Container information"
      uname -a
      python3 --version

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running dual card tests"
      timeout 15m pytest -v -s -m 'dual_card and a3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # A3 4卡测试
  - label: "🧪 NPU Unit Test (A3 - 4 Cards)"
    agents:
      queue: "ascend-a3"
      resource_class: npu-4
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A3 4 Card Test"

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running 4 card tests"
      timeout 30m pytest -v -s -m 'multi_card and a3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # A3 8卡测试
  - label: "🧪 NPU Unit Test (A3 - 8 Cards)"
    agents:
      queue: "ascend-a3"
      resource_class: npu-8
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- A3 8 Card Test"

      echo "--- Verifying npu-smi"
      npu-smi info

      echo "--- Running 8 card tests"
      timeout 45m pytest -v -s -m 'multi_card and a3' \
        --cov=vllm_omni \
        --cov-report=term-missing

  # ==================== 性能基准测试 ====================

  - wait: ~

  - label: "📊 Performance Benchmark Summary"
    command: |
      echo "--- Performance Benchmark Summary"
      echo ""
      echo "Queue Architecture:"
      echo "- A2 B3: ascend-a2b3 (supports 1,2,4,8 cards)"
      echo "- A3: ascend-a3 (supports 2,4,8,16 cards)"
      echo ""
      echo "Dynamic Resource Allocation:"
      echo "- Use agents.resource_class to match resource-classes in values.yaml"
      echo "- Buildkite agent-stack-k8s will apply matched resource configuration"

notes: |
  ## 动态资源测试 Pipeline (使用 resource_class)

  **使用方法**：
  - 队列：`ascend-a2b3` 或 `ascend-a3`
  - 使用 `resource_class` 匹配 values.yaml 中定义的资源类
  - Buildkite agent-stack-k8s 会自动应用匹配的资源配置

  **资源类对应关系**：
  | resource_class | NPU 类型 | 卡数 | CPU | 内存 |
  |----------------|----------|------|-----|------|
  | npu-1 | ascend-1980 | 1 | 23 | 64Gi |
  | npu-2 | ascend-1980 | 2 | 46 | 128Gi |
  | npu-4 | ascend-1980 | 4 | 92 | 256Gi |
  | npu-8 | ascend-1980 | 8 | 184 | 256Gi |
  | npu-2 | ascend-910-3 | 2 | 78 | 256Gi |
  | npu-4 | ascend-910-3 | 4 | 156 | 512Gi |
  | npu-8 | ascend-910-3 | 8 | 312 | 1024Gi |
