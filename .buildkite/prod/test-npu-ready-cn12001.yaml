steps:
  - label: "🧪 NPU Unit Test (CN12-001 a3 - 2 Cards)"
    agents:
      queue: "ascend-a3"
      resource_class: npu-2
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    command: |
      set -ex

      echo "--- Container information"
      uname -a
      python3 --version

      echo "--- Verifying npu-smi"
      ls -l /usr/local/bin/npu-smi
      npu-smi info

      echo "--- Running pytest"
      timeout 20m pytest -v -s -m 'core_model and npu' \
        --cov=vllm_omni \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html \
        --cov-report=xml
