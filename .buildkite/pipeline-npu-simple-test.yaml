# .buildkite/pipeline-npu-simple-test.yaml
# Simple NPU smoke test - quick verification that vllm-omni can run on NPU
# Useful for validating runner configuration and basic NPU functionality

steps:
  - group: "🧪 NPU Smoke Test"
    steps:
      # ========================================================================
      # Step 1: Environment Check (No GPU needed)
      # ========================================================================
      - label: ":computer: Check NPU Environment"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        timeout_in_minutes: 10
        commands:
          - |
            echo "=== System Info ==="
            uname -a
            echo ""
            echo "=== NPU Driver Info ==="
            npu-smi info || echo "⚠️  npu-smi not available"
            echo ""
            echo "=== Python Environment ==="
            python --version
            pip list | grep -E "torch|vllm|ascend" || echo "Packages not installed yet"

      # ========================================================================
      # Step 2: Simple vLLM Import Test (Just verify installation)
      # ========================================================================
      - label: ":snake: vLLM Import Test"
        depends_on: ~
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        timeout_in_minutes: 20
        soft_fail: true
        commands:
          - |
            # 1. 创建一个临时的虚拟环境 (推荐放在 /tmp 或当前目录)
            echo "=== Creating Virtual Environment ==="
            python -m venv vllm-omni-venv
            # 激活虚拟环境 (后续的 pip 和 python 命令都会在这个环境内执行)
            source vllm-omni-venv/bin/activate

            echo "=== Installing vLLM in Virtual Environment ==="
            # 现在在这个环境下，你可以自由安装
            pip install -e . -q

            echo ""
            echo "=== Testing vLLM Import ==="
            python -c "
            import sys
            try:
                from vllm_omni import LLM
                print('✅ vLLM import successful')
                print('✅ LLM class available')
            except Exception as e:
                print(f'❌ vLLM import failed: {e}')
                sys.exit(1)
            "

      # ========================================================================
      # Step 3: Minimal Model Load Test (Offline Inference - No Server)
      # ========================================================================
      - label: ":rocket: Minimal Model Load (No Inference)"
        depends_on: ~
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        timeout_in_minutes: 30
        soft_fail: true
        commands:
          - |
            echo "=== Setup Environment ==="
            source /usr/local/Ascend/ascend-toolkit/set_env.sh
            source /usr/local/Ascend/nnal/atb/set_env.sh

            echo ""
            echo "=== Installing vLLM ==="
            pip install -e . -q

            echo ""
            echo "=== Testing Model Loading ==="
            python -c "
            import os
            os.environ['VLLM_USE_MODELSCOPE'] = 'True'

            from vllm_omni import LLM

            print('Loading minimal model...')
            try:
                # Try a very small model just to test loading capability
                # You might want to use a local model path instead
                llm = LLM(
                    model='Qwen/Qwen2.5-0.5B',
                    tensor_parallel_size=1,
                    device='npu',
                    load_format='safetensors',
                )
                print('✅ Model loaded successfully')
                print(f'✅ Device: NPU')
                print(f'✅ Model type: {type(llm).__name__}')
            except Exception as e:
                print(f'❌ Model loading failed: {e}')
                import traceback
                traceback.print_exc()
                exit(1)
            "

      # ========================================================================
      # Step 4: Simple Inference Test (One token generation)
      # ========================================================================
      - label: ":brain: Simple Inference Test"
        depends_on: ~
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        timeout_in_minutes: 60
        soft_fail: true
        commands:
          - |
            echo "=== Setup Environment ==="
            source /usr/local/Ascend/ascend-toolkit/set_env.sh
            source /usr/local/Ascend/nnal/atb/set_env.sh

            echo ""
            echo "=== Running Simple Inference ==="
            python -c "
            import os
            os.environ['VLLM_USE_MODELSCOPE'] = 'True'

            from vllm_omni import LLM, SamplingParams

            print('Initializing LLM...')
            llm = LLM(
                model='Qwen/Qwen2.5-0.5B',
                tensor_parallel_size=1,
                device='npu',
                max_model_len=512,
            )

            print('Running inference...')
            prompts = ['Hello, how are you?']
            sampling_params = SamplingParams(max_tokens=10)

            outputs = llm.generate(prompts, sampling_params)

            print('✅ Inference successful!')
            for output in outputs:
                print(f'  Prompt: {output.prompt}')
                print(f'  Output: {output.outputs[0].text}')
            "

notify:
  - slack: "#vllm-ci-notifications"
    if_failed: true
    if_passed: false
