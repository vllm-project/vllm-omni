                resources:
                  limits:
                    nvidia.com/gpu: 4
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: hf-cache
                    mountPath: /root/.cache/huggingface
                env:
                  - name: HF_HOME
                    value: /root/.cache/huggingface
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            nodeSelector:
              node.kubernetes.io/instance-type: gpu-h100-sxm
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
              - name: hf-cache
                hostPath:
                  path: /mnt/hf-cache
                  type: DirectoryOrCreate

  # vLLM device: b200-k8s → agents.queue b200-k8s + Buildkite K8s agent-stack podSpec
  b200_1:
    agents:
      queue: b200-k8s
    plugins:
      - kubernetes:
          podSpec:
            runtimeClassName: nvidia
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet
            imagePullSecrets:
              - name: k8s-ecr-login-renew-docker-secret
            containers:
              - image: 936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
                resources:
                  limits:
                    nvidia.com/gpu: 1
                securityContext:
                  capabilities:
                    add:
                      - IPC_LOCK
                      - SYS_RESOURCE
                volumeMounts:
                  - name: devshm
                    mountPath: /dev/shm
                  - name: raid
                    mountPath: /raid
                  - name: shared
                    mountPath: /mnt/shared
                env:
                  - name: NCCL_CUMEM_HOST_ENABLE
                    value: "0"
                  - name: HF_HOME
                    value: /raid/hf_cache
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: hf-token-secret
                        key: token
            volumes:
              - name: devshm
                emptyDir:
                  medium: Memory
              - name: raid
                hostPath:
                  path: /raid
                  type: DirectoryOrCreate
              - name: shared
                hostPath:
                  path: /mnt/shared
                  type: DirectoryOrCreate

