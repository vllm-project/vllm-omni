# Uploader-only path-prefix presets for CUDA L2–L5 and NPU L4 test YAML.
# Referenced as ``source_file_dependencies: omni_qwen3_omni_function`` (or a list of
# keys) on a step; ``upload_pipeline.py`` expands the key(s) only.
#
# YAML anchors above the registry hold model business-code paths. Job keys
# ({model}_function / _perf / _accuracy / _reliability / _doc / _cov) alias
# those anchors and add the scripts the job actually runs. Feature keys below
# are unchanged. ``source_filter_fallback`` is not a job key: when no job-key
# prefix matches, a matching diff keeps every job for that upload.
#
# YAML anchors are nested lists; the loader flattens them.

