steps:
  - label: "🧪 NPU Unit Test"
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    image: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/vllm-omni-ci-npu:${BUILDKITE_COMMIT}"
    plugins:
      - kubernetes:
          podSpecPatch:
            imagePullSecrets:
            - name: swr-secret
    command: |
      set -ex

      echo "--- Container information"
      uname -a
      python3 --version

      echo "--- Verifying NPU device mounts"
      ls -l /dev/davinci0
      ls -l /dev/davinci_manager
      ls -l /dev/devmm_svm
      ls -l /dev/hisi_hdc

      echo "--- Verifying npu-smi"
      ls -l /usr/local/bin/npu-smi
      npu-smi info

      echo "--- Verifying Ascend runtime"
      . /usr/local/Ascend/ascend-toolkit/set_env.sh
      . /usr/local/Ascend/nnal/atb/set_env.sh

      python3 - <<'PY'
      import torch
      print("torch version:", torch.__version__)
      print("torch.npu available:", torch.npu.is_available())

      if not torch.npu.is_available():
          raise RuntimeError("NPU is not available inside test container")
      PY

      echo "--- Running pytest"
      timeout 20m pytest -v -s -m 'core_model and npu' \
        --cov=vllm_omni \
        --cov-branch \
        --cov-report=term-missing \
        --cov-report=html \
        --cov-report=xml