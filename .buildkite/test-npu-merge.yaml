# .buildkite/pipeline-npu-merge.yaml
# L3: NPU tests triggered on merge to main
steps:
  - group: "NPU Tests (L3 - Merge)"
    steps:
      - label: "NPU A2B3: Basic Test (1 card)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        command: |
          set -ex
          source /tmp/buildkit-env.txt

          # 安装 nerdctl（如果未安装）
          if ! command -v nerdctl &> /dev/null; then
            mkdir -p /tmp/nerdctl-install
            NERDCTL_VERSION="v1.7.2"
            wget -q https://github.com/containerd/nerdctl/releases/download/${NERDCTL_VERSION}/nerdctl-${NERDCTL_VERSION}-linux-arm64.tar.gz -O /tmp/nerdctl-install/nerdctl.tar.gz
            tar -xzf /tmp/nerdctl-install/nerdctl.tar.gz -C /tmp/nerdctl-install
            sudo mv /tmp/nerdctl-install/nerdctl /usr/local/bin/
          fi

          nerdctl load -i "${IMAGE_TARBALL}"

          nerdctl run --rm \
            -v /dev/davinci0:/dev/davinci0 \
            -v /dev/davinci_manager:/dev/davinci_manager \
            -v /dev/devmm_svm:/dev/devmm_svm \
            -v /dev/hisi_hdc:/dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi:ro \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/:ro \
            -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            bash -c "source /usr/local/Ascend/ascend-toolkit/set_env.sh && source /usr/local/Ascend/nnal/atb/set_env.sh && pip install -e . && VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/offline_inference/test_qwen2_5_omni.py"
        timeout_in_minutes: 60
        soft_fail: true

