# .buildkite/pipeline-npu-merge.yaml
# L3: NPU tests triggered on merge to main
steps:
  - group: "NPU Tests (L3 - Merge)"
    steps:
      - label: "NPU A2B3: Basic Test (1 card)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/offline_inference/test_qwen2_5_omni.py
        timeout_in_minutes: 60
        soft_fail: true

      - label: "NPU A2B3: Qwen2.5-Omni Offline Inference (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/offline_inference/test_qwen2_5_omni.py
        timeout_in_minutes: 60
        soft_fail: true

      - label: "NPU A2B3: Qwen3-Omni Offline Inference (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/offline_inference/test_qwen3_omni.py -m "npu"
        timeout_in_minutes: 60
        soft_fail: true

      - label: "NPU A2B3: Qwen3-TTS Online Serving (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/online_serving/test_qwen3_tts.py -m "npu"
        timeout_in_minutes: 60
        soft_fail: true

      - label: "NPU A2B3: Distributed Inference (4 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v -m "distributed_npu"
        timeout_in_minutes: 90
        soft_fail: true
