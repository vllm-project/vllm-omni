          download_path = f"/root/.cache/huggingface/{org}/{name}"
          os.makedirs(download_path, exist_ok=True)

          try:
              snapshot_download(
                  repo_id=model_id,
                  local_dir=download_path,
                  local_dir_use_symlinks=False
              )
              print(f"✓ Downloaded: {model_id}")
          except Exception as e:
