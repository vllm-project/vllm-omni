# .buildkite/intel/pipeline-intel.yml
#
# Two mutually exclusive XPU steps. The scope follows the same signals the CUDA
# weekly/nightly steps use (.buildkite/cuda/test-weekly.yml): a scheduled build
# that sets NIGHTLY=1, or a PR labelled ``nightly-test``. Every ordinary PR
# takes the pr scope.
#
#   pr     the no-card XPU-dispatch stage, core_model on one and on two cards,
#          and the omni models: ~37min measured. Needs tiny-random/Qwen-Image
#          (30MB), riverclouds/qwen_image_random (9.9GB), Qwen2.5-Omni-3B (12GB)
#          and Qwen2.5-Omni-7B (21GB) in the agent's HF cache.
#   broad  also advanced_model on one and two cards (Qwen3-TTS, Z-Image, Wan2.1,
#          Voxtral, and BAGEL-7B-MoT for sleep mode), hence its larger budget.
#
# Card budget. The script pins the first card of the agent's ZE_AFFINITY_MASK
# for the cards_1 stages and the first two for the cards_2 ones, and XPU_REQUIRE_CARDS
# makes it fail rather than quietly drop a stage: a step asking for 2 cards that
# lands on a single-card agent is an error, not a green build with less coverage.
#
# Both steps target agents tagged cards=2, so the agent side needs, per
# instance:
#
#   buildkite-agent start --tags "queue=intel-gpu-omni,cards=2"
#   ZE_AFFINITY_MASK=0,1        # two cards, disjoint between instances
#
# The tag is the promise and the mask is the reality; XPU_REQUIRE_CARDS checks
# the second. An 8-card host therefore carries four such instances.
#
# NOTE: this targeting only schedules once the agents carry the tag. Tag them
# before merging, or the Intel steps sit unscheduled.
#
# A single-card queue can run the smaller lane with its own step: target
# cards: "1" and set XPU_REQUIRE_CARDS: "1", which skips the cards_2 stages
# deliberately and says so in the log.
#
# Exactly one step runs per build, so the image is built once either way. To
# get the broad scope on demand: new build with NIGHTLY=1, or label the PR
# ``nightly-test``.
common_xpu_env: &common_xpu_env
  DOCKER_BUILDKIT: "1"
  # Buildkite will automatically replace this with the actual commit hash
  VLLM_IMAGE_TAG: "${BUILDKITE_COMMIT}"
  VLLM_VERSION: "v0.33.0"
  # The CI image is local-only and the run's trap deletes it, so compressing
  # its ~37GB of layers only costs test time.
  EXPORT_COMPRESSION: "uncompressed"
  # Container test budget; leaves the rest of timeout_in_minutes for the
  # image build.
  XPU_TEST_BUDGET: "60m"

steps:
  - group: "INTEL Tests"
    steps:
      - label: "Intel: XPU Test"
        if: build.env("NIGHTLY") != "1" && !(build.pull_request.labels includes "nightly-test")
        command: "bash .buildkite/intel/scripts/run-xpu-test.sh"
        agents:
          queue: "intel-gpu-omni"
          cards: "2"
        env:
          <<: *common_xpu_env
          XPU_TEST_SCOPE: "pr"
          XPU_REQUIRE_CARDS: "2"
        priority: 100
        timeout_in_minutes: 80
        soft_fail: false

      - label: "Intel: XPU Test (broad)"
        if: build.env("NIGHTLY") == "1" || build.pull_request.labels includes "nightly-test"
        command: "bash .buildkite/intel/scripts/run-xpu-test.sh"
        agents:
          queue: "intel-gpu-omni"
          cards: "2"
        env:
          <<: *common_xpu_env
          XPU_TEST_SCOPE: "broad"
          XPU_REQUIRE_CARDS: "2"
          # The extra stages do not fit the pr budget.
          XPU_TEST_BUDGET: "95m"
        priority: 100
        timeout_in_minutes: 120
        soft_fail: false
