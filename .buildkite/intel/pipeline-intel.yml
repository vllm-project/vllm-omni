# .buildkite/intel/pipeline-intel.yml
#
# Four steps: {pr, broad} x {1-card agents, 2-card agents}. Exactly two run per
# build, because the pr and broad steps carry mutually exclusive ``if``
# expressions - the same signals the CUDA weekly/nightly steps use
# (.buildkite/cuda/test-weekly.yml): a scheduled build that sets NIGHTLY=1, or a
# PR labelled ``nightly-test``. Every ordinary PR takes the pr pair.
#
# Scope:
#   pr     the no-card XPU-dispatch stage, core_model and the omni models.
#          Needs tiny-random/Qwen-Image (30MB), riverclouds/qwen_image_random
#          (9.9GB), Qwen2.5-Omni-3B (12GB) and Qwen2.5-Omni-7B (21GB) in the
#          agent's HF cache.
#   broad  adds advanced_model: Qwen3-TTS, Z-Image, Wan2.1, Voxtral on one card,
#          and the sleep/wake suite on two, which also needs BAGEL-7B-MoT.
#
# Card classes: the 1-card steps own every cards_1 stage (and the no-card one),
# the 2-card steps own only the cards_2 stages, so the scarce 2-card agents do
# not repeat the long lane. XPU_TEST_CARDS selects which group a step runs and
# XPU_REQUIRE_CARDS checks the mask the agent actually hands over, so a tag that
# does not match reality fails the step instead of quietly dropping stages.
#
# Agent side, 16 cards over two 8-card hosts = ten 1-card and three 2-card
# instances, with disjoint masks:
#
#   buildkite-agent start --tags "queue=intel-gpu-omni,cards=1"  ZE_AFFINITY_MASK=<n>
#   buildkite-agent start --tags "queue=intel-gpu-omni,cards=2"  ZE_AFFINITY_MASK=<n>,<n+1>
#
#   host A: cards=1 on 0,1,2,3,4,5      cards=2 on 6,7
#   host B: cards=1 on 0,1,2,3          cards=2 on 4,5 and 6,7
#
# NOTE: the steps only schedule once the agents carry these tags. Re-cut the
# agents before merging, or the Intel steps sit unscheduled.
common_xpu_env: &common_xpu_env
  DOCKER_BUILDKIT: "1"
  # Buildkite will automatically replace this with the actual commit hash
  VLLM_IMAGE_TAG: "${BUILDKITE_COMMIT}"
  VLLM_VERSION: "v0.33.0"
  # The CI image is local-only and the run's trap deletes it, so compressing
  # its ~37GB of layers only costs test time.
  EXPORT_COMPRESSION: "uncompressed"

pr_if: &pr_if >-
  build.env("NIGHTLY") != "1" && !(build.pull_request.labels includes "nightly-test")
broad_if: &broad_if >-
  build.env("NIGHTLY") == "1" || build.pull_request.labels includes "nightly-test"

steps:
  - group: "INTEL Tests"
    steps:
      # ~37min measured end to end: dispatch 3m40s, omni 10m05s,
      # core_model 23m01s, mxfp8 23s. Stage caps sum to 51m.
      - label: "Intel: XPU Test · 1 card"
        if: *pr_if
        command: "bash .buildkite/intel/scripts/run-xpu-test.sh"
        agents:
          queue: "intel-gpu-omni"
          cards: "1"
        env:
          <<: *common_xpu_env
          XPU_TEST_SCOPE: "pr"
          XPU_TEST_CARDS: "1"
          XPU_REQUIRE_CARDS: "1"
          XPU_TEST_BUDGET: "55m"
        priority: 100
        timeout_in_minutes: 75
        soft_fail: false

      # 1m41s measured; the image build dominates this step.
      - label: "Intel: XPU Test · 2 cards"
        if: *pr_if
        command: "bash .buildkite/intel/scripts/run-xpu-test.sh"
        agents:
          queue: "intel-gpu-omni"
          cards: "2"
        env:
          <<: *common_xpu_env
          XPU_TEST_SCOPE: "pr"
          XPU_TEST_CARDS: "2"
          XPU_REQUIRE_CARDS: "2"
          XPU_TEST_BUDGET: "15m"
        priority: 100
        timeout_in_minutes: 40
        soft_fail: false

      - label: "Intel: XPU Test · 1 card (broad)"
        if: *broad_if
        command: "bash .buildkite/intel/scripts/run-xpu-test.sh"
        agents:
          queue: "intel-gpu-omni"
          cards: "1"
        env:
          <<: *common_xpu_env
          XPU_TEST_SCOPE: "broad"
          XPU_TEST_CARDS: "1"
          XPU_REQUIRE_CARDS: "1"
          XPU_TEST_BUDGET: "70m"
        priority: 100
        timeout_in_minutes: 95
        soft_fail: false

      - label: "Intel: XPU Test · 2 cards (broad)"
        if: *broad_if
        command: "bash .buildkite/intel/scripts/run-xpu-test.sh"
        agents:
          queue: "intel-gpu-omni"
          cards: "2"
        env:
          <<: *common_xpu_env
          XPU_TEST_SCOPE: "broad"
          XPU_TEST_CARDS: "2"
          XPU_REQUIRE_CARDS: "2"
          XPU_TEST_BUDGET: "35m"
        priority: 100
        timeout_in_minutes: 60
        soft_fail: false
