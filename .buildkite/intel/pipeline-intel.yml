steps:
  - label: "Intel XPU: Build shared CI image"
    key: intel-xpu-image-build
    commands:
      - bash .buildkite/intel/scripts/build-xpu-ci-image.sh
    agents:
      queue: medium_cpu_queue_premerge
    env:
      VLLM_VERSION: "v0.34.0"

  - group: "INTEL Tests"
    depends_on: intel-xpu-image-build
    steps:
      - label: "Intel: XPU Test · 1 card"
        if: build.env("NIGHTLY") != "1" && !(build.pull_request.labels includes "nightly-test")
        commands:
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh omni 1
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh core_model 1
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh quantization 1
        agents:
          queue: intel-gpu-k8s
        plugins: &intel-xpu-k8s-1
          - kubernetes:
              checkout:
                skip: true
              podSpec: &intel-xpu-pod
                resourceClaims:
                  - name: gpu
                    resourceClaimTemplateName: b70-1
                containers:
                  - &intel-xpu-container
                    image: "public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:${BUILDKITE_COMMIT}-intel-xpu-ready"
                    imagePullPolicy: Always
                    env:
                      - name: VLLM_USAGE_SOURCE
                        value: ci-test
                      - name: VLLM_TEST_DEVICE
                        value: xpu
                      - name: VLLM_DISABLE_COMPILE_CACHE
                        value: "1"
                      - name: VLLM_WORKER_MULTIPROC_METHOD
                        value: spawn
                      - name: HF_HUB_DOWNLOAD_TIMEOUT
                        value: "300"
                      - name: HF_HUB_ETAG_TIMEOUT
                        value: "60"
                      - name: HF_HOME
                        value: /data/huggingface
                      - name: HF_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: hf-token-secret
                            key: token
                    resources:
                      claims:
                        - name: gpu
                      requests:
                        cpu: "8"
                        memory: 32Gi
                      limits:
                        cpu: "32"
                        memory: 64Gi
                    volumeMounts:
                      - name: dshm
                        mountPath: /dev/shm
                      - name: hf-cache
                        mountPath: /data/huggingface
                volumes:
                  - name: dshm
                    emptyDir:
                      medium: Memory
                      sizeLimit: 8Gi
                  - name: hf-cache
                    hostPath:
                      path: /data/huggingface
                      type: DirectoryOrCreate
        priority: 100
        timeout_in_minutes: 80
        soft_fail: false

      - label: "Intel: XPU Test · 2 cards"
        if: build.env("NIGHTLY") != "1" && !(build.pull_request.labels includes "nightly-test")
        commands:
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh core_model 2
        agents:
          queue: intel-gpu-k8s
        plugins: &intel-xpu-k8s-2
          - kubernetes:
              checkout:
                skip: true
              podSpec:
                <<: *intel-xpu-pod
                resourceClaims:
                  - name: gpu
                    resourceClaimTemplateName: b70-2
                containers:
                  - <<: *intel-xpu-container
                    resources:
                      claims:
                        - name: gpu
                      requests:
                        cpu: "16"
                        memory: 64Gi
                      limits:
                        cpu: "64"
                        memory: 128Gi
                volumes:
                  - name: dshm
                    emptyDir:
                      medium: Memory
                      sizeLimit: 16Gi
                  - name: hf-cache
                    hostPath:
                      path: /data/huggingface
                      type: DirectoryOrCreate
        priority: 100
        timeout_in_minutes: 80
        soft_fail: false

      - label: "Intel: XPU Test (broad) · 1 card"
        if: build.env("NIGHTLY") == "1" || build.pull_request.labels includes "nightly-test"
        commands:
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh omni 1
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh core_model 1
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh quantization 1
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh advanced_model 1
        agents:
          queue: intel-gpu-k8s
        plugins: *intel-xpu-k8s-1
        priority: 100
        timeout_in_minutes: 120
        soft_fail: false

      - label: "Intel: XPU Test (broad) · 2 cards"
        if: build.env("NIGHTLY") == "1" || build.pull_request.labels includes "nightly-test"
        commands:
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh core_model 2
          - bash /vllm-omni/.buildkite/intel/scripts/run-xpu-test-k8s.sh advanced_model 2
        agents:
          queue: intel-gpu-k8s
        plugins: *intel-xpu-k8s-2
        priority: 100
        timeout_in_minutes: 120
        soft_fail: false
