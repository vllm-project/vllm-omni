steps:
  - label: ":buildkit: Build NPU Test Image (buildctl)"
    key: image-build
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    env:
      VLLM_IMAGE_TAG: "${BUILDKITE_COMMIT}"
      IMAGE_NAME: "vllm-omni-ci-npu"
      # buildkitd 远程连接配置
      BUILDKITD_ADDR: "tcp://buildkitd-service.buildkitd.svc.cluster.local:1234"
    command: |
      set -ex

      # 从 agent 名称提取索引用于缓存目录
      agent_idx=$(echo "${BUILDKITE_AGENT_NAME}" | awk -F'-' '{print $(NF-1)}')
      echo "--- Agent index: ${agent_idx}"

      builder_cache_dir="/mnt/buildkit-cache${agent_idx}"
      mkdir -p ${builder_cache_dir}

      echo "--- Building with buildctl + buildkitd"
      echo "buildkitd address: ${BUILDKITD_ADDR}"
      echo "Cache directory: ${builder_cache_dir}"

      # 配置 GitHub 代理
      git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"

      # 确保 buildctl 可用
      if ! command -v buildctl &> /dev/null; then
        echo "Installing buildctl..."
        mkdir -p /tmp/buildkit
        BUILDKIT_VERSION="v0.13.0"
        wget -q https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-arm64.tar.gz -O /tmp/buildkit.tar.gz
        tar -xzf /tmp/buildkit.tar.gz -C /tmp/buildkit
        sudo cp /tmp/buildkit/bin/buildctl /usr/local/bin/
      fi

      # 使用 buildctl 构建：输出 OCI 格式到本地缓存
      buildctl \
        --addr="${BUILDKITD_ADDR}" \
        --tlsca="/certs/ca.pem" \
        --tlscert="/certs/cert.pem" \
        --tlskey="/certs/key.pem" \
        build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./docker \
        --opt filename=Dockerfile_test.npu \
        --output type=oci,dest="${builder_cache_dir}/image-${VLLM_IMAGE_TAG}.tar" \
        --progress=plain

      echo "--- Image built: ${builder_cache_dir}/image-${VLLM_IMAGE_TAG}.tar"
      ls -lh "${builder_cache_dir}/image-${VLLM_IMAGE_TAG}.tar"

      # 保存镜像路径和标签供后续步骤使用（/tmp 在 Pod 中共享）
      {
        echo "IMAGE_TARBALL=${builder_cache_dir}/image-${VLLM_IMAGE_TAG}.tar"
        echo "IMAGE_NAME=${IMAGE_NAME}"
        echo "IMAGE_TAG=${VLLM_IMAGE_TAG}"
        echo "CACHE_DIR=${builder_cache_dir}"
      } > /tmp/buildkit-env.txt
      cat /tmp/buildkit-env.txt

  - label: "Upload Test Pipeline"
    depends_on: image-build
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    command: |
      buildkite-agent pipeline upload .buildkite/test-npu-ready.yaml
      