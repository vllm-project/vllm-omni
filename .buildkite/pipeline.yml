steps:
  - label: ":buildkit: Build and Push NPU Test Image"
    key: image-build
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    plugins:
      - kubernetes#v1.0:
          pod_spec_patch:
            volumes:
            - name: token-vol
              projected:
                defaultMode: 420
                sources:
                - serviceAccountToken:
                    audience: api
                    expirationSeconds: 600
                    path: token
    env:
      VLLM_IMAGE_TAG: "${BUILDKITE_COMMIT}"
      IMAGE_NAME: "vllm-omni-ci-npu"
      IMAGE_REGISTRY: "swr.cn-southwest-2.myhuaweicloud.com/modelfoundry"
      # buildkitd 远程连接配置
      BUILDKITD_ADDR: "tcp://buildkitd-service.buildkitd:1234"
    command: |
      set -ex

      echo "--- Building and pushing NPU Test Image"
      echo "Image: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${VLLM_IMAGE_TAG}"
      echo "buildkitd address: ${BUILDKITD_ADDR}"

      # 配置 GitHub 代理
      git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"

      # 确保 buildctl 可用
      if ! command -v buildctl &> /dev/null; then
        echo "Installing buildctl..."
        mkdir -p /tmp/buildkit
        BUILDKIT_VERSION="v0.29.0"
        wget -q "https://gh-proxy.test.osinfra.cn/https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-arm64.tar.gz" -O /tmp/buildkit.tar.gz
        tar -xzf /tmp/buildkit.tar.gz -C /tmp/buildkit
        sudo cp /tmp/buildkit/bin/buildctl /usr/local/bin/
      fi

      # 使用 buildctl 构建并推送到 SWR
      buildctl \
        --addr="${BUILDKITD_ADDR}" \
        --tlscacert=/vault/secrets/ca.pem \
        --tlscert=/vault/secrets/cert.pem \
        --tlskey=/vault/secrets/key.pem \
        build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=./docker \
        --opt filename=Dockerfile_test.npu \
        --secret id=dockerconfig,src=/vault/secrets/config.json \
        --output type=image,name=${IMAGE_REGISTRY}/${IMAGE_NAME}:${VLLM_IMAGE_TAG},push=true \
        --progress=plain

      echo "--- Image pushed successfully"
      echo "${IMAGE_REGISTRY}/${IMAGE_NAME}:${VLLM_IMAGE_TAG}"

  - label: "Upload Test Pipeline"
    depends_on: image-build
    agents:
      queue: "linux-aarch64-a2b3-gy006-test"
    command: |
      buildkite-agent pipeline upload .buildkite/test-npu-ready.yaml
      