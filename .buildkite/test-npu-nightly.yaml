# .buildkite/pipeline-npu-nightly.yaml
# L4: NPU nightly tests - full regression and performance benchmarks
steps:
  - group: "NPU Tests (L4 - Nightly)"
    steps:
      - label: ":full_moon: NPU A2B3: Smoke Test (1 card)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/offline_inference/test_qwen2_5_omni.py
        timeout_in_minutes: 60
        soft_fail: true

      - label: ":full_moon: NPU A2B3: Full Model Regression (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v -m "npu" --run-level advanced_model
        timeout_in_minutes: 120
        soft_fail: true

      - label: ":full_moon: NPU A2B3: Qwen3-TTS Non-Async-Chunk (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/online_serving/test_qwen3_tts.py -m "npu" -k "not AsyncChunk"
        timeout_in_minutes: 60
        soft_fail: true

      - label: ":full_moon: NPU A2B3: Distributed Full Regression (8 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        plugins:
          - docker#v5.2.0:
              image: "vllm-omni-ci-npu"
              always-pull: true
        command: |
          git config --global url."https://gh-proxy.test.osinfra.cn/https://github.com/".insteadOf "https://github.com/"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          pip install -e .
          VLLM_USE_MODELSCOPE=True pytest -s -v -m "distributed_npu" --run-level advanced_model
        timeout_in_minutes: 120
        soft_fail: true
