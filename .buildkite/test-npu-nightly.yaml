# .buildkite/pipeline-npu-nightly.yaml
# L4: NPU nightly tests - full regression and performance benchmarks
steps:
  - group: "NPU Tests (L4 - Nightly)"
    steps:
      - label: ":full_moon: NPU A2B3: Smoke Test (1 card)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        command: |
          set -ex

          # 从 agent 名称提取索引
          agent_idx=$(echo "${BUILDKITE_AGENT_NAME}" | awk -F'-' '{print $(NF-1)}')

          # 加载从 pipeline.yml 构建的 OCI 镜像
          image_tarball="/mnt/buildkit-cache${agent_idx}/image-${BUILDKITE_COMMIT}.tar"
          docker load -i "${image_tarball}"

          # 运行测试容器
          docker run --rm \
            -v /dev/davinci0:/dev/davinci0 \
            -v /dev/davinci_manager:/dev/davinci_manager \
            -v /dev/devmm_svm:/dev/devmm_svm \
            -v /dev/hisi_hdc:/dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi:ro \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            vllm-omni-ci-npu:latest \
            bash -c "source /usr/local/Ascend/ascend-toolkit/set_env.sh && source /usr/local/Ascend/nnal/atb/set_env.sh && pip install -e . && VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/offline_inference/test_qwen2_5_omni.py"
        timeout_in_minutes: 60
        soft_fail: true

      - label: ":full_moon: NPU A2B3: Full Model Regression (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        command: |
          set -ex

          # 从 agent 名称提取索引
          agent_idx=$(echo "${BUILDKITE_AGENT_NAME}" | awk -F'-' '{print $(NF-1)}')

          # 加载从 pipeline.yml 构建的 OCI 镜像
          image_tarball="/mnt/buildkit-cache${agent_idx}/image-${BUILDKITE_COMMIT}.tar"
          docker load -i "${image_tarball}"

          # 运行测试容器
          docker run --rm \
            -v /dev/davinci0:/dev/davinci0 \
            -v /dev/davinci1:/dev/davinci1 \
            -v /dev/davinci_manager:/dev/davinci_manager \
            -v /dev/devmm_svm:/dev/devmm_svm \
            -v /dev/hisi_hdc:/dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi:ro \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            vllm-omni-ci-npu:latest \
            bash -c "source /usr/local/Ascend/ascend-toolkit/set_env.sh && source /usr/local/Ascend/nnal/atb/set_env.sh && pip install -e . && VLLM_USE_MODELSCOPE=True pytest -s -v -m \"npu\" --run-level advanced_model"
        timeout_in_minutes: 120
        soft_fail: true

      - label: ":full_moon: NPU A2B3: Qwen3-TTS Non-Async-Chunk (2 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        command: |
          set -ex

          # 从 agent 名称提取索引
          agent_idx=$(echo "${BUILDKITE_AGENT_NAME}" | awk -F'-' '{print $(NF-1)}')

          # 加载从 pipeline.yml 构建的 OCI 镜像
          image_tarball="/mnt/buildkit-cache${agent_idx}/image-${BUILDKITE_COMMIT}.tar"
          docker load -i "${image_tarball}"

          # 运行测试容器
          docker run --rm \
            -v /dev/davinci0:/dev/davinci0 \
            -v /dev/davinci1:/dev/davinci1 \
            -v /dev/davinci_manager:/dev/davinci_manager \
            -v /dev/devmm_svm:/dev/devmm_svm \
            -v /dev/hisi_hdc:/dev/hisi_hdc \
            -v /usr/local/dcmi:/usr/local/dcmi:ro \
            -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro \
            -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/:ro \
            -v /etc/ascend_install.info:/etc/ascend_install.info:ro \
            vllm-omni-ci-npu:latest \
            bash -c "source /usr/local/Ascend/ascend-toolkit/set_env.sh && source /usr/local/Ascend/nnal/atb/set_env.sh && pip install -e . && VLLM_USE_MODELSCOPE=True pytest -s -v tests/e2e/online_serving/test_qwen3_tts.py -m \"npu\" -k \"not AsyncChunk\""
        timeout_in_minutes: 60
        soft_fail: true

      - label: ":full_moon: NPU A2B3: Distributed Full Regression (8 cards)"
        agents:
          queue: "linux-aarch64-a2b3-gy006-test"
        command: |
          set -ex

          # 从 agent 名称提取索引
          agent_idx=$(echo "${BUILDKITE_AGENT_NAME}" | awk -F'-' '{print $(NF-1)}')

          # 加载从 pipeline.yml 构建的 OCI 镜像
          image_tarball="/mnt/buildkit-cache${agent_idx}/image-${BUILDKITE_COMMIT}.tar"
