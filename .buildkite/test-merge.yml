steps:
  - group: "Simple Unit Test"
    key: merge-simple-unit-test-group
    steps:
      - label: "Simple UT·diffusion"
        depends_on: upload-merge-pipeline
        commands:
          - "timeout 20m pytest -v -s tests/diffusion/ -m 'core_model and cpu' --cov=vllm_omni --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"
        agents:
          queue: "gpu_1_queue"
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Simple UT·other"
        depends_on: upload-merge-pipeline
        commands:
          - "timeout 20m pytest -v -s -m 'core_model and cpu' --ignore=tests/diffusion --cov=vllm_omni --cov-branch --cov-report=term-missing --cov-report=html --cov-report=xml"
        agents:
          queue: "gpu_1_queue"
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

  # Group: images LoRA, offload, worker, FP8, LoRA, cache, seq+TP, VAE, EP; parallel children, each depends_on upload-merge-pipeline.
  - group: "Diffusion Test"
    key: merge-diffusion-test-group
    steps:
      - label: "Diffusion Test · LoRA Test"
        key: merge-diffusion-images-api-lora
        timeout_in_minutes: 30
        depends_on: upload-merge-pipeline
        commands:
          - pytest -s -v tests/diffusion/lora/test_images_generations_lora.py tests/diffusion/lora/test_diffusion_lora.py
        agents:
          queue: "gpu_1_queue" # g6.4xlarge instance on AWS, has 1 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · CPU offloading Test"
        key: merge-diffusion-offloader-cpu-layerwise
        timeout_in_minutes: 20
        depends_on: upload-merge-pipeline
        commands:
          # Single pytest session for one combined summary at end of log.
          - pytest -s -v tests/diffusion/offloader/test_diffusion_cpu_offload.py tests/diffusion/offloader/test_diffusion_layerwise_offload.py
        agents:
          queue: "gpu_1_queue" # g6.4xlarge instance on AWS, has 1 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · Worker"
        key: merge-diffusion-worker
        timeout_in_minutes: 20
        depends_on: upload-merge-pipeline
        commands:
          - pytest -s -v tests/diffusion/test_diffusion_worker.py
        agents:
          queue: "gpu_4_queue" # g6.12xlarge instance on AWS, has 4 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              shm-size: "8gb"
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · FP8 Quantization"
        key: merge-diffusion-fp8
        timeout_in_minutes: 45
        depends_on: upload-merge-pipeline
        commands:
          - pytest -s -v tests/diffusion/quantization/test_quantization_fp8.py -m "core_model and diffusion" --run-level "core_model"
        agents:
          queue: "gpu_1_queue" # g6.4xlarge instance on AWS, has 1 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · Cache Backend"
        key: merge-diffusion-cache-backend
        timeout_in_minutes: 15
        depends_on: upload-merge-pipeline
        commands:
          - pytest -s -v tests/diffusion/cache/test_cache_dit.py tests/diffusion/cache/test_teacache.py
        agents:
          queue: "gpu_1_queue" # g6.4xlarge instance on AWS, has 1 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · Sequence Parallelism"
        key: merge-diffusion-sequence-parallel
        timeout_in_minutes: 20
        depends_on: upload-merge-pipeline
        commands:
          - pytest -s -v tests/diffusion/distributed/test_sequence_parallel.py tests/diffusion/distributed/test_ulysses_uaa_perf.py
        agents:
          queue: "gpu_4_queue" # g6.12xlarge instance on AWS, has 4 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              shm-size: "8gb"
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · Tensor Parallelism"
        key: merge-diffusion-tensor-parallel
        timeout_in_minutes: 20
        depends_on: upload-merge-pipeline
        commands:
          - pytest -s -v tests/diffusion/distributed/test_zimage_parallelism.py
        agents:
          queue: "gpu_4_queue" # g6.12xlarge instance on AWS, has 4 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              shm-size: "8gb"
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · VAE Decode Parallelism"
        key: merge-diffusion-vae
        timeout_in_minutes: 90
        depends_on: upload-merge-pipeline
        commands:
          - |
            export VLLM_WORKER_MULTIPROC_METHOD=spawn
            pytest -s -v tests/diffusion/distributed/test_vae_decode_parallelism.py
        agents:
          queue: "gpu_4_queue" # g6.12xlarge instance on AWS, has 4 L4 GPU
        plugins:
          - docker#v5.2.0:
              image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
              always-pull: true
              propagate-environment: true
              shm-size: "8gb"
              environment:
                - "HF_HOME=/fsx/hf_cache"
                - "HF_TOKEN"
              volumes:
                - "/fsx/hf_cache:/fsx/hf_cache"

      - label: "Diffusion Test · Expert Parallelism"
        key: merge-diffusion-expert-parallel
        timeout_in_minutes: 60
        depends_on: upload-merge-pipeline
        commands:
          - |
            export VLLM_WORKER_MULTIPROC_METHOD=spawn
            pytest -s -v tests/diffusion/distributed/test_expert_parallel.py -m "core_model and parallel and diffusion" --run-level "core_model"
        agents:
          queue: "mithril-h100-pool"
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - image: 936637512419.dkr.ecr.us-west-2.amazonaws.com/vllm-ci-pull-through-cache/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
                    resources:
                      limits:
                        nvidia.com/gpu: 8
                    volumeMounts:
                      - name: devshm
                        mountPath: /dev/shm
                      - name: hf-cache
                        mountPath: /root/.cache/huggingface
                    env:
                      - name: HF_HOME
                        value: /root/.cache/huggingface
                      - name: HF_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: hf-token-secret
                            key: token
                nodeSelector:
                  node.kubernetes.io/instance-type: gpu-h100-sxm
                volumes:
                  - name: devshm
                    emptyDir:
                      medium: Memory
                  - name: hf-cache
                    hostPath:
                      path: /mnt/hf-cache
                      type: DirectoryOrCreate

  - label: "Engine Test"
    depends_on: upload-merge-pipeline
    commands:
      - |
        timeout 15m bash -c '
                export VLLM_WORKER_MULTIPROC_METHOD=spawn
                pytest -s -v tests/engine/test_async_omni_engine_abort.py
        '
    agents:
      queue: "gpu_1_queue" # g6.12xlarge instance on AWS, has 4 L4 GPU
    plugins:
      - docker#v5.2.0:
          image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
          always-pull: true
          propagate-environment: true
          shm-size: "8gb"
          environment:
            - "HF_HOME=/fsx/hf_cache"
            - "HF_TOKEN"
          volumes:
            - "/fsx/hf_cache:/fsx/hf_cache"

