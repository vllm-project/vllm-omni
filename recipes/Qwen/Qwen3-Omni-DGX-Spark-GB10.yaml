async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 10
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    devices: "0"

    max_num_seqs: 1
    max_num_batched_tokens: 8192
    max_model_len: 8192

    gpu_memory_utilization: 0.52

    trust_remote_code: true
    enable_prefix_caching: false

    enforce_eager: true
    async_scheduling: false

    default_sampling_params:
      temperature: 0.0
      max_tokens: 2048

  - stage_id: 1
    devices: "0"

    max_num_seqs: 1
    max_num_batched_tokens: 8192
    max_model_len: 8192

    gpu_memory_utilization: 0.09

    trust_remote_code: true
    enable_prefix_caching: false

    enforce_eager: true
    async_scheduling: false

    input_connectors:
      from_stage_0: connector_of_shared_memory

    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      repetition_penalty: 1.05

  - stage_id: 2
    devices: "0"

    max_num_seqs: 1
    max_num_batched_tokens: 65536

    gpu_memory_utilization: 0.06

    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false

    input_connectors:
      from_stage_1: connector_of_shared_memory

    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.1

platforms:
  cuda:
    stages:
      - stage_id: 0
        compilation_config:
          custom_ops: ["+rotary_embedding"]
