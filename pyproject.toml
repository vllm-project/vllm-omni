[build-system]
requires = [
    "setuptools>=77.0.3,<81.0.0",
    "wheel",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-omni"
dynamic = ["version", "dependencies"]
description = "A framework for efficient model inference with omni-modality models"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [
    {name = "vLLM-Omni Team"}
]
keywords = ["vllm", "multimodal", "diffusion", "transformer", "inference", "serving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Dependencies are now managed dynamically via setup.py based on detected hardware platform.
# This allows automatic installation of the correct platform-specific dependencies (CUDA/ROCm/CPU/XPU/NPU)
# without requiring extras like [cuda]. See requirements/ directory for platform-specific dependencies.
# Note: vllm is intentionally excluded due to entrypoints overwrite issue.

[project.optional-dependencies]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "datasets>=2.14.0",
    "mypy==1.11.1",
    "pre-commit==4.0.1",
    "openai-whisper>=20250625",
    "psutil>=7.2.0",
    "soundfile>=0.13.1",
    "imageio[ffmpeg]>=0.6.0",
    "opencv-python>=4.12.0.88",
    "mooncake-transfer-engine==0.3.8.post1",
    "av", # for ComfyUI tests
    "openpyxl>=3.0.0", # for nightly CI
    "pyttsx3>=2.99",
    "opencc>=1.2.0",
    "mistune>=3.2.0", # for example tests
    "torchmetrics>=1.4.0", # for accuracy similarity metrics
]

demo = [
    "gradio>=6.7.0",
]

# Fun-Audio-Chat-8B S2S reference + vllm-omni port dependencies.
# Exact pins captured from a known-good .venv used to produce clean S2S
# audio (design/IMPLEMENTATION-STATUS.md). Run:
#   uv lock --extra fun-audio-chat-ref
#   uv sync --frozen --extra fun-audio-chat-ref
# to recreate the environment bit-for-bit.
fun-audio-chat-ref = [
    # vllm is intentionally excluded from the top-level dynamic deps (see
    # setup.py comment) because its console_scripts overlap with vllm-omni's.
    # Pin it here so `uv sync --extra fun-audio-chat-ref` produces a working
    # server env. Use `vllm-omni serve ...` at the CLI, not `vllm serve ...`.
    "vllm==0.19.1",
    # Pin torch/torchaudio to the build that works against this box's driver
    # (CUDA 12.4). torch 2.11 resolves to +cu130 and misses libcusparseLt.so.0
    # which isn't provided by CUDA 12.4.
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "accelerate==1.12.0",
    "conformer==0.3.2",
    "diffusers==0.37.1",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.2",
    # ruamel.yaml 0.18+ introduced composer.py max_depth check that assumes
    # it's on the Loader subclass; hyperpyyaml 1.2.2's Loader doesn't define
    # it, so CosyVoice3 yaml load dies with "'Loader' object has no attribute
    # 'max_depth'". Pin <0.18 until hyperpyyaml is upgraded upstream.
    "ruamel-yaml<0.18",
    # Transitively imported by cosyvoice.flow.flow_matching at yaml load time
    # (not a real download dependency in our path — we supply the model files
    # locally — but the import must resolve).
    # CosyVoice's flow_matching yaml is resolved via pydoc.locate() at load
    # time; that traverses every trainer module and forces import of these
    # training-only deps even during inference. List everything.
    "gdown",
    "matplotlib",
    "tensorboard",
    "deepspeed; sys_platform == 'linux'",
    "wget",
    "networkx",
    "grpcio-tools",
    "fastapi",
    "fastapi-cli",
    # gradio is only for CosyVoice's web demo which we don't invoke.
    "onnx",
    "protobuf",
    "rich",
    "uvicorn",
    "pydantic",
    "inflect==7.3.1",
    "librosa==0.11.0",
    "lightning==2.2.4",
    "loguru==0.7.3",
    # matcha-tts is loaded from src/funaudiochat/third_party/CosyVoice/third_party/Matcha-TTS
    # via PYTHONPATH at runtime; we don't install the PyPI package because it
    # pins gradio==3.43.2 which conflicts with the demo extra's gradio>=6.7.
    "modelscope==1.36.1",
    # numpy: reference repo pins <2.0.0 but vllm 0.19 → opencv-python-headless
    # ≥4.13 wants numpy≥2. Leave unpinned; uv will pick a compatible version.
    "omegaconf==2.3.0",
    "onnxruntime==1.23.2",
    "onnxruntime-gpu==1.18.0",
    "openai-whisper==20250625",
    "pyarrow==23.0.1",
    "pyworld==0.3.5",
    "scipy==1.15.3",
    "soundfile==0.13.1",
    "transformers==5.5.4",
    "wetext==0.1.2",
    "x-transformers==2.18.8",
]

# Seed-TTS serve benchmark WER (BytedanceSpeech/seed-tts-eval run_wer.py protocol).
seed-tts-eval = [
    "jiwer>=3.0.0",
    "zhon>=2.0.0",
    "zhconv>=1.4.2",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "transformers>=4.36.0",
    "funasr>=1.0.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-api-autonav",
    "mkdocs-material",
    "mkdocstrings-python",
    "mkdocs-gen-files",
    "mkdocs-awesome-nav",
    "mkdocs-glightbox",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
    "regex",
    "ruff",
    "pydantic",
]


[tool.uv]
# fun-audio-chat-ref: the reference CosyVoice + onnxruntime-gpu 1.18 stack
# was compiled against numpy 1.x. Force numpy<2 and an older
# opencv-python-headless that's compatible with it; vllm's stated
# opencv-python-headless>=4.13 constraint is too strict (0.19.1 runs fine
# on older opencv in practice).
override-dependencies = [
    "numpy<2",
    "opencv-python<4.13",
    "opencv-python-headless<4.13",
]

# dev and seed-tts-eval bring in deps that genuinely need numpy>=2 (opencv
# 4.13, funasr). Declare them mutually exclusive with fun-audio-chat-ref
# so `uv lock` resolves per-extra.
conflicts = [
    [
        { extra = "dev" },
        { extra = "fun-audio-chat-ref" },
    ],
    [
        { extra = "seed-tts-eval" },
        { extra = "fun-audio-chat-ref" },
    ],
]


[project.urls]
Homepage = "https://github.com/vllm-project/vllm-omni"
Repository = "https://github.com/vllm-project/vllm-omni"
Documentation = "https://vllm-omni.readthedocs.io"
"Bug Tracker" = "https://github.com/vllm-project/vllm-omni/issues"

[project.scripts]
vllm = "vllm_omni.entrypoints.cli.main:main"
vllm-omni = "vllm_omni.entrypoints.cli.main:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_omni*"]

[tool.setuptools.package-data]
"vllm_omni" = ["_version.py", "py.typed"]
"vllm_omni.model_executor.stage_configs" = ["*.yaml"]

[tool.setuptools_scm]
# no extra settings needed, presence enables setuptools-scm

[tool.ruff]
line-length = 120
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "build",
    "dist",
    "vllm_omni.egg-info",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (handled separately, but included for compatibility)
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    # W503 is not needed in ruff as it's compatible with black by default
    "N801",  # class names should use CapWords convention
    "N802",  # function name should follow snake_case
    "N806",  # variable in function should follow snake_case
    "N812",  # lowercase imported as non-lowercase: functional as F
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E501"]  # Allow long lines in examples
"tests/**" = ["E501"]  # Allow long lines in tests

[tool.mypy]
python_version = "3.12, 3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config"
]
markers = [
    # ci/cd required
    "core_model: L1&L2 tests (run in each PR)",
    "advanced_model: L3&L4 level tests (run in each merge or nightly)",
    # function module markers
    "diffusion: Diffusion model tests",
    "omni: Omni model tests",
    "cache: Cache backend tests",
    "parallel: Parallelism/distributed tests",
    "example: Doc example code tests",
    # platform markers
    "cpu: Tests that run on CPU",
    "gpu: Tests that run on GPU (auto-added)",
    "cuda: Tests that run on CUDA (auto-added)",
    "rocm: Tests that run on AMD/ROCm (auto-added)",
    "xpu: Tests that run on XPU (auto-added)",
    "npu: Tests that run on NPU/Ascend (auto-added)",
    "musa: Tests that run on MUSA/Moore Threads (auto-added)",
    # specified computation resources marks (auto-added)
    "H100: Tests that require H100 GPU",
    "L4: Tests that require L4 GPU",
    "MI325: Tests that require MI325 GPU (AMD/ROCm)",
    "B60: Tests that require Intel Arc Pro B60 XPU",
    "S5000: Tests that require S5000 GPU (Moore Threads/MUSA)",
    "A2: Tests that require A2 NPU",
    "A3: Tests that require A3 NPU",
    "distributed_cuda: Tests that require multi cards on CUDA platform",
    "distributed_rocm: Tests that require multi cards on ROCm platform",
    "distributed_xpu: Tests that require multi cards on XPU platform",
    "distributed_npu: Tests that require multi cards on NPU platform",
    "distributed_musa: Tests that require multi cards on MUSA platform",
    "skipif_cuda: Skip if the num of CUDA cards is less than the required",
    "skipif_rocm: Skip if the num of ROCm cards is less than the required",
    "skipif_xpu: Skip if the num of XPU cards is less than the required",
    "skipif_npu: Skip if the num of NPU cards is less than the required",
    "skipif_musa: Skip if the num of MUSA cards is less than the required",
    # more detailed markers
    "slow: Slow tests (may skip in quick CI)",
    "benchmark: Benchmark tests",
]
filterwarnings = [
    "ignore:.*does not have '__test__' attribute.*:UserWarning",
    "ignore:.*does not have '__bases__' attribute.*:UserWarning",
]

[tool.typos.default]
extend-ignore-identifiers-re = [
    ".*_thw",
    ".*thw",
    "ein",
    ".*arange",
    ".*MoBA",
    ".*temperal_downsample",
    ".*_nd",
    ".*nothink.*",
    ".*NOTHINK.*",
    ".*nin.*",
    ".*[Oo]no_[Aa]nna.*",
    ".*cann.*",
]
[tool.typos.default.extend-words]
ue = "ue"
semantics = "semantics"
fullset = "fullset"
Vai = "Vai"
