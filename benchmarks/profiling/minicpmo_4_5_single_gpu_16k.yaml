# Stress-test layout for MiniCPM-o 4.5 on one 96 GiB GPU.
#
# Stage 0 accepts up to four video items in one 16,384-token request. Text-only
# output keeps stage 1 idle during the encoder measurements. This is not a
# recommended speech-serving layout.
async_chunk: false

trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_model_len: 16384
    max_num_seqs: 1
    gpu_memory_utilization: 0.60
    enforce_eager: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    devices: "0"
    limit_mm_per_prompt:
      image: 4
      audio: 1
      video: 4
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 128
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    enforce_eager: true
    max_num_batched_tokens: 16384
    devices: "0"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      seed: 42
      detokenize: false

platforms: {}
