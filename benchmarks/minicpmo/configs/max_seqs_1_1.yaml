async_chunk: false
trust_remote_code: true
enable_prefix_caching: false

stages:
  - stage_id: 0
    max_num_seqs: 1
    max_model_len: 8192
    gpu_memory_utilization: 0.7
    enforce_eager: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 8192
    devices: "0"
    limit_mm_per_prompt:
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    max_num_seqs: 1
    max_model_len: 4096
    gpu_memory_utilization: 0.75
    enforce_eager: true
    max_num_batched_tokens: 4096
    devices: "1"
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      seed: 42
      detokenize: false

platforms: {}
