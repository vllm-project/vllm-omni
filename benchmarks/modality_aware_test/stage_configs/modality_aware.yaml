# Stage config for Modality-Aware Scheduler
# Uses OmniModalityAwareScheduler with omni_modality_aware scheduling policy
# Stage 0: Thinker (multimodal understanding + text generation)

# NOTE: 
# When using "omni_modality_aware" for global scheduling_policy,
# the stage with encoders (usually stage 0) will use 
# vllm_omni.core.sched.omni_modality_aware_scheduler.OmniModalityAwareScheduler
# which implements the modality-aware batching optimization.
runtime:
  scheduling_policy: "omni_modality_aware"
  omni_modality_aware_config:
    # encoder_gain_alpha: Minimum encoder utilization threshold
    # e.q. if waiting image tokens is greater than 768, we can open image encoder forwarding for image requests
    # otherwise wait for a while to see if there will be more image request for batching.
    encoder_gain_threshold: 768
    # starve_threshold: Maximum wait time before starvation rescue (in seconds)
    # 10 means when a request waits for more than 10s, it should be scheduled 
    # regardless of its modality (to prevent starvation)
    # for a alpha system + small tp number testing, it is recommended to use a large number to ban starvation rescue.
    # in an optimized on-line serving setting, it should match the time of one encoder+decoder forwarding.
    starve_threshold: 10

stage_args:
  - stage_id: 0
    runtime:
      devices: "0,1"
      max_batch_size:  256
    engine_args:
      model_stage: thinker
      model_arch: Qwen3OmniMoeForConditionalGeneration
      worker_cls: vllm_omni.worker.gpu_ar_worker.GPUARWorker
      scheduler_cls: vllm_omni.core.sched.omni_modality_aware_scheduler.OmniModalityAwareScheduler
      gpu_memory_utilization: 0.7
      enforce_eager: true
      trust_remote_code: true
      allowed_local_media_path: "/root/data"
      engine_output_type: latent
      distributed_executor_backend: "mp"
      enable_prefix_caching: false
      max_num_batched_tokens: 8192
      max_model_len: 4096
      max_num_seqs:  256
      hf_config_name: thinker_config
      tensor_parallel_size: 2
      enable_mm_embeds: true 
    final_output: true
    final_output_type: text
    is_comprehension: true
    default_sampling_params:
      temperature: 0
      top_p: 0.9
      top_k: 1
      max_tokens: 10
      seed: 42
      detokenize: true
      repetition_penalty: 1.05
      ignore_eos: true
      stop_token_ids: []
      stop: []


