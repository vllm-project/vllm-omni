# Short real-checkpoint PR smoke; full regression profiles stay at 480x832.
pipeline: lingbot_world
async_chunk: false
distributed_executor_backend: mp
dtype: bfloat16

stages:
  - stage_id: 0
    devices: "0"
    # AR-Diffusion binds one session per runner invocation; the runner rejects
    # anything larger.
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: LingBotWorldCausalDMDPipeline
    engine_backend: vllm_omni.experimental.ar_diffusion.engine.ARDiffusionEngine
    step_execution: true
    streaming_output: true
    default_sampling_params:
      # The causal-fast checkpoint pins a four-step DMD schedule; this sizes the
      # step budget before the pipeline is reached.
      num_inference_steps: 4
      output_type: pil
      extra_args:
        flow_shift: 5.0
    model_config:
      # The AR cache geometry is fixed at load time, so a benchmark request must
      # ask for exactly this resolution.
      ar_diffusion_height: 192
      ar_diffusion_width: 320
      ar_diffusion_kv_config:
        gpu_memory_fraction: 0.6
        warmup_cudagraph: true
