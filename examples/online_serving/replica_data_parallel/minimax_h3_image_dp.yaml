# MiniMax-H3-Image: one complete diffusion pipeline per replica/GPU.
# The shared run_server.sh substitutes the replica count and device pool.
# The example targets request throughput; use SP4 for lower C1 latency.
trust_remote_code: true
distributed_executor_backend: mp

stages:
  - stage_id: 0
    num_replicas: __NUM_REPLICAS__
    devices: "__DEVICES__"
    max_num_seqs: 1
    tensor_parallel_size: 1
    sequence_parallel_size: 1
    ulysses_degree: 1
    ring_degree: 1
    allgather_degree: 1
    cfg_parallel_size: 1
    vae_patch_parallel_size: 1
    text_encoder_tp_size: 1
    enforce_eager: true
    enable_cuda_graph_decode: false
    diffusion_attention_config:
      default: FLASH_ATTN
    engine_extras:
      additional_config:
        text_encoder_cudnn_sdp: false
    default_sampling_params:
      seed: 42
      num_inference_steps: 6
