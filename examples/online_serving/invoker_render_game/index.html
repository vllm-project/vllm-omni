<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invoker-Render 赛车 · vLLM-Omni</title>
  <link rel="icon" type="image/svg+xml" href="./vllm-omni-mark.svg">
  <style>
    :root {
      color-scheme: dark;
      font: 1rem/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      --page: #131719;
      --surface: #1b2022;
      --screen: #0c1012;
      --line: #32393c;
      --control-line: #606b70;
      --text: #f0f3f1;
      --muted: #a9b6b5;
      --accent: #f1b844;
      --accent-blue: #54a0f8;
      --error: #ffaaa1;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); }
    h1, h2, p, figure, dl, dd { margin: 0; }
    ::selection { color: var(--screen); background: var(--accent-blue); }
    :focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 3px; }

    .page {
      max-width: 92rem;
      margin-inline: auto;
      padding: 0 2.5rem 2.5rem;
    }

    .masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem 1.5rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .identity {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem 1rem;
      min-width: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding-inline-end: 1rem;
      border-inline-end: 1px solid var(--line);
      font-size: .875rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand img { display: block; }

    h1 {
      font-size: 1.625rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    h1 span {
      display: inline-block;
      margin-inline-start: .45em;
      color: var(--muted);
      font-size: .875rem;
      font-weight: 500;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .session-status {
      display: flex;
      align-items: baseline;
      gap: .55rem;
      max-width: 26rem;
      font-size: .8125rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .session-status::before {
      content: "";
      flex: 0 0 .45rem;
      height: .45rem;
      margin-bottom: .08rem;
      border-radius: 50%;
      background: currentColor;
    }

    .session-status[data-state="active"] { color: var(--accent-blue); }
    .session-status[data-state="error"] { color: var(--error); }

    .console {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 20rem;
      align-items: start;
      gap: 1.75rem;
      margin-top: 1.5rem;
    }

    .side { display: grid; gap: 1.25rem; min-width: 0; }

    .section-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: .25rem 1rem;
      margin-bottom: .625rem;
    }

    h2 { font-size: 1rem; font-weight: 640; }

    .metadata, .field-note {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
    }

    .monitor {
      position: relative;
      display: grid;
      aspect-ratio: 7 / 4;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--screen);
    }

    canvas, video {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: contain;
    }

    .waiting {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      border-radius: inherit;
      background: radial-gradient(ellipse at center, #171e20, var(--screen) 72%);
      color: var(--muted);
      text-align: center;
      font-size: .875rem;
    }

    .waiting[hidden] { display: none; }

    .frame-counts {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.5rem;
      padding: .75rem .125rem;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .8125rem;
    }

    .frame-counts > div { display: flex; align-items: baseline; gap: .5rem; }
    .frame-counts dd { color: var(--text); font-variant-numeric: tabular-nums; }

    .controls-note {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .375rem .625rem;
      margin-top: .75rem;
      color: var(--muted);
      font-size: .75rem;
    }

    .controls-note span { white-space: nowrap; }

    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 1.25rem;
      margin-inline-end: .2rem;
      padding-inline: .2rem;
      border: 1px solid var(--line);
      border-radius: .25rem;
      background: var(--surface);
      color: var(--text);
      font: 600 .6875rem/1.125rem system-ui, sans-serif;
    }

    form {
      display: grid;
      gap: .75rem;
      min-width: 0;
      padding-top: .875rem;
      border-top: 1px solid var(--line);
    }

    label { display: grid; gap: .375rem; min-width: 0; font-size: .8125rem; }
    .field-label { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .25rem 1rem; }

    input, textarea, button {
      min-height: 2.75rem;
      border: 1px solid var(--control-line);
      border-radius: .375rem;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    input, textarea { width: 100%; min-width: 0; padding: .5rem .625rem; caret-color: var(--accent-blue); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    #endpoint { font-family: ui-monospace, monospace; font-size: .75rem; }
    #reference { padding: .25rem .375rem; }

    input::file-selector-button {
      min-height: 2.125rem;
      margin-inline-end: .5rem;
      padding-inline: .625rem;
      border: 1px solid var(--control-line);
      border-radius: .25rem;
      background: var(--page);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    input::file-selector-button:hover { background: var(--line); }
    textarea { resize: vertical; }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: .5rem;
      margin-top: .125rem;
    }

    button { padding-inline: .75rem; font-size: .8125rem; font-weight: 620; cursor: pointer; }
    button:hover:not(:disabled) { background: var(--line); }
    button:active:not(:disabled) { border-color: var(--accent); }
    #start:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--screen); }
    #start:hover:not(:disabled) { background: #ffcc70; }
    button:disabled { border-color: var(--line); color: var(--muted); cursor: default; }

    @media (max-width: 58rem) {
      .page { padding-inline: 1.5rem; }
      .console { grid-template-columns: minmax(0, 1fr) 17rem; gap: 1.25rem; }
    }

    @media (max-width: 46rem) {
      .page { padding: 0 1rem 1.5rem; }
      .masthead { padding-block: 1rem; }
      .brand { padding-inline-end: 0; border-inline-end: 0; }
      h1 { font-size: 1.375rem; }
      .console { grid-template-columns: minmax(0, 1fr); margin-top: 1.25rem; }
      #endpoint, input, textarea { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="identity">
        <div class="brand">
          <img src="./vllm-omni-mark.svg" width="22" height="23" alt="">
          <span>vLLM-Omni</span>
        </div>
        <h1>Invoker-Render <span>赛车控制台</span></h1>
      </div>
      <p id="session-status" class="session-status" role="status">
        <span id="status">正在载入赛车场景</span>
      </p>
    </header>

    <main class="console">
      <section aria-labelledby="render-title">
        <div class="section-line">
          <h2 id="render-title">生成画面</h2>
          <span id="render-format" class="metadata">1344 × 768 · 24 FPS</span>
        </div>
        <div class="monitor">
          <video id="vllm-streaming-video-player" aria-label="生成画面" autoplay muted playsinline></video>
          <div id="render-waiting" class="waiting">开局后在这里播放生成画面</div>
        </div>
        <dl class="frame-counts">
          <div><dt>已发送</dt><dd id="sent-frames">0 帧</dd></div>
          <div><dt>已播放</dt><dd id="played-frames">0 帧</dd></div>
        </dl>
      </section>

      <div class="side">
        <section aria-labelledby="proxy-title">
          <div class="section-line">
            <h2 id="proxy-title">游戏代理</h2>
            <span class="metadata">448 × 256</span>
          </div>
          <div class="monitor">
            <canvas id="proxy" width="448" height="256" tabindex="0" aria-describedby="controls-note"></canvas>
          </div>
          <p id="controls-note" class="controls-note">
            <span>点击画布后</span>
            <span><kbd>W</kbd>加速</span>
            <span><kbd>A</kbd><kbd>D</kbd>转向</span>
            <span><kbd>S</kbd>刹车</span>
          </p>
        </section>

        <form id="inputs" aria-labelledby="settings-title">
          <h2 id="settings-title">会话设置</h2>
          <label>vLLM-Omni 服务地址
            <input id="endpoint" type="url" value="ws://127.0.0.1:8091/v1/realtime/video" spellcheck="false" required>
          </label>
          <label>
            <span class="field-label">参考图 <span class="field-note">1344 × 768</span></span>
            <input id="reference" type="file" accept="image/*" required>
          </label>
          <label>冻结提示词
            <textarea id="prompt" rows="2" placeholder="粘贴 artifact 里的冻结提示词" required></textarea>
          </label>
          <div class="actions">
            <button id="start" type="submit" disabled>开局</button>
            <button id="finish" type="button" disabled>结束并排空</button>
            <button id="cancel" type="button" disabled>取消</button>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="./video-stream-view.js"></script>
  <script type="module" src="./game.mjs"></script>
</body>
</html>
