# Matched 2048x2048 PP=2 run: identical AR config, DiT/VAE on GPU 2+3.
async_chunk: false
pipeline: mammoth_moda2
stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    max_num_seqs: 1
    max_model_len: 18432
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.85
    dtype: half
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
  - stage_id: 1
    devices: "2,3"
    max_num_seqs: 1
    gpu_memory_utilization: 0.7
    dtype: half
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
