# Three 24 GiB RTX 3090s: AR tensor parallelism on GPU 0+1, DiT/VAE on GPU 2.
# Experiment-only deployment; the existing recipe remains unchanged.
async_chunk: false
pipeline: mammoth_moda2
stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    max_num_seqs: 1
    max_model_len: 6144
    gpu_memory_utilization: 0.85
    dtype: half
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
  - stage_id: 1
    devices: "2"
    max_num_seqs: 1
    gpu_memory_utilization: 0.7
    dtype: half
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
