# 1280x1024 smoke on four 24 GiB RTX 3090s: AR TP=2 on GPU 0+1,
# DiT SP=2 and VAE PP=2 on GPU 2+3.
# For 2048x2048, use mammoth-4gpu-2048-pp2.yaml instead: the AR grid
# requires 16,513 generated tokens, beyond this config's 6144 context.
async_chunk: false
pipeline: mammoth_moda2
stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    max_num_seqs: 1
    max_model_len: 6144
    gpu_memory_utilization: 0.85
    dtype: half
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
  - stage_id: 1
    devices: "2,3"
    max_num_seqs: 1
    gpu_memory_utilization: 0.7
    dtype: half
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
